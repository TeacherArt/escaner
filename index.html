<title>Camera scanner</title>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#120E26;color:#fff;font-family:Figtree,-apple-system,system-ui,sans-serif}
button{font:inherit;color:inherit;border:0;cursor:pointer}
.app{display:flex;flex-direction:column;gap:12px;min-height:100vh;padding:max(14px,env(safe-area-inset-top)) 16px 110px;max-width:620px;margin:0 auto}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.top h1{font-size:20px;font-weight:800;margin:0}
.top small{display:block;font-size:13px;opacity:.7;font-weight:600}

.modos button.on{background:#fff;color:#120E26;opacity:1}
.video{position:relative;border-radius:26px;overflow:hidden;background:#000;aspect-ratio:3/4;max-height:58vh;width:100%}
.video video,.video canvas{position:absolute;inset:0;width:100%;height:100%}
.video video{object-fit:cover}
.marco{position:absolute;inset:10%;border:3px solid rgba(255,255,255,.85);border-radius:28px;pointer-events:none}
.msg{position:absolute;left:12px;right:12px;bottom:12px;text-align:center;font-size:14px;margin:0}
.res{border-radius:20px;padding:12px 16px;background:rgba(255,255,255,.1);transition:background .15s}
.res b{display:block;font-size:19px;font-weight:800}.res span{font-size:14px;opacity:.85}
.res.ok{background:#1F9D62}.res.mal{background:#E5484D}
.clave{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.clave span{font-size:14px;opacity:.8;margin-right:4px}
.clave button{width:46px;height:46px;border-radius:14px;background:rgba(255,255,255,.12);font-weight:900;font-size:18px}
.clave button.on{background:#1F9D62}
.barras{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.barra{background:rgba(255,255,255,.08);border-radius:14px;padding:8px;text-align:center;font-weight:800}
.barra.ok{background:#1F9D62}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:6px}
.tile{height:54px;border-radius:12px;background:rgba(255,255,255,.1);font-weight:800;font-size:15px;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05}
.tile small{font-size:9px;font-weight:600;opacity:.8;max-width:50px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.tile.on{background:#1F9D62}.tile.mal{background:#E5484D}.tile.med{background:#D99A0B}
.tile i{position:absolute;top:-5px;right:-5px;min-width:20px;height:20px;border-radius:10px;background:#7C5CFF;font-style:normal;font-size:12px;display:grid;place-items:center}
.nota{font-size:13px;opacity:.7;margin:0}
.btns{display:flex;gap:10px;position:fixed;left:0;right:0;bottom:0;padding:12px 16px max(14px,env(safe-area-inset-bottom));background:linear-gradient(transparent,#120E26 35%);max-width:620px;margin:0 auto}
.btns button{flex:1;padding:16px;border-radius:999px;font-weight:800;font-size:16px}
.ok-btn{background:#7C5CFF}.sec{background:#2A2545}
</style>
</head>

</div>
