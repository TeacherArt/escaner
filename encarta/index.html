do. El presidente Porfirio Díaz la apoyó y estuvo en su examen.", "repaso"], ["Cómo la leímos", "Para saber de qué trata: título, primeras líneas y fotos (skimming). Para las fechas: busca números (scanning).", "repaso"]], "recursos": [{"tipo": "foto", "id": "FOTO-MATILDE", "donde": "Línea del tiempo y foto de perfil del chat · Qué: Fotografía histórica de Matilde Montoya (la misma de la p. 42 del libro) · Fuente: Wikimedia Commons, dominio público. No generes su rostro con IA. Verifica la licencia y escribe el crédito debajo.", "texto": ""}, {"tipo": "imagen", "id": "IMG-E2-05-1", "donde": "Encabezado del artículo (sin personas)", "texto": "Prompt:\n```\nAn old 19th-century medical book open on a wooden desk, a brass stethoscope, an inkwell with a quill and a rolled diploma tied with a red ribbon, warm window light. Contemporary Latin American editorial illustration for a children's magazine, made by a professional illustrator: hand-painted digital gouache look with visible brush strokes, dry-brush and fine grain textures and a subtle paper texture; bold saturated palette of vermilion orange, marigold yellow, deep teal green and emerald, with small touches of pink and cream; lush stylized leaves and flowers framing the scene; characters built from simple rounded shapes, rosy cheeks, small dot eyes and expressive gestures; flat layered composition. Avoid glossy 3D render, airbrushed gradients, photorealism, generic clip art and plastic shine. No text, no letters, no numbers, no logos. Framing: horizontal 16:9.\n```"}, {"tipo": "audio", "id": "AUD-E2-05-L", "donde": "Un audio por punto de la línea (7 archivos)", "habla": "Profesor Arturo (tu voz)", "texto": "1859 · March 14th: She was born in Mexico City. / Age 4: She could read and write. / Age 11: She was ready to attend high school. / Age 14: She took courses at the school of Medicine. / Before 1887: She worked as a midwife in Cuernavaca. / 1887 · August 24th: She passed her exam. She was the first female doctor in Mexico. / 1938 · January 26th: She passed away."}], "interactivos": [{"tipo": "Línea del tiempo", "titulo": "La vida de Matilde Montoya", "contenido": {"cab": ["Fecha", "Oración (con audio)", "Significado"], "puntos": [["1859 · March 14th", "She was born in Mexico City.", "Nació en la Ciudad de México."], ["Age 4", "She could read and write.", "Ya sabía leer y escribir."], ["Age 11", "She was ready to attend high school.", "Estaba lista para la escuela superior."], ["Age 14", "She took courses at the school of Medicine.", "Tomó cursos en la Escuela de Medicina."], ["Before 1887", "She worked as a midwife in Cuernavaca.", "Trabajó como partera en Cuernavaca."], ["1887 · August 24th", "She passed her exam. She was the first female doctor in Mexico.", "Aprobó su examen: la primera médica de México."], ["1938 · January 26th", "She passed away.", "Falleció."]], "extra": "", "funcionamiento": "Puntos de izquierda a derecha; al tocar: oración en inglés con audio y su significado en español."}, "parte": "repaso", "mp3s": ["AUD-E2-05-L-1", "AUD-E2-05-L-2", "AUD-E2-05-L-3", "AUD-E2-05-L-4", "AUD-E2-05-L-5", "AUD-E2-05-L-6", "AUD-E2-05-L-7"]}], "actividades": [{"id": "A1", "tipo": "ordenar", "titulo": "Story Order: Matilde", "instrucciones": "Ordena los momentos de su vida.", "contenido": {"series": [["At age 4, she could read and write.", "At age 14, she took courses at the school of Medicine.", "She worked as a midwife in Cuernavaca.", "In 1887, she passed her exam.", "In 1938, she passed away."]]}, "nota": "Si falla: «Busca las pistas de tiempo: edades y años»."}, {"id": "A2", "tipo": "relacionar", "titulo": "Números de una vida", "instrucciones": "Une cada número con lo que pasó.", "contenido": [["4", "She could read and write."], ["11", "She was ready to attend high school."], ["14", "She took courses at the school of Medicine."], ["1887", "She passed her exam."], ["1938", "She passed away."]], "nota": ""}, {"id": "A3", "tipo": "opción múltiple", "titulo": "Scanning: Matilde", "instrucciones": "Busca el dato en la línea del tiempo.", "contenido": [["¿De qué trata?", ["La vida de la primera médica de México ✓", "Una leyenda", "Un hospital"]], ["¿En qué año aprobó su examen?", ["1887 ✓", "1938", "1859"]], ["¿Dónde trabajó como partera?", ["Cuernavaca ✓", "Zumpango", "Chicago"]], ["¿Qué hacía a los 4 años?", ["Leía y escribía ✓", "Trabajaba", "Presentó su examen"]], ["¿Quién estuvo en su examen?", ["El presidente Porfirio Díaz ✓", "Benito Juárez", "Frida Kahlo"]]], "nota": ""}], "libreta": "Completa tu reloj de arena con 4 momentos de Matilde (año o edad y lo que pasó).", "usos": [{"momento": "antes", "sesion": "S5", "minutos": 3, "alumno": "Mira la foto y lee «¿Quién es ella?».", "docente": "En el paso «Predicción» de la S5 pregunta primero a quien vio el avance.", "conexion": "Libro p. 42."}, {"momento": "después", "sesion": "S5", "minutos": 8, "alumno": "Explora la línea del tiempo y juega A1 a A3.", "docente": "Sin preparación.", "conexion": "Reloj de arena de la libreta y libro pp. 42–43."}], "entrega": null, "semana": 2}, {"id": "E2-06", "titulo_en": "Words in context", "titulo_es": "Palabras por contexto", "grado": "2°", "tarjeta": "2° · Past Simple (Lives We Remember)", "mes": "Octubre", "semana_cal": 2, "habilita": "Lunes 19 de octubre", "modo": "casa", "sesion": "Antes de la S6 (avance) y después (práctica y encuesta del proyecto)", "objetivo": "Descubro qué significa una palabra por las pistas de la oración, sin diccionario, y elijo la historia de mi proyecto.", "aula": null, "articulo": [["Sin diccionario", "Muchas veces puedes adivinar qué significa una palabra por las otras palabras de la oración: son pistas.", "avance"], ["Ejemplo", "My grandma was a midwife. She helped many women have their babies at home. ¿Qué es una midwife? La pista: helped women have their babies.", "avance"], ["Las palabras de la página 44", "midwife · youngster · get sick · older adults · used to · passed away · immodest · struggle · due to.", "repaso"], ["used to", "People used to wash clothes in the river. = Antes la gente lavaba la ropa en el río (ya no). Sirve para hablar de lo que cambió.", "repaso"], ["Nuestro proyecto", "Lives We Remember: una línea del tiempo de 4 momentos, una reflexión y una grabación. Opciones: (a) alguien que tu familia recuerda en Día de Muertos · (b) una persona mayor de la comunidad · (c) un suceso de la escuela o la comunidad · (d) una persona o suceso de la historia o de tu revista. Nadie tiene que compartir algo doloroso: la (d) siempre está disponible.", "repaso"], ["La entrevista", "5 preguntas en español, con fechas, durante el fin de semana largo.", "repaso"]], "recursos": [{"tipo": "imagen", "id": "IMG-E2-06-1", "donde": "Encabezado del artículo", "texto": "Prompt:\n```\nA detective magnifying glass over an open book with highlighted words glowing softly, small arrows pointing from surrounding words to the highlighted one, warm desk light. Contemporary Latin American editorial illustration for a children's magazine, made by a professional illustrator: hand-painted digital gouache look with visible brush strokes, dry-brush and fine grain textures and a subtle paper texture; bold saturated palette of vermilion orange, marigold yellow, deep teal green and emerald, with small touches of pink and cream; lush stylized leaves and flowers framing the scene; characters built from simple rounded shapes, rosy cheeks, small dot eyes and expressive gestures; flat layered composition. Avoid glossy 3D render, airbrushed gradients, photorealism, generic clip art and plastic shine. No text, no letters, no numbers, no logos. Framing: horizontal 16:9.\n```"}, {"tipo": "audio", "id": "AUD-E2-06-P", "donde": "Una por tarjeta (9 archivos)", "habla": "Voz sintética en inglés de Estados Unidos, velocidad 0.85", "texto": "La palabra dos veces y su oración: «midwife. midwife. My grandma was a midwife…» Lista completa en las tarjetas."}], "interactivos": [{"tipo": "Tarjetas que se voltean", "titulo": "Palabras de la página 44", "contenido": [{"palabra": "midwife", "afi": "/ˈmɪdwaɪf/", "parecido": "«mi» de «mira» + d + u + «ai» de «aire» + f · significa: partera", "ejemplo": "My grandma was a midwife. She helped many women have their babies at home.", "familia": "", "imagen": null, "mp3": "AUD-E2-06-P-1"}, {"palabra": "youngster", "afi": "/ˈjʌŋstər/", "parecido": "«ya» de «ya» con a relajada + ng nasal + «ster» de «ester» sin la e · significa: joven", "ejemplo": "When my dad was a youngster, he played in the street all day.", "familia": "", "imagen": null, "mp3": "AUD-E2-06-P-2"}, {"palabra": "get sick", "afi": "/ɡɛt sɪk/", "parecido": "«gue» de «guerra» + t + «si» de «silla» + k · significa: enfermarse", "ejemplo": "If you don't eat well, you can get sick.", "familia": "", "imagen": null, "mp3": "AUD-E2-06-P-3"}, {"palabra": "older adults", "afi": "/ˈoʊldər əˈdʌlts/", "parecido": "«ol» de «olvido» con u breve + «der» + a + «dal» de «dalia» + ts · significa: adultos mayores", "ejemplo": "Older adults in my family tell great stories about the past.", "familia": "", "imagen": null, "mp3": "AUD-E2-06-P-4"}, {"palabra": "used to", "afi": "/ˈjuːst tə/", "parecido": "«iu» de «ciudad» + st + «ta» suave; se dice todo junto · significa: antes acostumbraba (y ya no)", "ejemplo": "People in my town used to wash clothes in the river. Now they have washing machines.", "familia": "", "imagen": null, "mp3": "AUD-E2-06-P-5"}, {"palabra": "passed away", "afi": "/pæst əˈweɪ/", "parecido": "«past» de «pasta» sin la a + a + u + «ei» de «reina» · significa: falleció", "ejemplo": "My grandpa passed away in 2019. We remember him on Day of the Dead.", "familia": "", "imagen": null, "mp3": "AUD-E2-06-P-6"}, {"palabra": "immodest", "afi": "/ɪˈmɑːdɪst/", "parecido": "i + «ma» de «mamá» + «dist» de «distancia» · significa: impúdica (así llamaban a quien hablaba del cuerpo)", "ejemplo": "Some people called Matilde immodest because she studied the human body. That was unfair.", "familia": "", "imagen": null, "mp3": "AUD-E2-06-P-7"}, {"palabra": "struggle", "afi": "/ˈstrʌɡəl/", "parecido": "s + «tra» de «trapo» con a relajada + «gol» de «gol» suave · significa: lucha, algo muy difícil", "ejemplo": "Learning English was a struggle for Ana, but she practiced every day.", "familia": "", "imagen": null, "mp3": "AUD-E2-06-P-8"}, {"palabra": "due to", "afi": "/ˈduː tə/", "parecido": "«du» de «duda» + «ta» suave · significa: debido a", "ejemplo": "The class was canceled due to the rain.", "familia": "", "imagen": null, "mp3": "AUD-E2-06-P-9"}], "mp3s": ["AUD-E2-06-P-1", "AUD-E2-06-P-2", "AUD-E2-06-P-3", "AUD-E2-06-P-4", "AUD-E2-06-P-5", "AUD-E2-06-P-6", "AUD-E2-06-P-7", "AUD-E2-06-P-8", "AUD-E2-06-P-9"]}, {"tipo": "Encuesta del grupo", "titulo": "¿Qué opción de proyecto elegiste?", "contenido": {"opciones": ["(a) Alguien que mi familia recuerda", "(b) Una persona mayor de la comunidad", "(c) Un suceso de la escuela o la comunidad", "(d) Una persona o suceso de la historia o de mi revista"], "muestra": "El alumno ve el total del grupo; tú ves quién eligió qué."}, "parte": "repaso"}], "actividades": [{"id": "A1", "tipo": "opción múltiple", "titulo": "Guess the Word", "instrucciones": "Lee la oración y elige el significado de la palabra en negritas.", "contenido": [["My grandma was a **midwife**. She helped many women have their babies at home.", ["partera ✓", "enfermera", "vecina"]], ["When my dad was a **youngster**, he played in the street all day.", ["joven ✓", "anciano", "maestro"]], ["If you don't eat well, you can **get sick**.", ["enfermarse ✓", "curarse", "despertarse"]], ["**Older adults** in my family tell great stories about the past.", ["adultos mayores ✓", "niños pequeños", "maestros"]], ["People in my town **used to** wash clothes in the river. Now they have washing machines.", ["antes acostumbraba (y ya no) ✓", "usó para", "nunca"]], ["My grandpa **passed away** in 2019. We remember him on Day of the Dead.", ["falleció ✓", "se fue de viaje", "pasó la calle"]], ["Some people called Matilde **immodest** because she studied the human body. That was unfair.", ["impúdica (así llamaban a quien hablaba del cuerpo) ✓", "muy inteligente", "muy rica"]], ["Learning English was a **struggle** for Ana, but she practiced every day.", ["lucha, algo muy difícil ✓", "fiesta", "regalo"]], ["The class was canceled **due to** the rain.", ["debido a ✓", "después de", "a pesar de"]]], "nota": "Al fallar se resalta la pista, por ejemplo: «helped women have their babies te dice qué hace una midwife»."}, {"id": "A2", "tipo": "relacionar", "titulo": "Palabra y significado", "instrucciones": "Une cada palabra con su significado.", "contenido": [["midwife", "partera"], ["youngster", "joven"], ["get sick", "enfermarse"], ["older adults", "adultos mayores"], ["used to", "antes acostumbraba"], ["passed away", "falleció"], ["immodest", "impúdica"], ["struggle", "lucha, algo muy difícil"], ["due to", "debido a"]], "nota": ""}, {"id": "A3", "tipo": "completar espacios", "titulo": "Words in Context: Matilde", "instrucciones": "Arrastra la palabra que encaja.", "contenido": [["Matilde wanted to be a doctor. First, she worked as a ___.", "midwife", ""], ["Many people said no; it was a ___.", "struggle", ""], ["She passed her ___ in 1887.", "exam", ""], ["She ___ in 1938.", "passed away", ""]], "nota": "Banco: midwife · struggle · exam · passed away · youngster · due to."}], "libreta": "Escribe 3 palabras de la p. 44 con tu propia oración y la pista que te ayudó.", "usos": [{"momento": "antes", "sesion": "S6", "minutos": 5, "alumno": "Lee el ejemplo de midwife y voltea las tarjetas midwife, struggle y used to.", "docente": "En el crucigrama de la S6 pide a quien vio el avance que explique cómo usó la pista.", "conexion": "Libro p. 44."}, {"momento": "después", "sesion": "S6", "minutos": 8, "alumno": "Juega A1 a A3 y vota su opción de proyecto.", "docente": "Revisa en MyClass la encuesta: habla en privado con quien no eligió opción.", "conexion": "Tema elegido y guía de entrevista en la libreta."}], "entrega": null, "semana": 2}, {"id": "E2-07", "titulo_en": "Asking about the past: did", "titulo_es": "Preguntar en pasado: did", "grado": "2°", "tarjeta": "2° · Past Simple (Lives We Remember)", "mes": "Octubre", "semana_cal": 3, "habilita": "Sábado 24 de octubre", "modo": "casa", "sesion": "Antes de la S7 (avance) y después (práctica para la entrevista)", "objetivo": "Hago preguntas en pasado con did y respondo Yes, I did / No, I didn't para entrevistar a mi familia.", "aula": null, "articulo": [["Una pregunta en pasado", "Did you go to the tianguis? = ¿Fuiste al tianguis? Did /dɪd/ avisa que la pregunta es en pasado.", "avance"], ["¿Qué le pasó a went?", "I went to the tianguis. → Did you go to the tianguis? Did se lleva el pasado y el verbo regresa a su forma base: go.", "repaso"], ["Respuestas cortas", "Yes, I did. / No, I didn't. Y agrega una oración: Yes, I did. I visited my grandpa.", "repaso"], ["Preguntas con When, Where, What", "When did you…? · Where did you…? · What did you…? · Who was your…? · Did you like…?", "repaso"], ["La trampa", "Did you went? ✗ → Did you go? ✓ · Did you visited? ✗ → Did you visit? ✓", "repaso"], ["Tu entrevista en casa", "Este fin de semana largo entrevista a tu familia en español: 5 preguntas, con fechas. Antes practica con la abuela Chayo.", ""], ["Skeleton, skeleton", "Canción del Prof. Arturo Meneses. found es el pasado de find (familia 2: find – found – found).", ""]], "recursos": [{"tipo": "imagen", "id": "IMG-E2-07-1", "donde": "Encabezado del artículo", "texto": "Prompt:\n```\nA joyful cartoon skeleton dancing next to a Mexican ofrenda with marigold flowers, candles, pan de muerto and papel picado, warm candlelight, friendly and not scary. Contemporary Latin American editorial illustration for a children's magazine, made by a professional illustrator: hand-painted digital gouache look with visible brush strokes, dry-brush and fine grain textures and a subtle paper texture; bold saturated palette of vermilion orange, marigold yellow, deep teal green and emerald, with small touches of pink and cream; lush stylized leaves and flowers framing the scene; characters built from simple rounded shapes, rosy cheeks, small dot eyes and expressive gestures; flat layered composition. Avoid glossy 3D render, airbrushed gradients, photorealism, generic clip art and plastic shine. No text, no letters, no numbers, no logos. Framing: horizontal 16:9.\n```"}, {"tipo": "imagen", "id": "IMG-E2-07-2", "donde": "Foto de perfil de la abuela Chayo (personaje inventado)", "texto": "Prompt:\n```\nIllustrated bust portrait of a kind elderly Mexican woman with gray hair in a braid, a rebozo shawl, smiling warmly, a small adobe kitchen in the soft background. Contemporary Latin American editorial illustration for a children's magazine, made by a professional illustrator: hand-painted digital gouache look with visible brush strokes, dry-brush and fine grain textures and a subtle paper texture; bold saturated palette of vermilion orange, marigold yellow, deep teal green and emerald, with small touches of pink and cream; lush stylized leaves and flowers framing the scene; characters built from simple rounded shapes, rosy cheeks, small dot eyes and expressive gestures; flat layered composition. Avoid glossy 3D render, airbrushed gradients, photorealism, generic clip art and plastic shine. No text, no letters, no numbers, no logos. Framing: cuadrado 1:1, retrato de busto.\n```"}, {"tipo": "audio", "id": "AUD-E2-07-S", "donde": "Tarjeta de la canción", "habla": "Profesor Arturo (tu voz) (las dos partes)", "texto": "All: Skeleton, skeleton, dancing around, / what did you find in the ofrenda ground? / Calacas: I found a candle, I found some bread, / I found a flower, orange and red!"}], "interactivos": [{"tipo": "Tabla comparativa", "titulo": "Afirmativa, pregunta y negativa", "contenido": {"columnas": ["Afirmativa", "Pregunta", "Negativa"], "filas": [["I went.", "Did you go?", "I didn't go."], ["I ate.", "Did you eat?", "I didn't eat."], ["I visited.", "Did you visit?", "I didn't visit."], ["I played.", "Did you play?", "I didn't play."]]}, "parte": "repaso"}, {"tipo": "Simulador de chat", "titulo": "Abuela Chayo", "contenido": "Guion completo en la sección «Chats»: CHAT-C.", "chat": "CHAT-C"}, {"tipo": "Tarjeta de canción", "titulo": "Skeleton, skeleton (canción del Prof. Arturo Meneses)", "contenido": {"lineas": ["All: Skeleton, skeleton, dancing around,", "what did you find in the ofrenda ground?", "Calacas: I found a candle, I found some bread,", "I found a flower, orange and red!"], "extra": {"glosario": "found = encontré · bread = pan · candle = vela · flower = flor", "funcionamiento": "Pregunta y respuesta: el alumno elige ser «All» o «Calacas» y su parte se ilumina para cantarla.", "audio": "AUD-E2-07-S"}}}], "actividades": [{"id": "A1", "tipo": "ordenar", "titulo": "Ask the Past", "instrucciones": "Ordena la pregunta. Cuidado: hay una ficha trampa que sobra.", "contenido": {"series": [["Did", "you", "go", "to the tianguis", "?"], ["Where", "did", "you", "live", "?"], ["What", "did", "you", "eat", "?"], ["When", "did", "you", "get up", "?"], ["Did", "you", "visit", "your grandma", "?"]], "trampas": ["went", "lived", "ate", "got", "visited"]}, "nota": "Si usa la trampa: «Did ya lleva el pasado; el verbo regresa a su forma base: Did you go?»."}, {"id": "A2", "tipo": "opción múltiple", "titulo": "¿Cuál está bien?", "instrucciones": "Elige la pregunta o la respuesta correcta.", "contenido": [["Pregunta", ["Did you go to school? ✓", "Did you went to school?", "You did go to school?"]], ["Pregunta", ["What did you eat? ✓", "What did you ate?", "What you ate?"]], ["Pregunta", ["Where did you live? ✓", "Where did you lived?", "Where you did live?"]], ["Did you visit the cemetery?", ["Yes, I did. ✓", "Yes, I visited.", "Yes, I do."]], ["Did you watch TV?", ["No, I didn't. ✓", "No, I don't watched.", "No, I not."]]], "nota": ""}, {"id": "A3", "tipo": "completar espacios", "titulo": "Did, did, didn't", "instrucciones": "Completa.", "contenido": [["___ you play soccer last Saturday?", "Did", ""], ["Yes, I ___.", "did", ""], ["No, I ___.", "didn't", ""], ["What did you ___? (eat)", "eat", "Con did, el verbo va en base."], ["Where did you ___? (go)", "go", ""]], "nota": ""}], "libreta": "Escribe tus 5 preguntas de la entrevista en español y 2 en inglés con did.", "usos": [{"momento": "antes", "sesion": "S7", "minutos": 5, "alumno": "Lee el avance y escucha la canción Skeleton, skeleton.", "docente": "En la S7 la canción ya es conocida para quien la escuchó: que guíen el coro.", "conexion": "Abanico de preguntas de la libreta (S7)."}, {"momento": "después", "sesion": "S7", "minutos": 10, "alumno": "Chatea con la abuela Chayo (CHAT-C) y juega A1 a A3; prepara su entrevista del fin de semana largo.", "docente": "Lee en MyClass las transcripciones del chat y anota los errores frecuentes para la recuperación de la S8.", "conexion": "Guía de entrevista de la S6."}], "entrega": null, "semana": 3}, {"id": "E2-08", "titulo_en": "The rabbit on the moon", "titulo_es": "El conejo en la luna", "grado": "2°", "tarjeta": "2° · Past Simple (Lives We Remember)", "mes": "Octubre", "semana_cal": 3, "habilita": "Sábado 24 de octubre", "modo": "casa", "sesion": "Antes de la S8 (avance) y después (práctica)", "objetivo": "Entiendo una leyenda mesoamericana contada en pasado y explico por qué es valiosa.", "aula": null, "articulo": [["¿Qué ves en la luna?", "Mira la luna llena. En México muchos ven un conejo. Zitlaltepec significa «lugar en el cerro de la estrella» en náhuatl.", "avance"], ["La luna llena del 25 de octubre", "Last Sunday, October 25th, there was a full moon. Did you see the rabbit? Con luna llena el conejo se ve completo; con media luna, solo la mitad.", "avance"], ["Conejos en la luna del mundo", "En China cuentan del Conejo de Jade, que vive en la luna. En Japón, el conejo de la luna prepara mochi, unos pastelitos de arroz. Toca el mapa.", "avance"], ["Un conejo en el espacio", "En 2013, China mandó a la luna un vehículo explorador llamado Yutu, que significa «Conejo de Jade».", "avance"], ["The Rabbit on the Moon", "A long time ago, the god Quetzalcóatl wanted to know the world, so he traveled as a man. He walked for many days. One night, he was very tired and hungry. He sat down near a forest. A little rabbit saw him and asked, “What is wrong?” Quetzalcóatl said, “I am hungry.” The rabbit only had grass. Then the rabbit said, “Eat me.” Quetzalcóatl was very surprised. He lifted the rabbit up to the moon, and the rabbit's picture stayed there. “Now everyone will remember you,” he said. Look at the full moon tonight. Can you see the rabbit? · Glosario: god = dios · tired = cansado · hungry = con hambre · grass = pasto · lifted = levantó · stayed = se quedó.", "repaso"], ["Regulares e irregulares", "Regulares (una línea): wanted, traveled, walked, asked, lifted, stayed. Irregulares (dos líneas): was, sat, saw, had, said.", "repaso"], ["¿Por qué es valiosa?", "I think this legend is important because ___. Las leyendas guardan los valores y la memoria de los pueblos originarios.", "repaso"]], "recursos": [{"tipo": "imagen", "id": "IMG-E2-08-1", "donde": "Base del mapa interactivo", "texto": "Prompt:\n```\nA simple flat world map in soft colors with three highlighted countries: Mexico, China and Japan; a full moon with a rabbit silhouette rising over the Pacific Ocean; no labels. Contemporary Latin American editorial illustration for a children's magazine, made by a professional illustrator: hand-painted digital gouache look with visible brush strokes, dry-brush and fine grain textures and a subtle paper texture; bold saturated palette of vermilion orange, marigold yellow, deep teal green and emerald, with small touches of pink and cream; lush stylized leaves and flowers framing the scene; characters built from simple rounded shapes, rosy cheeks, small dot eyes and expressive gestures; flat layered composition. Avoid glossy 3D render, airbrushed gradients, photorealism, generic clip art and plastic shine. No text, no letters, no numbers, no logos. Framing: horizontal 2:1, mapa mundial simplificado.\n```"}, {"tipo": "imagen", "id": "IMG-E2-08-2", "donde": "Las 4 viñetas de la leyenda (mismo estilo)", "texto": "Prompt:\n```\nFour-panel illustrated legend inspired by Mesoamerican art, respectful and warm: panel 1 a tall traveler wearing a simple cloak and a feathered headdress walking on a path at night under a new moon; panel 2 the traveler sitting tired near a forest under a crescent moon; panel 3 a small white rabbit talking to him under a full moon; panel 4 the traveler lifting the rabbit toward a big moon that shows the rabbit's shape. Contemporary Latin American editorial illustration for a children's magazine, made by a professional illustrator: hand-painted digital gouache look with visible brush strokes, dry-brush and fine grain textures and a subtle paper texture; bold saturated palette of vermilion orange, marigold yellow, deep teal green and emerald, with small touches of pink and cream; lush stylized leaves and flowers framing the scene; characters built from simple rounded shapes, rosy cheeks, small dot eyes and expressive gestures; flat layered composition. Avoid glossy 3D render, airbrushed gradients, photorealism, generic clip art and plastic shine. No text, no letters, no numbers, no logos. Framing: cuadrado 1:1 cada viñeta; una fase de la luna en la esquina de cada una.\n```"}, {"tipo": "audio", "id": "AUD-E2-08-L", "donde": "Bloque de la leyenda", "habla": "Profesor Arturo (tu voz)", "texto": "A long time ago, the god Quetzalcóatl wanted to know the world, so he traveled as a man. He walked for many days. One night, he was very tired and hungry. He sat down near a forest. A little rabbit saw him and asked, “What is wrong?” Quetzalcóatl said, “I am hungry.” The rabbit only had grass. Then the rabbit said, “Eat me.” Quetzalcóatl was very surprised. He lifted the rabbit up to the moon, and the rabbit's picture stayed there. “Now everyone will remember you,” he said. Look at the full moon tonight. Can you see the rabbit?"}, {"tipo": "audio", "id": "AUD-E2-08-M", "donde": "Un audio por pin del mapa (3 archivos)", "habla": "Voz sintética en inglés de Estados Unidos, velocidad 0.85", "texto": "In Mexico, people see a rabbit on the moon. / In China, people tell a story about a Jade Rabbit. / In Japan, people see a rabbit making mochi."}], "interactivos": [{"tipo": "Mapa interactivo", "titulo": "El conejo en la luna en el mundo", "contenido": {"imagen": "IMG-E2-08-1", "puntos": [["México", "Quetzalcóatl y el conejo", "In Mexico, people see a rabbit on the moon."], ["China", "El Conejo de Jade (Yutu)", "In China, people tell a story about a Jade Rabbit."], ["Japón", "El conejo que prepara mochi", "In Japan, people see a rabbit making mochi."]]}}, {"tipo": "Cómic", "titulo": "La leyenda en 4 fases de la luna", "contenido": {"vinetas": [["1", "Luna nueva: Quetzalcóatl camina como hombre por un camino.", "Quetzalcóatl traveled as a man.", ""], ["2", "Cuarto creciente: está sentado junto al bosque, cansado.", "He was tired and hungry.", ""], ["3", "Luna llena: el conejo le habla.", "The rabbit said, “Eat me.”", ""], ["4", "Cuarto menguante: Quetzalcóatl eleva al conejo hacia la luna.", "He lifted the rabbit to the moon.", ""]]}, "parte": "repaso"}, {"tipo": "Encuesta del grupo", "titulo": "¿Ves un conejo en la luna llena?", "contenido": {"opciones": ["Sí", "No", "Nunca me había fijado: hoy lo busco"], "muestra": "Barras del grupo."}}], "actividades": [{"id": "A1", "tipo": "ordenar", "titulo": "Story Order: la leyenda", "instrucciones": "Ordena las 4 fases.", "contenido": {"series": [["Quetzalcóatl traveled as a man.", "He was tired and hungry.", "The rabbit said, “Eat me.”", "He lifted the rabbit to the moon."]]}, "nota": ""}, {"id": "A2", "tipo": "arrastrar a categorías", "titulo": "Regulares e irregulares", "instrucciones": "Arrastra cada verbo de la leyenda.", "contenido": [["Regular (-ed)", ["wanted", "traveled", "walked", "asked", "lifted", "stayed"]], ["Irregular", ["was", "sat", "saw", "had", "said"]]], "nota": "Si pone said en regulares: «said viene de say: es irregular (familia 2: say – said – said)»."}, {"id": "A3", "tipo": "opción múltiple", "titulo": "¿Entendiste la leyenda?", "instrucciones": "Elige la respuesta.", "contenido": [["¿Por qué viajó Quetzalcóatl como hombre?", ["Quería conocer el mundo ✓", "Buscaba un conejo", "Estaba perdido"]], ["¿Cómo estaba una noche?", ["Cansado y con hambre ✓", "Feliz", "Enfermo"]], ["¿Qué tenía el conejo?", ["Solo pasto ✓", "Tamales", "Agua"]], ["¿Qué hizo Quetzalcóatl al final?", ["Subió al conejo a la luna ✓", "Se comió al conejo", "Regresó a su casa"]], ["¿Qué valor muestra el conejo?", ["Generosidad ✓", "Miedo", "Enojo"]]], "nota": "En la última, la retroalimentación agrega: «También puedes decir bondad o sacrificio»."}, {"id": "A4", "tipo": "completar espacios", "titulo": "Words in Context: la leyenda", "instrucciones": "Arrastra la palabra que encaja.", "contenido": [["Quetzalcóatl traveled for many days. He was ___ and ___.", "tired · hungry", ""], ["The rabbit only had ___.", "grass", ""], ["Now we can see the rabbit on the ___.", "moon", ""]], "nota": "Banco: tired · hungry · grass · moon · forest. Pista al fallar: «had only ___: algo que come un conejo → grass»."}], "libreta": "Dibuja las 4 fases de la luna con una oración de la leyenda en cada una y escribe I think this legend is important because ___.", "usos": [{"momento": "antes", "sesion": "S8", "minutos": 5, "alumno": "Lee el avance, toca el mapa y vota en la encuesta.", "docente": "En el paso «Gancho» de la S8 usa el resultado: «¿cuántos ven el conejo?».", "conexion": "Libreta: fases de la luna (S8)."}, {"momento": "después", "sesion": "S8", "minutos": 8, "alumno": "Escucha la leyenda y juega A1 a A4.", "docente": "Sin preparación.", "conexion": "Apreciación escrita de la S8."}], "entrega": null, "semana": 3}, {"id": "E2-09", "titulo_en": "Interview Matilde", "titulo_es": "Entrevista a Matilde", "grado": "2°", "tarjeta": "2° · Past Simple (Lives We Remember)", "mes": "Octubre", "semana_cal": 3, "habilita": "Sábado 24 de octubre", "modo": "aula de cómputo", "sesion": "Durante la S9 (aula de cómputo) y después (práctica)", "objetivo": "Hago preguntas con did a Matilde y convierto sus respuestas en oraciones para una línea del tiempo.", "aula": "S9 de 2°: toda la sesión (50 minutos) en el aula de cómputo", "articulo": [["Entrevista a Matilde", "Es una simulación con datos reales. Escríbele preguntas con did y ella te responde.", ""], ["De respuesta a oración", "Matilde: I passed my exam in 1887. → Tu línea: In 1887, Matilde passed her exam. Cambia I → she (o Matilde) y my → her.", ""], ["La reflexión", "I think Matilde was important because she opened the door for other women.", ""], ["Tu línea del tiempo", "4 puntos con año o expresión de tiempo, imagen y oración; reflexión al final.", ""]], "recursos": [{"tipo": "foto", "id": "FOTO-MATILDE", "donde": "Línea del tiempo y foto de perfil del chat · Qué: Fotografía histórica de Matilde Montoya (la misma de la p. 42 del libro) · Fuente: Wikimedia Commons, dominio público. No generes su rostro con IA. Verifica la licencia y escribe el crédito debajo.", "texto": ""}], "interactivos": [{"tipo": "Simulador de chat", "titulo": "Matilde Montoya", "contenido": "Guion completo en la sección «Chats»: CHAT-M.", "chat": "CHAT-M"}, {"tipo": "Constructor de oraciones", "titulo": "De su voz a tu línea", "contenido": {"campos": {"modelo": "I passed my exam in 1887.", "fichas": "In 1887, · Matilde · she · passed · pass · her · my · exam · .", "correcta": "In 1887, Matilde passed her exam.", "reglas": "Trampas: my y pass. Se aceptan Matilde o she."}, "tablas": [], "lineas": null}}], "actividades": [{"id": "A1", "tipo": "opción múltiple", "titulo": "Chat con Matilde", "instrucciones": "Elige o escribe tus preguntas.", "contenido": "Ver CHAT-M (aciertos: preguntas bien formadas / intentos).", "nota": "Cuenta como un juego."}, {"id": "A2", "tipo": "completar espacios", "titulo": "Life Timeline: Matilde", "instrucciones": "Completa cada estación con el verbo en pasado.", "contenido": [["At age 4, she ___ read and write. (can)", "could", ""], ["In 1887, she ___ her exam. (pass)", "passed", ""], ["She ___ as a midwife in Cuernavaca. (work)", "worked", ""], ["In 1938, she ___ away. (pass)", "passed", ""]], "nota": "Si deja el verbo en presente: «Ya pasó: usa el pasado. pass → passed»."}, {"id": "A3", "tipo": "opción múltiple", "titulo": "Cambia I por she", "instrucciones": "Elige cómo queda en tu línea del tiempo.", "contenido": [["I was born in Mexico City.", ["She was born in Mexico City. ✓", "She is born in Mexico City.", "I was born in Mexico City."]], ["I worked as a midwife.", ["She worked as a midwife. ✓", "She works as a midwife.", "She work as a midwife."]], ["My exam was in 1887.", ["Her exam was in 1887. ✓", "My exam was in 1887.", "She exam was in 1887."]], ["I learned to read when I was four.", ["She learned to read when she was four. ✓", "She learn to read when she was four.", "She learned to read when I was four."]]], "nota": ""}], "libreta": "Sin aula de cómputo: el profesor es Matilde en voz alta y tú escribes en la libreta 3 preguntas con did y 4 oraciones de su línea del tiempo.", "usos": [{"momento": "durante", "sesion": "S9", "minutos": 28, "alumno": "En parejas: entrevistan a Matilde en el chat (16 min: al menos 5 preguntas con did) y convierten sus respuestas en 4 oraciones con A2 y el constructor; las copian en la libreta (12 min).", "docente": "Modela la primera pregunta en la computadora del frente, recorre parejas y en MyClass revisa en vivo quién no ha hecho preguntas bien formadas para acompañarlo.", "conexion": "Libreta: 4 oraciones de Matilde y reflexión modelo; base de su línea del tiempo."}, {"momento": "después", "sesion": "S9", "minutos": 5, "alumno": "Juega A3.", "docente": "Sin preparación.", "conexion": "Plan de la línea del tiempo."}], "entrega": null, "semana": 3}, {"id": "E2-10", "titulo_en": "Writing my story", "titulo_es": "Escribo mi historia", "grado": "2°", "tarjeta": "2° · Past Simple (Lives We Remember)", "mes": "Noviembre", "semana_cal": 4, "habilita": "Sábado 31 de octubre", "modo": "casa", "sesion": "Antes de la S10 (avance) y después (entrega del borrador)", "objetivo": "Escribo los 4 momentos de la historia que investigué, en pasado y con una reflexión, eligiendo mi nivel de apoyo.", "aula": null, "articulo": [["Tu historia en 4 momentos", "Cuatro momentos con año o expresión de tiempo y una reflexión al final.", "avance"], ["Elige tu nivel", "A: marco completo · B: solo palabras clave · C: libre. Todos llegan a la misma meta por caminos distintos.", "avance"], ["Ejemplo: Don Pedro (personaje de práctica)", "In 1950, he was born in Zitlaltepec. In 1965, he worked in the fields. In 1972, he got married. In 2010, he opened a store. I think it is important to remember Don Pedro because he worked hard for his family. · Glosario: fields = el campo · got married = se casó · store = tienda · worked hard = trabajó mucho.", ""], ["Conectores", "then = después · after that = después de eso · in + año.", ""], ["Si tu tema viene de la revista", "Pasa los datos al inglés con tu banco de verbos; no copies párrafos. Anota número y página.", ""], ["Revisión entre pares", "Check the verb! Revisa con los criterios que definió el grupo en la S9.", "repaso"], ["Jingle Bells", "J. L. Pierpont, 1857, dominio público. El coro cuenta un paseo divertido en un trineo de un caballo.", ""]], "recursos": [{"tipo": "imagen", "id": "IMG-E2-10-1", "donde": "Las 4 imágenes de la línea de Don Pedro (mismo personaje que envejece)", "texto": "Prompt:\n```\nFour illustrations of the same Mexican man at different ages: as a baby in a small adobe house in 1950s rural central Mexico; as a teenager working in green corn fields; as a young man at a simple wedding; as an older man smiling at the door of his small corner store. Contemporary Latin American editorial illustration for a children's magazine, made by a professional illustrator: hand-painted digital gouache look with visible brush strokes, dry-brush and fine grain textures and a subtle paper texture; bold saturated palette of vermilion orange, marigold yellow, deep teal green and emerald, with small touches of pink and cream; lush stylized leaves and flowers framing the scene; characters built from simple rounded shapes, rosy cheeks, small dot eyes and expressive gestures; flat layered composition. Avoid glossy 3D render, airbrushed gradients, photorealism, generic clip art and plastic shine. No text, no letters, no numbers, no logos. Framing: cuadrado 1:1 cada una.\n```"}, {"tipo": "audio", "id": "AUD-E2-10-P", "donde": "Bloque del ejemplo de Don Pedro", "habla": "Profesor Arturo (tu voz)", "texto": "In 1950, he was born in Zitlaltepec. In 1965, he worked in the fields. In 1972, he got married. In 2010, he opened a store. I think it is important to remember Don Pedro because he worked hard for his family."}, {"tipo": "audio", "id": "AUD-E2-10-J", "donde": "Tarjeta de la canción", "habla": "Profesor Arturo (tu voz) cantando, o una grabación de dominio público (no comercial)", "texto": "Jingle bells, jingle bells, / Jingle all the way! / Oh, what fun it is to ride / In a one-horse open sleigh!"}], "interactivos": [{"tipo": "Línea del tiempo", "titulo": "La vida de Don Pedro", "contenido": {"cab": ["Fecha", "Oración (con audio)", "Significado"], "puntos": [["1950", "In 1950, he was born in Zitlaltepec.", "nació"], ["1965", "In 1965, he worked in the fields.", "trabajó en el campo"], ["1972", "In 1972, he got married.", "se casó"], ["2010", "In 2010, he opened a store.", "abrió una tienda"]], "extra": "", "funcionamiento": ""}}, {"tipo": "Tabla comparativa", "titulo": "Los tres niveles", "contenido": {"columnas": ["Nivel", "Qué tienes", "Ejemplo"], "filas": [["A · marco", "La oración casi completa", "In ___, he/she was born in ___. · In ___, he/she worked as ___. · He/She liked ___. · In ___, he/she ___."], ["B · palabras clave", "Solo los verbos y las expresiones", "was born · lived · worked · liked · passed away · in + year · ago"], ["C · libre", "Nada: escribes tú", "—"]]}}, {"tipo": "Tarjeta de canción", "titulo": "Jingle Bells (coro, dominio público)", "contenido": {"lineas": ["Jingle bells, jingle bells,", "Jingle all the way!", "Oh, what fun it is to ride", "In a one-horse open sleigh!"], "extra": {"glosario": "ride = pasear · one-horse open sleigh = trineo abierto de un caballo · fun = divertido", "audio": "AUD-E2-10-J", "nota": "Si el concurso pide Rudolph the Red-Nosed Reindeer, su letra tiene derechos de autor: no se sube; solo un enlace a una fuente con licencia."}}}], "actividades": [{"id": "A1", "tipo": "completar espacios", "titulo": "Life Timeline: Don Pedro", "instrucciones": "Escribe el verbo en pasado.", "contenido": [["In 1950, he ___ born in Zitlaltepec. (be)", "was", ""], ["In 1965, he ___ in the fields. (work)", "worked", ""], ["In 1972, he ___ married. (get)", "got", "get → got (familia 3)."], ["In 2010, he ___ a store. (open)", "opened", ""]], "nota": ""}, {"id": "A2", "tipo": "ordenar", "titulo": "Ordena la vida de Don Pedro", "instrucciones": "Ordena por año.", "contenido": {"series": [["In 1950, he was born in Zitlaltepec.", "In 1965, he worked in the fields.", "In 1972, he got married.", "In 2010, he opened a store."]]}, "nota": ""}, {"id": "A3", "tipo": "opción múltiple", "titulo": "Check the verb!", "instrucciones": "Cada oración tiene un error en el verbo. Elige la corrección.", "contenido": [["In 1965, he work in the fields.", ["worked ✓", "works", "working"]], ["In 1972, he get married.", ["got ✓", "getted", "gets"]], ["She born in 1948.", ["was born ✓", "borned", "is born"]], ["In 2020, she pass away.", ["passed away ✓", "pass awayed", "passes away"]], ["He go to Mexico City in 1980.", ["went ✓", "goed", "goes"]]], "nota": ""}], "libreta": "Escribe tu borrador en la libreta con el nivel que elegiste.", "usos": [{"momento": "antes", "sesion": "S10", "minutos": 5, "alumno": "Lee el ejemplo de Don Pedro y la tabla de los tres niveles para decidir su nivel.", "docente": "En el paso «Borrador» de la S10 pregunta quién ya eligió nivel.", "conexion": "Notas de la entrevista y plan de la S9."}, {"momento": "después", "sesion": "S10", "minutos": 5, "alumno": "Sube la foto del borrador y juega A3.", "docente": "Revisa las fotos en MyClass y deja un comentario por alumno antes de la S11.", "conexion": "Borrador de la libreta."}], "entrega": {"que": "Foto de tu borrador: 4 momentos y reflexión, revisado por un compañero.", "como": "Botón «Subir foto» del subtema. Una foto por página, de frente y con luz. Hasta el día de tu S11. Sin dispositivo: muestras tu libreta en la S11.", "criterios": "Retroalimentación, no calificación: se revisa con las filas 1 a 3 de la rúbrica (Momentos en pasado · Reflexión · Orden y conectores; 2 / 1 / 0 cada una) para que mejores la versión final.", "importante": "Si usas revisión automática, queda oculta para el alumno hasta que tú la apruebes."}, "semana": 4}, {"id": "E2-11", "titulo_en": "Speak without reading: 4/3/2", "titulo_es": "Hablar sin leer: 4/3/2", "grado": "2°", "tarjeta": "2° · Past Simple (Lives We Remember)", "mes": "Noviembre", "semana_cal": 4, "habilita": "Sábado 31 de octubre", "modo": "casa", "sesion": "Antes de la S11 (avance) y después (entrega de la versión final)", "objetivo": "Cuento mi línea del tiempo sin leer, cada vez con más fluidez, para grabarla en clase.", "aula": null, "articulo": [["La técnica 4/3/2", "Cuentas lo mismo tres veces a tres personas distintas, cada vez con menos tiempo. En clase: 60, 45 y 30 segundos.", "avance"], ["¿Por qué funciona?", "Al repetir, ya no buscas las palabras: te concentras en decirlo. Con menos tiempo, hablas con más fluidez.", "avance"], ["Escucha a Don Pedro", "Un modelo de unos 35 segundos. Fíjate en los conectores: after that, then.", ""], ["La rúbrica de la grabación", "☐ 4 moments in the past ☐ correct -ed sounds ☐ no reading ☐ 45 – 60 seconds.", ""], ["Compara", "Escucha tu grabación y compárala con tu punto de partida de la S3: ¿qué mejoró?", "repaso"], ["Entrega", "Sube una foto de tu línea del tiempo final.", "repaso"]], "recursos": [{"tipo": "imagen", "id": "IMG-E2-11-1", "donde": "Encabezado del artículo", "texto": "Prompt:\n```\nThree pairs of students talking face to face in a classroom, three big friendly stopwatches floating above them showing shorter and shorter times, one student holding a phone to record. Mexican public secondary school students aged 12 to 13 in school uniforms, diverse and respectful, non-stereotyped. Contemporary Latin American editorial illustration for a children's magazine, made by a professional illustrator: hand-painted digital gouache look with visible brush strokes, dry-brush and fine grain textures and a subtle paper texture; bold saturated palette of vermilion orange, marigold yellow, deep teal green and emerald, with small touches of pink and cream; lush stylized leaves and flowers framing the scene; characters built from simple rounded shapes, rosy cheeks, small dot eyes and expressive gestures; flat layered composition. Avoid glossy 3D render, airbrushed gradients, photorealism, generic clip art and plastic shine. No text, no letters, no numbers, no logos. Framing: horizontal 16:9.\n```"}, {"tipo": "audio", "id": "AUD-E2-11-M", "donde": "Bloque «Escucha a Don Pedro»", "habla": "Profesor Arturo (tu voz)", "texto": "This is the story of Don Pedro. In 1950, he was born in Zitlaltepec. In 1965, he worked in the fields. After that, in 1972, he got married. Then, in 2010, he opened a store. I think it is important to remember Don Pedro because he worked hard for his family."}], "interactivos": [{"tipo": "Infografía", "titulo": "4/3/2 en clase", "contenido": [["Ronda 1", "60 segundos", "Compañero 1."], ["Ronda 2", "45 segundos", "Compañero 2."], ["Ronda 3", "30 segundos", "Compañero 3."]]}, {"tipo": "Herramienta", "titulo": "Cronómetro 60 · 45 · 30", "contenido": "Tres botones grandes; al terminar cada ronda suena una campana y aparece «¿Lo dijiste sin leer? Sí / Todavía no» (se registra para el docente)."}], "actividades": [{"id": "A1", "tipo": "escuchar y elegir", "titulo": "Escucha el modelo", "instrucciones": "Escucha a Don Pedro y responde.", "contenido": [["¿Cuándo nació Don Pedro?", ["In 1950 ✓", "In 1965", "In 1972"]], ["¿Qué hizo en 1972?", ["He got married. ✓", "He opened a store.", "He worked in the fields."]], ["¿Qué conector usa antes de 2010?", ["Then ✓", "Last", "Ago"]], ["¿Por qué es importante recordarlo?", ["He worked hard for his family. ✓", "He was a doctor.", "He lived in China."]]], "nota": ""}, {"id": "A2", "tipo": "completar espacios", "titulo": "Conectores", "instrucciones": "Completa con then, after, in o because.", "contenido": [["In 1950, he was born. ___, he worked in the fields.", "Then", "También vale After that."], ["___ that, he got married.", "After", ""], ["___ 2010, he opened a store.", "In", ""], ["It is important to remember him ___ he worked hard.", "because", ""]], "nota": ""}], "libreta": "Practica en voz alta con un reloj: 60, 45 y 30 segundos, con alguien de tu casa.", "usos": [{"momento": "antes", "sesion": "S11", "minutos": 5, "alumno": "Escucha el modelo y practica una vez con el cronómetro.", "docente": "En las «Tres rondas» de la S11 pide a quien practicó que modele la ronda 1.", "conexion": "Línea del tiempo de la libreta."}, {"momento": "después", "sesion": "S11", "minutos": 5, "alumno": "Sube la foto de su línea del tiempo final.", "docente": "Califica las fotos con las filas 1 a 3 de la rúbrica y apruébalas en MyClass.", "conexion": "Producto del proyecto."}], "entrega": {"que": "Foto de tu línea del tiempo final (versión en limpio).", "como": "Botón «Subir foto». Foto completa, de frente y con luz. Hasta la sesión puente. Sin dispositivo: la entregas en la S11 y tú le tomas la foto.", "criterios": "Filas 1 a 3 de la rúbrica de Lives We Remember: Momentos en pasado · Reflexión · Orden y conectores (2 / 1 / 0 cada una). La grabación (fila 4) se califica en clase.", "importante": "Si usas revisión automática, queda oculta para el alumno hasta que tú la apruebes."}, "semana": 4}, {"id": "E2-12", "titulo_en": "Get ready", "titulo_es": "Prepárate", "grado": "2°", "tarjeta": "2° · Past Simple (Lives We Remember)", "mes": "Noviembre", "semana_cal": 4, "habilita": "Sábado 31 de octubre", "modo": "casa", "sesion": "Antes de la S12 (evaluación)", "objetivo": "Compruebo qué ya sé del pasado y practico lo que me falta antes de la evaluación.", "aula": null, "articulo": [["Qué tiene la evaluación", "A1 Sonidos de -ed (3) · A2 Escucho una historia (3) · B Leo una biografía (6) · C Escribo (8). Total: 20 puntos. Calificación = puntos ÷ 2.", ""], ["Qué puedes usar", "Tu libreta, tu pluma y tu banco de verbos.", ""], ["Qué no cuenta", "Usar el banco de verbos, la ortografía de palabras que no son el verbo evaluado, la letra y la limpieza.", ""], ["Cómo practicar", "Haz el recorrido de 5 niveles. Si un nivel te cuesta, abre el subtema que te indica.", ""]], "recursos": [{"tipo": "imagen", "id": "IMG-E2-12-1", "donde": "Encabezado del artículo", "texto": "Prompt:\n```\nA small train traveling through five stations in a valley of central Mexico, each station a different color, a finish flag at the last station next to a school. Contemporary Latin American editorial illustration for a children's magazine, made by a professional illustrator: hand-painted digital gouache look with visible brush strokes, dry-brush and fine grain textures and a subtle paper texture; bold saturated palette of vermilion orange, marigold yellow, deep teal green and emerald, with small touches of pink and cream; lush stylized leaves and flowers framing the scene; characters built from simple rounded shapes, rosy cheeks, small dot eyes and expressive gestures; flat layered composition. Avoid glossy 3D render, airbrushed gradients, photorealism, generic clip art and plastic shine. No text, no letters, no numbers, no logos. Framing: horizontal 16:9.\n```"}], "interactivos": [{"tipo": "Infografía", "titulo": "La evaluación en 4 partes", "contenido": [["A1", "3 puntos", "Sonidos de -ed."], ["A2", "3 puntos", "Escucho una historia."], ["B", "6 puntos", "Leo una biografía."], ["C", "8 puntos", "Escribo."]]}, {"tipo": "Lista de autoevaluación", "titulo": "Can-do", "contenido": {"puntos": ["Pronuncio /t/, /d/ e /ɪd/", "Escribo el pasado regular", "Uso los 8 verbos rebeldes", "Distingo presente, ahora y pasado", "Pregunto con did", "Encuentro fechas en una biografía", "Escribo 4 momentos y una reflexión"], "opciones": ["✓ lo hago solo", "~ con ayuda", "✗ todavía no"], "nota": "Se guarda para el docente."}}], "actividades": [{"id": "A1", "tipo": "recorrido por niveles", "titulo": "Time Train Trip", "instrucciones": "5 estaciones. Pasas cada una con 4 de 5. Si no, te sugiere un subtema.", "contenido": [{"nivel": 1, "nombre": "Sonidos de -ed", "tipo": "escuchar y elegir", "si_falla": "E2-02", "items": [["audio: danced", ["/t/ ✓", "/d/", "/ɪd/"]], ["audio: opened", ["/d/ ✓", "/t/", "/ɪd/"]], ["audio: started", ["/ɪd/ ✓", "/t/", "/d/"]], ["audio: washed", ["/t/ ✓", "/d/", "/ɪd/"]], ["audio: loved", ["/d/ ✓", "/t/", "/ɪd/"]]]}, {"nivel": 2, "nombre": "Verbos rebeldes", "tipo": "completar espacios", "si_falla": "E2-04", "items": [["eat → ___", "ate", ""], ["go → ___", "went", ""], ["buy → ___", "bought", ""], ["see → ___", "saw", ""], ["take → ___", "took", ""]]}, {"nivel": 3, "nombre": "Siempre, ahora o ya pasó", "tipo": "opción múltiple", "si_falla": "E2-01", "items": [["Every Sunday, I ___ my grandma. (visit)", ["visit ✓", "visited", "am visiting"]], ["Right now, I ___ English. (study)", function norm(s){ return String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[’']/g,"'").replace(/[.,!?¿¡;:]+$/,'').replace(/\s+/g,' ').trim(); }

function idioma(s){
  if (/[áéíóúñ¿¡]/i.test(s)) return 'es';
  const w = String(s).toLowerCase().match(/[a-z']+/g)||[];
  const es = w.filter(x=>['de','la','el','los','las','que','y','en','con','tu','es','un','una','para','aqui','vas','antes','despues','cada','clase','abre','juega','por','del','se','mi','lo','al','paso','entra','elige','revisa'].includes(x)).length;
  const en = w.filter(x=>['the','is','you','and','my','to','of','i','it','we','he','she','on','in','at','was','did','a','do','your','what','when','are','her','his'].includes(x)).length;
  return es > en ? 'es' : 'en';
}
function tieneIngles(s){ return idioma(s)==='en' && /[a-z]/i.test(s); }

/* ===== sonidos propios (Web Audio, sin archivos) y vibración ===== */
const SND = (function(){
  let ctx = null;
  function c(){ if (!ctx){ try{ ctx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; } } if (ctx.state==='suspended') ctx.resume(); return ctx; }
  function tono(f0, f1, dur, tipo, vol, t0){
    const a=c(); if(!a) return; const t=a.currentTime+(t0||0);
    const o=a.createOscillator(), g=a.createGain(); o.type=tipo||'sine';
    o.frequency.setValueAtTime(f0,t); if (f1) o.frequency.exponentialRampToValueAtTime(f1,t+dur);
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol||.12,t+.012); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g).connect(a.destination); o.start(t); o.stop(t+dur+.02);
  }
  function ruido(dur, f0, f1, vol){
    const a=c(); if(!a) return; const t=a.currentTime; const n=Math.floor(a.sampleRate*dur);
    const b=a.createBuffer(1,n,a.sampleRate), d=b.getChannelData(0); for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n);
    const s=a.createBufferSource(); s.buffer=b; const fl=a.createBiquadFilter(); fl.type='bandpass'; fl.Q.value=1.4;
    fl.frequency.setValueAtTime(f0,t); fl.frequency.exponentialRampToValueAtTime(f1,t+dur);
    const g=a.createGain(); g.gain.value=vol||.25; s.connect(fl).connect(g).connect(a.destination); s.start(t);
  }
  const S0 = {
    tap(){ tono(1200,900,.05,'sine',.06); },
    nav(){ tono(520,780,.09,'sine',.07); tono(780,1040,.07,'sine',.04,.05); },
    atras(){ tono(780,520,.09,'sine',.07); },
    flip(){ ruido(.12,600,3200,.22); tono(660,990,.08,'triangle',.04); },
    pop(){ tono(700,340,.08,'sine',.11); },
    drop(){ tono(260,170,.1,'triangle',.12); ruido(.05,400,200,.08); },
    ok(){ [784,988,1319].forEach((f,i)=>tono(f,0,.16,'triangle',.09,i*.07)); },
    no(){ tono(240,170,.18,'triangle',.11); tono(180,130,.16,'sine',.06,.06); },
    fin(){ [523,659,784,1047,1319].forEach((f,i)=>tono(f,0,.22,'triangle',.08,i*.09)); },
    abre(){ tono(440,880,.14,'sine',.07); ruido(.08,1500,4000,.06); },
    candado(){ tono(300,280,.06,'square',.03); tono(300,280,.06,'square',.03,.08); },
    voto(){ tono(880,1320,.1,'sine',.08); },
    estrella(){ [1319,1568,2093].forEach((f,i)=>tono(f,0,.12,'sine',.06,i*.05)); }
  };
  return { play(n){ if (!AJ.sonido) return; try{ S0[n] && S0[n](); }catch(e){} }, desbloquear(){ c(); } };
})();
const VIB = (function(){
  let lab = null;

    try{ if (!lab){ lab=document.createElement('label'); lab.style.cssText='position:fixed;left:-99px;top:0;opacity:0;pointer-events:none'; const i=document.createElement('input'); i.type='checkbox'; i.setAttribute('switch',''); lab.appendChild(i); document.body.appendChild(lab); } lab.click(); }catch(e){}

  const P = { tap:8, ok:[12,40,18], no:[30,40,30], fin:[15,30,15,30,40], flip:10, pop:8, drop:14, nav:6 };
  return { v(n){ if (!AJ.vibrar) return; const p=P[n]||8; if (navigator.vibrate) { try{ navigator.vibrate(p); }catch(e){} } else if (/iP(hone|ad|od)/.test(navigator.userAgent)) iosTick(); } };
})();

/* ===== voz: primero el mp3 de la Encarta; si no existe, la voz del dispositivo ===== */
let VOCES = [];
function cargarVoces(){ try{ VOCES = speechSynthesis.getVoices(); }catch(e){} }
try{ cargarVoces(); speechSynthesis.onvoiceschanged = cargarVoces; }catch(e){}
function vozDe(lang){
  const pref = lang==='es' ? ['es-MX','es-US','es-419','es'] : ['en-US','en'];
  for (const p of pref){ const v = VOCES.filter(v=>v.lang && v.lang.replace('_','-').startsWith(p)); if(v.length) return v.find(x=>/natural|premium|enhanced|google|samantha|paulina|online/i.test(x.name))||v[0]; }
  return null;
}
function claveAud(s){ return String(s).toLowerCase().normalize('NFD').replace(/\[[^\]]*\]/g,'').replace(/[^a-z0-9]/g,''); }
const AUD = {}; Object.keys(M.aud).forEach(k=>AUD[claveAud(k)] = M.aud[k]);
function buscarAud(s){
  const k = claveAud(String(s).replace(/^audio:\s*/i,'').replace(/\([^)]*\)/g,''));
  if (!k) return null; if (AUD[k]) return AUD[k];
  return null;
}
let btnHablando = null, sonando = null;
function callar(){ try{ speechSynthesis.cancel(); }catch(e){} try{ if (sonando){ sonando.pause(); sonando=null; } }catch(e){} if (btnHablando){ btnHablando.classList.remove('hablando'); btnHablando=null; } }
const FALLA = {};
function decir(texto, btn, vel, mp3, alTerminar){
  callar();
  const id = mp3 || buscarAud(texto);
  const fin = ()=>{ if (btn) btn.classList.remove('hablando'); if (alTerminar) alTerminar(); };
  if (id && !FALLA[id]){
    const a = new Audio(BASE + 'audio/' + id + '.mp3'); sonando = a;
    if (btn){ btnHablando = btn; btn.classList.add('hablando'); }
    a.onended = fin;
    a.onerror = ()=>{ FALLA[id]=1; if (sonando===a){ sonando=null; decir(texto, btn, vel, null, alTerminar); } };
    a.play().catch(()=>{});
    return;
  }
  try{
    let t = String(texto).replace(/^audio:\s*/i,'');
    const trozos = t.split(/(?<=[.!?])\s+|\s+\/\s+/).filter(Boolean);
    if (!trozos.length){ fin(); return; }
    trozos.forEach((tr,i)=>{
      const u = new SpeechSynthesisUtterance(tr); const lg = idioma(tr);
      const v = vozDe(lg); if (v) u.voice = v; u.lang = lg==='es'?'es-MX':'en-US'; u.rate = vel || (lg==='es'?1:0.9);
      if (btn && i===0){ btnHablando = btn; btn.classList.add('hablando'); }
      if (i===trozos.length-1){ u.onend = fin; u.onerror = fin; }
      speechSynthesis.speak(u);
    });
  }catch(e){ toast('Este dispositivo no tiene voz disponible'); fin(); }
}
const PLAY = '<svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';

  const m = mp3 ? ` data-mp3="${esc(mp3)}"` : '';
  if (!etiqueta) return `<button class="aud sm" data-say="${esc(texto)}"${m} ${vel?`data-vel="${vel}"`:''} aria-label="Escuchar"><i>${PLAY}</i></button>`;

}

/* ===== registro para el docente (se guarda en la hoja de MyClass a través del portal) ===== */
const REG = (function(){
  let cola = []; try{ cola = JSON.parse(localStorage.getItem('encarta_cola')||'[]'); }catch(e){}
  let enviando = false;
  function guardarCola(){ try{ localStorage.setItem('encarta_cola', JSON.stringify(cola.slice(-400))); }catch(e){} }
  const disp = (window.matchMedia && matchMedia('(pointer:coarse)').matches) ? 'celular' : 'computadora';
  function anota(tipo, datos){
    if (!S.c || MAESTRO) return;
    cola.push(Object.assign({t:tipo, f:new Date().toISOString(), d:disp}, datos||{})); guardarCola();
    if (cola.length >= 8) enviar();
  }
  function enviar(beacon){
    if (!PORTAL || !S.c || !cola.length || enviando) return;
    const lote = cola.slice(0, 40);
    const cuerpo = JSON.stringify({encarta:'ev', c:S.c, tk:S.tk, ev:lote});
    if (beacon && navigator.sendBeacon){ try{ if (navigator.sendBeacon(PORTAL, new Blob([cuerpo],{type:'text/plain'}))){ cola = cola.slice(lote.length); guardarCola(); } }catch(e){} return; }
    enviando = true;
    fetch(PORTAL, {method:'POST', mode:'no-cors', headers:{'Content-Type':'text/plain'}, body:cuerpo})
      .then(()=>{ cola = cola.slice(lote.length); guardarCola(); })
      .catch(()=>{}).finally(()=>{ enviando=false; if (cola.length) setTimeout(enviar, 3000); });
  }
  setInterval(()=>enviar(), 20000);
  document.addEventListener('visibilitychange', ()=>{ if (document.visibilityState==='hidden'){ TIEMPO.cerrar(); enviar(true); } });
  return { anota, enviar };
})();
/* minutos activos por subtema: solo cuenta si hubo actividad en el último minuto */
const TIEMPO = (function(){
  let sub = null, seg = 0, ult = 0;
  ['click','keydown','touchstart','scroll'].forEach(e=>document.addEventListener(e, ()=>{ ult = Date.now(); }, {passive:true, capture:true}));
  setInterval(()=>{ if (sub && document.visibilityState==='visible' && Date.now()-ult < 60000) seg += 15; }, 15000);
  function cerrar(){ if (sub && seg >= 15) REG.anota('tiempo', {s:sub, seg}); seg = 0; }
  return { entrar(id){ if (sub!==id){ cerrar(); sub = id; ult = Date.now(); } }, salir(){ cerrar(); sub = null; }, cerrar };
})();
function jsonp(params){
  return new Promise(res=>{
    if (!PORTAL) return res({ok:false, e:'SIN'});
    const cb = 'enc' + Date.now() + Math.floor(Math.random()*1000); const sc = document.createElement('script');
    const tm = setTimeout(()=>fin({ok:false,e:'RED'}), 15000);
    function fin(r){ clearTimeout(tm); delete window[cb]; sc.remove(); res(r); }
    window[cb] = fin; sc.onerror = ()=>fin({ok:false,e:'RED'});
    const q = Object.keys(params).map(k=>k+'='+encodeURIComponent(params[k])).join('&');
    sc.src = PORTAL + (PORTAL.indexOf('?')>=0?'&':'?') + q + '&cb=' + cb;
    document.body.appendChild(sc);
  });
}

/* ===== navegación ===== */
function ir(p, arg){ S.hist.push([S.pant,S.arg,S.secSel]); S.pant=p; S.arg=arg; S.secSel=null; fx('nav'); pintar(); window.scrollTo(0,0); }
function atras(){ const h=S.hist.pop(); if(!h) return inicio(); S.pant=h[0]; S.arg=h[1]; S.secSel=h[2]; fx('atras'); pintar(); window.scrollTo(0,0); }
function inicio(){ S.hist=[]; S.pant='inicio'; S.arg=null; pintar(); window.scrollTo(0,0); }
function tab(p, arg){ S.hist=[]; S.pant=p; S.arg=arg||null; S.secSel=null; fx('nav'); pintar(); window.scrollTo(0,0); }
window.addEventListener('popstate', ()=>{ if (S.pant!=='login' && S.pant!=='inicio'){ history.pushState(null,''); atras(); } });

document.addEventListener('click', e=>{
  SND.desbloquear();
  const s = e.target.closest('[data-say]');
  if (s){ e.preventDefault(); e.stopPropagation(); fx('tap'); decir(s.dataset.say, s, parseFloat(s.dataset.vel)||0, s.dataset.mp3); return; }
  const g = e.target.closest('[data-ir]');
  if (g){ if (g.getAttribute('aria-disabled')==='true'){ fx('candado'); toast(g.dataset.cerrado||'Todavía está cerrado'); return; } ir(g.dataset.ir, g.dataset.arg||null); return; }
  const t = e.target.closest('[data-tab]');
  if (t){ tab(t.dataset.tab, t.dataset.arg); return; }
  if (e.target.closest('button,.chip,.op,label')) fx('tap');
}, true);

/* ===== barra superior y barra de abajo ===== */
function tituloPant(){
  if (S.pant==='inicio') return ['Mi Encarta', S.rol==='maestro'?'Vista del profesor':S.grado+(S.grupo?' · '+S.grupo:'')];
  if (S.pant==='tema') return [S.arg+' · Tema 2', TEMA[S.arg]];
  if (S.pant==='herr') return ['Herramientas','Para todo el año'];
  if (S.pant==='sub'){ const f=POR_ID[S.arg]; return [f?f.titulo_en:'', f?f.id+' · '+f.titulo_es:'']; }
  if (S.pant==='buscar') return ['Buscar','Títulos, artículos y tarjetas'];
  if (S.pant==='zona') return ['Zona de juegos','El pueblo'];
  if (S.pant==='yo') return ['Mi avance','Estrellas y ajustes'];
  return ['',''];
}
function barraTop(){
  const [t, s] = tituloPant(); const raiz = ['inicio','buscar','yo','zona'].includes(S.pant) && !S.hist.length;
  return `<header class="top"><div class="in">
    ${raiz ? `<button class="rb" data-tab="inicio" aria-label="Inicio">${ic('inicio')}</button>` : `<button class="rb" id="bAtras" aria-label="Atrás">${ic('atras')}</button>`}

}
function barraAbajo(){
  const g = S.rol==='maestro' ? (S.gradoVista||'1°') : S.grado;
  const on = p => (S.pant===p || (p==='tema' && S.pant==='sub' && /^E/.test(S.arg||''))) ? 'on' : '';

}

  return {abiertos:fs.length, total:D[g==='1°'?'primero':'segundo'].length, pct: t?Math.round(h*100/t):0};

/* dónde va cada recurso dentro de la página */
const POR_TARJETA = /una por|un audio por|por tarjeta|por letra|por fila|por globo|por punto|por pin|recorta|ícono de cada|imagen de cada|avatares|al soltar|foto de perfil|fondo de la tarjeta|tarjeta «empieza aquí»|juego a\d|viñetas|las \d im/i;
function lugarRecurso(r, f){
  const d = r.donde||'';
  const m = d.match(/«([^»]+)»/);
  if (m && !/empieza aquí/i.test(m[1])){
    const t = m[1].toLowerCase();
    const bi = f.articulo.findIndex(b=>b[0].toLowerCase()===t); if (bi>=0) return 'b'+bi;
    const ii = (f.interactivos||[]).findIndex(i=>(i.titulo||'').toLowerCase()===t); if (ii>=0) return 'i'+ii;
  }
  if (POR_TARJETA.test(d)) return 'skip';
  if (/^(encabezado|al abrir)/i.test(d)) return 'top';
  if (/l[ií]nea del tiempo|base del (mapa|diagrama)|rueda del año|diagrama/i.test(d)) return 'skip';
  const mapa = [[/c[oó]mic/i,'Cómic'],[/canci[oó]n|rima/i,'Tarjeta de canción'],[/infograf/i,'Infografía'],[/leyenda/i,'']];
  for (const [re,tipo] of mapa){ if (re.test(d) && tipo){ const ii=(f.interactivos||[]).findIndex(i=>i.tipo.indexOf(tipo)===0); if(ii>=0) return (tipo==='Tarjeta de canción'||tipo==='Cómic')?'skip':'i'+ii; } }
  return 'rec';
}
function recursosPorLugar(f){ const lug={}; (f.recursos||[]).forEach(r=>{ const k=lugarRecurso(r,f); (lug[k]=lug[k]||[]).push(r); }); return lug; }

/* karaoke aproximado: reparte la duración del mp3 entre las líneas según su largo */
function karaoke(ls, lineas){
  const a = sonando; if (!a) return;
  const tot = lineas.reduce((s,l)=>s+l.length,0);
  const marcar = ()=>{ const d = a.duration||0; if (!d) return; let acc=0; const t=a.currentTime; let k=-1;
    const ciclo = d > tot*0.11 && lineas.length>2 && d/(tot*0.075) > 1.7 ? 2 : 1; const dd = d/ciclo; const tt = t % dd;
    lineas.forEach((l,i)=>{ const ini=acc*dd/tot; acc+=l.length; if (tt>=ini) k=i; });
    ls.forEach((x,i)=>x.classList.toggle('on', i===k)); };
  a.addEventListener('timeupdate', marcar); a.addEventListener('ended', ()=>ls.forEach(x=>x.classList.remove('on')));
}

/* arrastrar con el dedo o el mouse (además de tocar) */
function arrastrable(chip, zonas, alSoltar){
  let fant=null, x0=0, y0=0, mov=false, sobre=null;
  chip.addEventListener('pointerdown', e=>{ if (e.button>0) return; x0=e.clientX; y0=e.clientY; mov=false; chip.setPointerCapture(e.pointerId); });
  chip.addEventListener('pointermove', e=>{
    if (!chip.hasPointerCapture || !chip.hasPointerCapture(e.pointerId)) return;
    if (!mov && Math.hypot(e.clientX-x0, e.clientY-y0) < 10) return;
    if (!mov){ mov=true; fx('pop'); fant=chip.cloneNode(true); const r=chip.getBoundingClientRect(); fant.style.cssText=`position:fixed;left:${r.left}px;top:${r.top}px;width:${r.width}px;z-index:99;pointer-events:none;opacity:.92;transform:scale(1.08) rotate(-2deg);box-shadow:0 12px 26px rgba(30,40,90,.3)`; document.body.appendChild(fant); chip.style.opacity='.3'; fant._dx=x0-r.left; fant._dy=y0-r.top; }
    fant.style.left=(e.clientX-fant._dx)+'px'; fant.style.top=(e.clientY-fant._dy)+'px';
    const z = zonas().find(z=>{ const r=z.getBoundingClientRect(); return e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom; });
    if (z!==sobre){ if (sobre) sobre.classList.remove('sobre','listo'); sobre=z; if (z) z.classList.add('sobre','listo'); }
  });
  const fin = e=>{ if (!mov) return; mov=false; if (fant) fant.remove(); fant=null; chip.style.opacity=''; if (sobre){ sobre.classList.remove('sobre','listo'); const z=sobre; sobre=null; chip._arrastrado=true; setTimeout(()=>chip._arrastrado=false,50); alSoltar(z); } };
  chip.addEventListener('pointerup', fin); chip.addEventListener('pointercancel', ()=>{ if (fant) fant.remove(); fant=null; chip.style.opacity=''; mov=false; });
}
