    if (its.length) corrida(its, z, {modo:'puerta', per, fin});
    else {
      z.innerHTML = `<p style="font-weight:700;margin:0 0 10px">Haz tu trabajo y marca lo que lograste.</p><textarea class="esc" placeholder="Escribe aquí tu trabajo"></textarea><div class="cotejo">${chk.map((c, k) => `<label><input type="checkbox"><span>${esc(c.t)}</span></label>`).join('')}</div>${botonPie('Terminé')}`;
      $('[data-pie]', z).onclick = () => fin({ok:$$('.cotejo input:checked', z).length, tot:chk.length, datos:{txt:$('textarea', z).value.slice(0, 600)}});
    }
  };
};
function resultadoPuerta(key, n, q, pt, res, el){
  const p = pmo(key, n), mo = momObj(key, n), paso = res.ok >= pt.min;
  p.g.push({p:q, ok:res.ok, tot:res.tot, paso, f:Date.now()});
  if (!paso && mo.ref && mo.ref.acts.length){ p.refPend = true; p.rh = {}; }
  guardarP();
  REG.anota('puerta', Object.assign({s:MODS[key].mod.cod, a:pt.cod, ok:res.ok, tot:res.tot, paso:paso ? 1 : 0, p:q}, res.datos || {}));
  const z = $('#zona', el); z.classList.add('result');
  const sig = momsRuta(key).find(m => m.n > n);
  const mal = (res.det || []).filter(d => !d.bien);
  let h = `<div class="${paso ? 'abierta' : ''}" style="width:110px;margin:0 auto">${puertaSVG()}</div><h2>${paso ? '¡Puerta abierta!' : 'Todavía no'}</h2>
    <p>${paso ? `Tuviste <b>${res.ok} de ${res.tot}</b>. ${sig ? 'Ya puedes seguir al Momento ' + sig.n + '.' : 'Terminaste la ruta de este módulo.'}` : `Tuviste <b>${res.ok} de ${res.tot}</b> y necesitas ${pt.min}. ${mo.ref && mo.ref.acts.length ? 'Te lo voy a explicar de otra forma.' : 'Repasa y vuelve a intentarlo.'}`}</p>`;
  h += mejorarHTML((res.det || []).map(d => Object.assign({}, d, {por:''})));
  h += '<div class="pie" style="flex-direction:column">';
  if (paso) h += `<button class="btn lima full" data-ir="${sig ? 'mom' : 'aprendi'}" data-cambia data-a="${A(sig ? {key, n:sig.n} : {key})}">${sig ? 'Ir al Momento ' + sig.n : '¿Qué aprendí?'} ${SV.sigue}</button>`;
  else if (p.refPend) h += `<button class="btn full" data-ir="refz" data-cambia data-a="${A({key, n})}">Ir al refuerzo ${SV.sigue}</button>`;
  else h += `<button class="btn full" data-ir="mom" data-cambia data-a="${A({key, n})}">Volver al momento</button>`;
  h += '</div>';
  z.innerHTML = h;
  if (paso){ fx('puerta'); confeti(z); } else fx('pop');
}

/* ===== refuerzo ===== */
V.refz = ({key, n}, el) => {
  const m = MODS[key].mod, mo = momObj(key, n), p = pmo(key, n), r = mo.ref || {acts:[]};
  let h = topbar(m.cod + ' · Momento ' + n, 'Refuerzo', true);
  h += `<div class="otra g entra">${mishi('idea')}<small>OTRA FORMA DE EXPLICARLO</small><h2>Vamos por <span class="sub">otro camino</span></h2><p>${fmt(r.otra || 'Repasa la explicación y el vocabulario del módulo.')}</p></div>`;
  h += `<div class="sec"><h2>Actividades del refuerzo</h2><small>${r.acts.filter(a => p.rh[a.cod]).length} de ${r.acts.length}</small></div><div class="pila">` + r.acts.map((a, i) => actCard(key, n, a, i, true)).join('') + '</div>';
  const listo = !p.refPend, q = cualPuerta(key, n);
  h += `<div class="sec"><h2>Puerta ${q}</h2></div><div class="gate ${listo ? '' : 'cerrada'}">${puertaSVG()}<div class="tx"><small>PUERTA ${q} · PREGUNTAS DISTINTAS</small><b>${listo ? 'Lista para abrirse' : 'Termina el refuerzo'}</b><p>${listo ? 'Son preguntas nuevas, no las mismas.' : 'Haz todas las actividades de arriba.'}</p>${listo ? `<button class="btn lima chico" data-ir="puerta" data-a="${A({key, n})}">Abrir la Puerta ${q} ${SV.sigue}</button>` : ''}</div></div>`;
  el.innerHTML = h;
};

/* ===== momento 6: ¿qué aprendí? ===== */
const HARE = ['Repasar el vocabulario', 'Escuchar los audios otra vez', 'Hacer otra actividad del momento', 'Preguntarle a mi maestro', 'Practicar con un familiar'];
V.aprendi = ({key}, el) => {
  const m = MODS[key].mod, pmk = pm(key), sem = pmk.sem || {}, hare = new Set(pmk.hare || []);
  let h = topbar(m.cod + ' · Momento 6', '¿Qué aprendí?', true) + `<div class="momhead g entra"><div class="n">MOMENTO 6</div><h1><span class="sub">Reviso cómo voy</span></h1><span class="proc"><i>${SV.cerebro}</i><span>Metacognición</span></span><p style="margin:12px 0 0;font-size:15px">${fmt((m.aprendi && m.aprendi.texto) || 'Piensa en cada momento y marca cómo te sientes.')}</p></div>`;
  h += '<div class="pila" style="margin-top:12px">';
  momsRuta(key).forEach(mo => {
    const p = pmo(key, mo.n), g = p.g.find(x => x.paso), vez = p.g.findIndex(x => x.paso) === 0;
    h += `<div class="mrow g2"><div class="h"><b>${mo.n} · ${esc(mo.nombre)}</b>${g ? `<span class="puertita ${vez ? 'ok' : 'ref'}">${vez ? 'A la primera' : 'Con refuerzo'}</span>` : '<span class="puertita">Sin puerta</span>'}</div>
      <div class="semaf" data-m="${mo.n}">${[['v', 'Lo domino'], ['a', 'Casi'], ['r', 'Me cuesta']].map(s => `<button data-s="${s[0]}" class="${sem[mo.n] === s[0] ? 'on' : ''}"><i></i>${s[1]}</button>`).join('')}</div></div>`;
  });
  h += `</div><div class="g bien-c" style="margin-top:12px"><div class="item">${SV.ayuda}<div style="flex:1"><b>¿Qué me costó?</b><textarea class="esc" id="costo" style="min-height:80px;margin-top:6px;font-size:15.5px" placeholder="Escribe con tus palabras">${esc(pmk.costo || '')}</textarea></div></div>
    <div class="item">${SV.meta}<div style="flex:1"><b>¿Qué haré para recordarlo?</b><div class="cotejo">${HARE.map(t => `<label><input type="checkbox" value="${esc(t)}" ${hare.has(t) ? 'checked' : ''}><span>${esc(t)}</span></label>`).join('')}</div></div></div></div>
    <div class="pie"><button class="btn full" id="guarda">Guardar mi reflexión ${SV.sigue}</button></div>`;
  el.innerHTML = h;
  $$('.semaf', el).forEach(s => $$('button', s).forEach(b => b.onclick = () => { fx('tap'); $$('button', s).forEach(x => x.classList.remove('on')); b.classList.add('on'); sem[s.dataset.m] = b.dataset.s; }));
  $('#guarda', el).onclick = () => {
    const faltan = momsRuta(key).filter(mo => !sem[mo.n]);
    if (faltan.length){ toast('Marca tu semáforo en todos los momentos'); $$('.semaf', el).find(s => !sem[s.dataset.m])?.closest('.mrow').classList.add('sacude'); return; }
    pmk.sem = sem; pmk.costo = $('#costo', el).value.slice(0, 400); pmk.hare = $$('.cotejo input:checked', el).map(i => i.value); pmk.e.apr = 1; guardarP();
    REG.anota('semaforo', {s:m.cod, a:'M6', sem:JSON.stringify(sem), costo:pmk.costo, hare:pmk.hare.join(' | ')});
    fx('fin'); cambiar('sigue', {key});
  };
};

/* ===== siguiente paso ===== */
V.sigue = ({key}, el) => {
  const m = MODS[key].mod, pmk = pm(key), sem = pmk.sem || {};
  if (!pmk.e.sig){ pmk.e.sig = 1; guardarP(); REG.anota('etapa', {s:m.cod, a:'fin'}); }
  const repasar = momsRuta(key).filter(mo => sem[mo.n] === 'r' || sem[mo.n] === 'a' || pmo(key, mo.n).g.some(g => !g.paso));
  const ojo = momsRuta(key).filter(mo => sem[mo.n] === 'v' && pmo(key, mo.n).g.some(g => !g.paso));
  const ks = llavesDe(MODS[key].g), sig = ks[ks.indexOf(key) + 1];
  let h = topbar(m.cod, 'Siguiente paso') + `<div class="result g entra" style="padding-top:26px">${mishi('estrellas', 'mishi')}<h2 style="font-size:34px">¡Terminaste <span class="mk">${esc(m.titulo.replace(/\s*\(.*?prueba.*?\)\s*/i, ''))}</span>!</h2><p>${fmt((m.sigue && m.sigue.texto) || '')}</p></div>`;
  if (ojo.length) h += `<div class="fb info" style="margin-top:12px">${mishi('pensando', '')}<div><b>Ojo con tu semáforo</b>Marcaste verde en ${ojo.map(mo => 'el Momento ' + mo.n).join(' y ')}, pero ahí necesitaste refuerzo. Vale la pena repasarlo.</div></div>`;
  if (repasar.length) h += `<div class="sec"><h2>Para repasar</h2></div><div class="pila">` + repasar.map((mo, i) => `<button class="actc g2 entra" style="--i:${i}" data-ir="mom" data-a="${A({key, n:mo.n})}"><span class="le">${mo.n}</span><span class="tx"><b>${esc(mo.nombre)}</b><small class="muted" style="font-size:12.5px;font-weight:600">${sem[mo.n] === 'r' ? 'Marcaste rojo' : sem[mo.n] === 'a' ? 'Marcaste amarillo' : 'Necesitaste refuerzo'}</small></span><span class="der" style="color:var(--tenue)">${SV.der.replace('<svg', '<svg width="20" height="20"')}</span></button>`).join('') + '</div>';
  h += '<div class="pie" style="flex-direction:column">' + (sig ? `<button class="btn lima full" data-ir="mod" data-a="${A({key:sig})}">Siguiente módulo: ${esc(MODS[sig].mod.cod)} ${SV.sigue}</button>` : '') + `<button class="btn sec full" data-nav="inicio">Volver al inicio</button></div>`;
  el.innerHTML = h;
  setTimeout(() => { const r = $('.result', el); if (r) confeti(r); fx('fin'); }, 300);
};

/* ===== palabras ===== */
V.palabras = ({q}, el) => {
  let h = `<div class="top"><div class="t"><small>Todas tus palabras</small><b>Palabras</b></div></div><label class="buscar g2">${SV.lupa}<input id="bq" placeholder="Busca en inglés o en español" value="${esc(q || '')}" autocomplete="off"></label><div id="lp"></div>`;
  el.innerHTML = h;
  const lista = () => {
    const t = clave($('#bq', el).value); let o = '';
    grados().forEach(g => llavesDe(g).forEach(k => {
      const m = MODS[k].mod, vs = (m.vocab || []).filter(v => !t || clave(v.palabra + ' ' + v.sig).indexOf(t) >= 0);
      if (!vs.length) return;
      o += `<div class="sec"><h2 style="font-size:20px">${esc(m.titulo.replace(/\s*\(.*?prueba.*?\)\s*/i, ''))}</h2><small>${esc(m.cod)}</small></div><div class="pila">` + vs.map(v => `<div class="pal g2">${vimg(v.palabra, v.img)}<div class="tx"><b>${esc(v.palabra)}</b><small>${esc(v.afi || '')} · ${esc(v.sig)}</small></div>${rep(v.audio ? v.audio.txt : v.palabra, {per:v.audio ? v.audio.per : 'Kevin', mini:true})}</div>`).join('') + '</div>';
    }));
    $('#lp', el).innerHTML = o || '<p class="muted" style="margin:16px 4px">No encontré esa palabra.</p>';
  };
  $('#bq', el).oninput = lista; lista();
};

/* ===== mi avance ===== */
V.avance = (a, el) => {
  let pu = 0, pt = 0, ah = 0, ok = 0, tot = 0;
  const ks = grados().flatMap(llavesDe);
  ks.forEach(k => momsRuta(k).forEach(mo => { pt++; if (pasada(k, mo.n)) pu++; const p = pmo(k, mo.n); Object.values(p.a).forEach(r => { ah++; ok += r.ok; tot += r.tot; }); }));
  let h = `<div class="top"><div class="t"><small>${esc(S.nombre || '')}${S.grupo ? ' · ' + esc(S.grupo) : ''}</small><b>Mi avance</b></div></div>
    <div class="kpis"><div class="kpi g2"><b>${pu}</b><small>de ${pt} puertas</small></div><div class="kpi g2"><b>${ah}</b><small>actividades</small></div><div class="kpi g2"><b>${tot ? Math.round(ok * 100 / tot) : 0}%</b><small>aciertos</small></div></div>`;
  ks.forEach(k => {
    const m = MODS[k].mod, sem = pm(k).sem || {};
    h += `<div class="mrow g" style="margin-top:12px"><div class="h"><b>${esc(m.cod)} · ${esc(m.titulo.replace(/\s*\(.*?prueba.*?\)\s*/i, ''))}</b><button class="lnk" data-ir="mod" data-a="${A({key:k})}">Abrir</button></div>${dotsMod(k)}<div style="display:grid;gap:6px;margin-top:10px">`;
    momsRuta(k).forEach(mo => {
      const p = pmo(k, mo.n), g = p.g;
      h += `<div style="display:flex;justify-content:space-between;gap:8px;font-size:13.5px;font-weight:600"><span>${mo.n} · ${esc(mo.nombre)}</span><span class="muted">${g.length ? g.map(x => 'Puerta ' + x.p + ': ' + x.ok + '/' + x.tot + (x.paso ? ' ✓' : '')).join(' · ') : hechas(k, mo.n) + '/' + mo.acts.length + ' act.'}${sem[mo.n] ? ` <i style="display:inline-block;width:10px;height:10px;border-radius:5px;background:${{v:'#2BB673', a:'#F4B000', r:'#E5484D'}[sem[mo.n]]}"></i>` : ''}</span></div>`;
    });
    h += '</div></div>';
  });
  el.innerHTML = h;
};

/* ===== ayuda ===== */
V.ayuda = (a, el) => {
  const pasos = [['brujula', 'Bienvenida', 'Qué vas a aprender y un calentamiento rápido.'], ['libro', 'Explicación', 'Pasos cortos. Toca, voltea o escucha mientras lees.'], ['libreta', 'Vocabulario', 'Solo la palabra: cómo se escribe, cómo suena y qué significa.'], ['chat', 'Así se usa', 'La palabra dentro de una frase.'],
    ['rompecabezas', 'Momentos 1 a 5', 'Varias actividades. Al terminar una, eliges: otra igual, una más difícil o cambiar de habilidad.'], ['candado', 'Puerta de dominio', 'Preguntas nuevas. Pasas con 80 %. Si no, hay refuerzo y otra puerta con preguntas distintas.'], ['tarea', '¿Qué aprendí?', 'Tu semáforo, lo que te costó y tu plan.']];
  let h = `<div class="top"><div class="t"><small>Guía rápida</small><b>¿Cómo se usa?</b></div></div><div class="g bien-c"><h2>Así funciona <span class="sub">tu Encarta</span></h2>` +
    pasos.map(p => `<div class="item">${ic(p[0])}<div><b>${esc(p[1])}</b>${esc(p[2])}</div></div>`).join('') + '</div>';
  h += `<div class="sec"><h2>Controles del audio</h2></div><div class="g tema">${rep('Sunday, Monday, Tuesday, Wednesday, Thursday, Friday, Saturday.', {per:'Kevin', etq:'Pruébalo aquí'})}<div class="chips" style="margin-top:10px"><span class="chip">▶ Reproducir y pausar</span><span class="chip">↺5 Regresar 5 segundos</span><span class="chip">1× · .75× · 1.25× Velocidad</span></div><p class="muted" style="margin:10px 0 0;font-size:13.5px">En las puertas, los audios solo se pueden oír 2 veces.</p></div>`;
  h += `<div class="sec"><h2>Cada tipo de actividad</h2></div><div class="pila">` + Object.keys(COMO).filter(k => k !== 'libre').map((k, i) => `<button class="actc g2 entra" style="--i:${i}" data-como="${k}"><span class="le" style="font-size:18px">${i + 1}</span><span class="tx"><b>${esc(COMO[k].t)}</b></span><span class="der" style="color:var(--tenue)">${SV.der.replace('<svg', '<svg width="20" height="20"')}</span></button>`).join('') + '</div>';
  el.innerHTML = h;
  $$('[data-como]', el).forEach(b => b.onclick = () => verComo({motor:b.dataset.como, como:[], aud:[], its:[]}));
};

/* ===== cuenta y ajustes ===== */
function ajustes(){
  abrirHoja(`<h3>${esc(S.nombre || (MAESTRO ? 'Profesor' : 'Mi cuenta'))}</h3><p class="muted" style="margin:-4px 0 14px;font-weight:700">${esc(S.grupo || S.grado || '')}${PRUEBA ? ' · modo de prueba' : ''}</p>
    <div class="cotejo"><label><input type="checkbox" id="ajS" ${AJ.sonido ? 'checked' : ''}><span>Sonidos de la Encarta</span></label><label><input type="checkbox" id="ajV" ${AJ.vibrar ? 'checked' : ''}><span>Vibración</span></label></div>
    <div class="pie" style="flex-direction:column"><button class="btn sec full" id="ajSal">${SV.salir} Salir</button></div>`, h => {
    $('#ajS', h).onchange = e => { AJ.sonido = e.target.checked; guardarAj(); };
    $('#ajV', h).onchange = e => { AJ.vibrar = e.target.checked; guardarAj(); };
    $('#ajSal', h).onclick = () => { cerrarHoja(true); salir(); };
  });
}

/* ===== entrada ===== */
const SES_KEY = PRUEBA ? 'enc4_prueba_ses' : 'encarta_ses';
V.login = () => `<div class="login"><form class="box g" id="fLogin" autocomplete="off">${mishi('guino')}<h1>Mi <span class="mk vis">Encarta</span></h1>
  ${PRUEBA ? `<p class="muted" style="margin:0;font-weight:700">Versión de prueba. Elige tu grado.</p>
    ${['1°', '2°'].map(g => `<button class="btn ${g === '1°' ? '' : 'sec'} full" type="button" data-gr="${g}">Soy de ${g}${(D[g] || []).length ? '' : ' (aún sin módulos)'}</button>`).join('')}`
  : `<p class="muted" style="margin:0;font-weight:700">Entra con el código y el PIN del portal de familias.</p>
    <div><label for="lCod">Código</label><input class="campo" id="lCod" maxlength="6" placeholder="6 letras o números" autocapitalize="characters" spellcheck="false"></div>
    <div><label for="lPin">PIN</label><input class="campo" id="lPin" type="password" inputmode="numeric" maxlength="4" placeholder="4 números"></div>
    <button class="btn full" type="submit" id="bEntrar">Entrar</button><small class="muted" id="lMsg" style="min-height:20px;font-weight:700"></small>`}
  <small class="muted" style="font-size:12px">No compartas tu PIN con nadie.</small></form></div>`;
function entrarCon(r, codigo){
  S.grado = r.grado; S.grupo = r.grupo || ''; S.nombre = r.nombre || ''; S.c = codigo || ''; S.tk = r.tk || '';
  try { localStorage.setItem(SES_KEY, JSON.stringify({grado:S.grado, grupo:S.grupo, n:S.nombre, c:S.c, tk:S.tk})); } catch(e){}
  cargarP(); REG.anota('ingreso', {}); REG.enviar(); fx('fin'); raiz('inicio');
}
function salir(){ REG.enviar(true); try { localStorage.removeItem(SES_KEY); } catch(e){} S.c = ''; S.tk = ''; R.pila = []; R.pant = 'login'; pintar(); }
function conectarLogin(){
  $$('[data-gr]').forEach(b => b.onclick = () => { SND.desbloquear(); entrarCon({grado:b.dataset.gr}); });
  const f = $('#fLogin'); if (PRUEBA){ f.onsubmit = e => e.preventDefault(); return; }
  f.onsubmit = async e => {
    e.preventDefault(); SND.desbloquear();
    const c = $('#lCod').value.toUpperCase().replace(/[^A-Z0-9]/g, ''), p = $('#lPin').value.replace(/[^0-9]/g, '');
    const msg = $('#lMsg'), btn = $('#bEntrar');
    if (c.length !== 6 || p.length !== 4){ fx('no'); msg.textContent = 'El código tiene 6 letras o números y el PIN 4 números.'; return; }
    btn.disabled = true; msg.textContent = 'Revisando…';
    const r = await jsonp({encarta:1, c, p});
    btn.disabled = false;
    if (r && r.ok) return entrarCon(r, c);
    fx('no'); f.classList.add('sacude'); setTimeout(() => f.classList.remove('sacude'), 400);
    msg.textContent = r && r.e === 'BLOQUEADO' ? 'Demasiados intentos. Espera 15 minutos.' : r && r.e === 'RED' ? 'No hay conexión. Intenta de nuevo.' : 'Código o PIN incorrecto. Revisa tu papeleta.';
  };
}
function arrancar(){
  indexar();
  try { const s = JSON.parse(localStorage.getItem(SES_KEY) || 'null'); if (s && s.grado){ S.grado = s.grado; S.grupo = s.grupo || ''; S.nombre = s.n || ''; S.c = s.c || ''; S.tk = s.tk || ''; } } catch(e){}
  if (MAESTRO){ S.grado = S.grado || '1°'; }
  cargarP();
  R.pant = (S.grado || MAESTRO) ? 'inicio' : 'login';
  pintar();
}
arrancar();

</script>
</body></html>
