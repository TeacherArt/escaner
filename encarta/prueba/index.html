<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#9CC7FF">
<title>Mi Encarta</title>
<meta name="robots" content="noindex">
<link rel="icon" href="https://teacherart.github.io/escaner/encarta/ui/mishi_normal.webp">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>:root{
  --tinta:#1D2448; --suave:#5A6286; --tenue:#8A90AE;
  --azul:#3B6CF6; --azul2:#5C8DFF; --azulT:#E6EEFF;
  --morado:#7B5CF0; --rosa:#F0548E; --menta:#20B98A; --naranja:#FF9A3D; --rojo:#E5484D;
  --bien:#17A673; --bienT:#DDF7EC; --mal:#E5484D; --malT:#FDE7E8;
  --vidrio:rgba(255,255,255,.58); --vidrio2:rgba(255,255,255,.78); --borde:rgba(255,255,255,.85);
  --sombra:0 10px 30px rgba(52,72,160,.16), 0 2px 6px rgba(52,72,160,.08);
  --brillo:inset 0 1px 0 rgba(255,255,255,.95), inset 0 -1px 0 rgba(255,255,255,.35);
  --r:26px; --r2:18px; --r3:999px;
  --fondo:linear-gradient(170deg,#9CC7FF 0%,#C9DEFF 45%,#F3F7FF 100%);
  --fondoImg:none;
  --acc:var(--azul); --acc2:var(--azul2); --accT:var(--azulT);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:"Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:17px;line-height:1.5;color:var(--tinta);
  background:var(--fondo);min-height:100vh;min-height:100dvh;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:var(--fondoImg) center/cover no-repeat, var(--fondo);transition:opacity .4s}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
img{max-width:100%}
img.ic{width:40px;height:40px;object-fit:contain}
h1,h2,h3,h4{margin:0;line-height:1.15;font-weight:900;letter-spacing:-.01em}
p{margin:0 0 10px}
.oculto{display:none!important}
.muted{color:var(--suave)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- vidrio ---------- */
.vid{background:var(--vidrio);-webkit-backdrop-filter:blur(22px) saturate(170%);backdrop-filter:blur(22px) saturate(170%);
  border:1px solid var(--borde);box-shadow:var(--sombra),var(--brillo);border-radius:var(--r)}
.vid2{background:var(--vidrio2);-webkit-backdrop-filter:blur(18px) saturate(160%);backdrop-filter:blur(18px) saturate(160%);
  border:1px solid var(--borde);box-shadow:0 6px 18px rgba(52,72,160,.12),var(--brillo);border-radius:var(--r2)}
@supports not ((backdrop-filter:blur(2px)) or (-webkit-backdrop-filter:blur(2px))){ .vid{background:rgba(255,255,255,.9)} .vid2{background:rgba(255,255,255,.95)} }

/* ---------- estructura ---------- */
.app{max-width:1100px;margin:0 auto;padding:0 16px calc(96px + env(safe-area-inset-bottom))}
.top{position:sticky;top:0;z-index:30;padding:10px 0 8px;margin:0 -16px;padding-left:16px;padding-right:16px;
  background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,0));}
.top .in{display:flex;align-items:center;gap:10px;max-width:1100px;margin:0 auto}
.top .tit{flex:1;min-width:0;font-weight:900;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .tit small{display:block;font-size:12px;font-weight:700;color:var(--suave);letter-spacing:.02em}
.rb{width:46px;height:46px;flex:0 0 46px;border-radius:16px;display:grid;place-items:center;padding:0;border:1px solid var(--borde);
  background:rgba(255,255,255,.7);box-shadow:0 4px 14px rgba(52,72,160,.14),var(--brillo);transition:transform .15s}
.rb img{width:30px;height:30px}
.rb:active{transform:scale(.92)}
.rb[disabled]{opacity:.35}
.rb.txt{width:auto;padding:0 14px;font-weight:900;font-size:14px}

/* barra de abajo (celular) */
.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom));z-index:40;display:flex;gap:4px;padding:6px;border-radius:28px;width:min(440px,calc(100% - 24px))}
.tabbar button{flex:1;border:0;background:transparent;border-radius:22px;padding:6px 2px 4px;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:11px;font-weight:800;color:var(--suave)}
.tabbar button img{width:30px;height:30px;transition:transform .2s}
.tabbar button.on{background:rgba(255,255,255,.85);color:var(--acc);box-shadow:0 2px 10px rgba(52,72,160,.15)}
.tabbar button.on img{transform:translateY(-1px) scale(1.06)}

/* ---------- login ---------- */
.login{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px 16px}
.login .box{width:min(420px,100%);padding:26px 22px 22px;text-align:center;display:flex;flex-direction:column;gap:12px}
.login .mishi{width:150px;height:150px;margin:-80px auto 0;filter:drop-shadow(0 16px 20px rgba(110,90,220,.28));animation:flota 4s ease-in-out infinite}
.login h1{font-size:30px}
.login h1 span{background:linear-gradient(90deg,var(--azul),var(--morado));-webkit-background-clip:text;background-clip:text;color:transparent}
.campo{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.85);border:1px solid #E1E7FA;border-radius:16px;padding:0 14px;height:54px;box-shadow:inset 0 1px 2px rgba(30,40,90,.06)}
.campo input{border:0;outline:0;background:transparent;flex:1;min-width:0;font-size:18px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.campo input::placeholder{letter-spacing:0;text-transform:none;font-weight:600;color:var(--tenue)}
.campo:focus-within{border-color:var(--azul2);box-shadow:0 0 0 4px rgba(59,108,246,.15)}
.campo img{width:26px;height:26px;opacity:.9}
.login label{display:block;text-align:left;font-size:13px;font-weight:800;color:var(--suave);margin:0 0 4px 6px}
@keyframes flota{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}

/* ---------- botones ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 22px;border-radius:var(--r3);border:0;font-weight:900;font-size:17px;color:#fff;
  background:linear-gradient(180deg,var(--acc2),var(--acc));box-shadow:0 8px 20px color-mix(in srgb,var(--acc) 35%,transparent),inset 0 1px 0 rgba(255,255,255,.45),inset 0 -2px 0 rgba(0,0,0,.08);
  transition:transform .12s,filter .12s}
.btn:active{transform:scale(.96)}
.btn[disabled]{filter:grayscale(.6);opacity:.6}
.btn.sec{background:rgba(255,255,255,.8);color:var(--acc);box-shadow:0 4px 14px rgba(52,72,160,.12),var(--brillo);border:1px solid var(--borde)}
.btn.ch{min-height:42px;padding:0 16px;font-size:15px}
.btn.full{width:100%}
.btn small{display:block;font-size:11px;font-weight:700;opacity:.85}
.acciones{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:46px;padding:8px 16px;border-radius:16px;border:1px solid #DDE4F7;background:rgba(255,255,255,.92);
  font-weight:800;font-size:16px;color:var(--tinta);box-shadow:0 2px 0 #DDE4F7;transition:transform .1s,background .15s}
.chip:active{transform:translateY(2px);box-shadow:none}
.chip.sel{background:var(--accT);border-color:var(--acc2);color:var(--acc);box-shadow:0 2px 0 var(--acc2)}
.chip.ok{background:var(--bienT);border-color:var(--bien);color:#0B6B49;box-shadow:0 2px 0 var(--bien)}
.chip.no{background:var(--malT);border-color:var(--mal);color:#9B1C20}
.chip.usado{opacity:.35}
.chip[disabled]{cursor:default}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 11px;font-size:13px;font-weight:800;background:rgba(255,255,255,.75);color:var(--suave);border:1px solid var(--borde)}
.pill.acc{background:var(--accT);color:var(--acc)}
.pill.bien{background:var(--bienT);color:#0B6B49}
.pill.oro{background:#FFF1D6;color:#9A5B00}

/* audio */
.aud{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:999px;min-height:44px;padding:0 16px 0 6px;font-weight:900;font-size:15px;
  background:linear-gradient(180deg,#fff,#EEF3FF);color:var(--acc);box-shadow:0 4px 12px rgba(52,72,160,.14),var(--brillo)}
.aud i{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(180deg,var(--acc2),var(--acc));color:#fff}
.aud.sm{padding:0;width:40px;min-height:40px;height:40px;justify-content:center;vertical-align:middle;flex:0 0 40px}
.aud.sm i{width:32px;height:32px}
.aud.hablando i{animation:late 1s ease-in-out infinite}
@keyframes late{0%,100%{box-shadow:0 0 0 0 rgba(59,108,246,.45)}50%{box-shadow:0 0 0 8px rgba(59,108,246,0)}}
.audrow{display:flex;align-items:center;gap:10px;margin:10px 0}
.audrow small{color:var(--suave);font-weight:700}

/* ---------- inicio ---------- */
.saludo{display:flex;align-items:center;gap:12px;padding:6px 2px 12px}
.saludo h1{font-size:26px}
.saludo small{display:block;font-weight:700;color:var(--suave);font-size:14px}
.hero{position:relative;padding:18px 18px 18px 18px;display:flex;align-items:center;gap:12px;overflow:hidden;margin-bottom:14px}
.hero .mishi{width:118px;height:118px;flex:0 0 118px;filter:drop-shadow(0 12px 16px rgba(110,90,220,.25));animation:flota 4.5s ease-in-out infinite}
.hero .glob{position:relative;background:#fff;border-radius:20px;padding:12px 14px;font-weight:800;box-shadow:0 6px 16px rgba(52,72,160,.12);font-size:16px}
.hero .glob::before{content:"";position:absolute;left:-8px;top:24px;border:8px solid transparent;border-right-color:#fff;border-left:0}
.hero .glob small{display:block;color:var(--suave);font-weight:700;font-size:13px;margin-top:2px}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.tarj{position:relative;text-align:left;border:1px solid var(--borde);padding:14px;min-height:132px;display:flex;flex-direction:column;justify-content:space-between;gap:8px;overflow:hidden;transition:transform .15s}
.tarj:active{transform:scale(.97)}
.tarj img.ic{width:54px;height:54px;filter:drop-shadow(0 6px 10px rgba(52,72,160,.18))}
.tarj b{font-size:17px;line-height:1.2;display:block}
.tarj small{display:block;font-weight:700;color:var(--suave);font-size:13px;line-height:1.3}
.tarj.ancha{grid-column:1/-1;flex-direction:row;align-items:center;min-height:96px}
.tarj.gris{opacity:.55;filter:grayscale(.5)}
.tarj .barra{height:7px;border-radius:9px;background:rgba(59,108,246,.13);overflow:hidden;margin-top:4px}
.tarj .barra i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--acc2),var(--acc))}
.sec-t{display:flex;align-items:baseline;justify-content:space-between;margin:20px 4px 10px}
.sec-t h2{font-size:19px}
.sec-t small{font-weight:800;color:var(--suave);font-size:13px}
.lista{display:flex;flex-direction:column;gap:10px}
.fila{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--borde);text-align:left;width:100%;transition:transform .12s}
.fila:active{transform:scale(.98)}
.fila img.ic{width:44px;height:44px;flex:0 0 44px}
.fila .t{flex:1;min-width:0}
.fila .t b{display:block;font-size:16px;line-height:1.25}
.fila .t small{display:block;color:var(--suave);font-weight:700;font-size:13px;line-height:1.3}
.fila .der{font-weight:900;color:var(--acc);font-size:20px}
.fila.cer{opacity:.6}
.tip{display:flex;gap:10px;align-items:center;padding:12px 14px;border-radius:20px;background:linear-gradient(135deg,rgba(255,255,255,.9),rgba(235,241,255,.85));border:1px solid var(--borde);box-shadow:var(--sombra);margin:12px 0}
.tip img{width:56px;height:56px;flex:0 0 56px}
.tip > div > b:first-child{display:block;font-size:13px;letter-spacing:.06em;color:var(--acc)}

/* ---------- tema ---------- */
.semanas{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px;scrollbar-width:none;margin:0 -16px;padding-left:16px;padding-right:16px}
.semanas::-webkit-scrollbar{display:none}
.semanas button{flex:0 0 auto;border-radius:999px;border:1px solid var(--borde);background:rgba(255,255,255,.65);padding:9px 16px;font-weight:900;font-size:15px;color:var(--suave);box-shadow:0 2px 8px rgba(52,72,160,.1)}
.semanas button.on{background:linear-gradient(180deg,var(--acc2),var(--acc));color:#fff;border-color:transparent}
.semanas button small{font-weight:700;opacity:.8;margin-left:4px}
.subt{display:grid;grid-template-columns:1fr;gap:10px}
.subt .fila .num{width:44px;height:44px;flex:0 0 44px;border-radius:14px;display:grid;place-items:center;font-weight:900;color:#fff;background:linear-gradient(160deg,var(--acc2),var(--acc));box-shadow:0 6px 12px color-mix(in srgb,var(--acc) 30%,transparent)}
.subt .fila.hecho .num{background:linear-gradient(160deg,#3DD39B,var(--bien))}

/* ---------- subtema ---------- */
.cabeza{padding:16px 16px 14px;margin-bottom:12px}
.cabeza h1{font-size:26px}
.cabeza .es{font-weight:700;color:var(--suave);font-size:16px;margin-top:2px}
.cabeza .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;align-items:center}
.objetivo{display:flex;gap:10px;align-items:flex-start;margin-top:12px;padding:12px;border-radius:16px;background:rgba(255,255,255,.7);font-weight:700;font-size:15px}
.objetivo img{width:34px;height:34px;flex:0 0 34px}
.pestanas{position:sticky;top:64px;z-index:20;display:flex;gap:8px;overflow-x:auto;padding:6px 16px 10px;margin:0 -16px;scrollbar-width:none}
.pestanas::-webkit-scrollbar{display:none}
.pestanas button{flex:0 0 auto;display:flex;align-items:center;gap:6px;border:1px solid var(--borde);background:rgba(255,255,255,.72);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-radius:999px;padding:6px 14px 6px 6px;font-weight:900;font-size:14px;color:var(--suave);box-shadow:0 3px 10px rgba(52,72,160,.1)}
.pestanas button img{width:28px;height:28px}
.pestanas button.on{background:linear-gradient(180deg,var(--acc2),var(--acc));color:#fff;border-color:transparent}
.pestanas button .ok{font-size:12px}
.card{padding:18px 16px;margin-bottom:14px}
.card > h3{font-size:20px;margin-bottom:6px}
.eyebrow{font-size:12px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--acc);margin-bottom:4px}
.ins{color:var(--suave);font-weight:700;font-size:15px;margin:2px 0 12px}
.art h3{font-size:19px;margin:18px 0 6px}
.art h3:first-child{margin-top:4px}
.art p{font-size:17px}
figure.med{margin:12px 0;border-radius:20px;overflow:hidden;background:#fff;box-shadow:0 8px 22px rgba(52,72,160,.14)}
figure.med img{display:block;width:100%;height:auto}
figure.med figcaption{font-size:12px;color:var(--suave);padding:6px 12px;font-weight:700}
.stk{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px;margin:12px 0}
.stk img{width:100%;height:auto;border-radius:14px;background:#fff;box-shadow:0 3px 8px rgba(52,72,160,.1)}
.sabias{display:flex;gap:10px;align-items:flex-end;margin:16px 0}
.sabias img{width:82px;height:82px;flex:0 0 82px;filter:drop-shadow(0 8px 10px rgba(110,90,220,.25))}
.sabias .glob{flex:1;background:linear-gradient(135deg,#FFFFFF,#F1ECFF);border-radius:20px 20px 20px 6px;padding:12px 14px;box-shadow:0 6px 16px rgba(110,90,220,.14);font-size:16px}
.sabias .glob b{display:block;font-size:12px;letter-spacing:.08em;color:var(--morado);margin-bottom:2px}
.repaso-cand{text-align:center;padding:26px 16px}
.repaso-cand img{width:110px;height:110px}
.ph{display:flex;flex-direction:column;justify-content:center;gap:4px;border:2px dashed #C9D3F2;border-radius:18px;padding:14px;color:var(--suave);font-size:13px;background:rgba(255,255,255,.5);margin:10px 0}
.ph b{color:var(--tinta)}
.tag{font-family:ui-monospace,monospace;font-size:12px}
.navsub{display:flex;justify-content:space-between;gap:10px;margin:6px 0 20px}

/* ---------- interactivos ---------- */
.flips{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.flip{position:relative;border:0;padding:0;background:transparent;perspective:900px;min-height:200px;text-align:center}
.flip .c{position:absolute;inset:0;transition:transform .5s cubic-bezier(.2,.8,.2,1);transform-style:preserve-3d}
.flip.v .c{transform:rotateY(180deg)}
.flip .f,.flip .b{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:10px;
  border:1px solid var(--borde);box-shadow:0 8px 20px rgba(52,72,160,.14),var(--brillo)}
.flip .f{background:linear-gradient(160deg,#FFFFFF,#EAF0FF);font-weight:900;color:var(--tinta)}
.flip .f img{width:78px;height:78px;object-fit:contain;border-radius:14px}
.flip .b{background:linear-gradient(160deg,var(--acc2),var(--acc));color:#fff;transform:rotateY(180deg);font-size:12.5px;line-height:1.25;overflow:hidden;justify-content:space-evenly}
.flip .b b{font-size:15px}
.flip .b em{font-style:normal;font-weight:800;background:rgba(255,255,255,.18);border-radius:10px;padding:4px 8px}
.flip .b span{opacity:.92}
.pasos{display:flex;flex-direction:column;gap:10px}
.paso{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:18px;background:rgba(255,255,255,.75)}
.paso .n{width:38px;height:38px;flex:0 0 38px;border-radius:12px;display:grid;place-items:center;font-weight:900;color:#fff;background:linear-gradient(160deg,var(--acc2),var(--acc))}
.paso b{display:block}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:16px}
table.tabla{border-collapse:separate;border-spacing:0;width:100%;background:rgba(255,255,255,.8);border-radius:16px;overflow:hidden;font-size:15px}
.tabla th,.tabla td{padding:10px 12px;border-bottom:1px solid #E8ECF8;text-align:left;vertical-align:middle}
.tabla th{background:var(--accT);color:var(--acc);font-weight:900;font-size:13px}
.tabla tr:last-child td{border-bottom:0}
.voto{display:flex;flex-direction:column;gap:8px}
.voto label{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:16px;background:rgba(255,255,255,.85);border:1px solid #E1E7FA;font-weight:800}
.voto input{width:22px;height:22px;accent-color:var(--acc)}
.barrav{position:relative;border-radius:14px;background:rgba(255,255,255,.75);overflow:hidden;padding:11px 14px;display:flex;justify-content:space-between;font-weight:800}
.barrav i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,rgba(92,141,255,.35),rgba(59,108,246,.25));border-radius:14px;transition:width .8s}
.barrav span,.barrav b{position:relative}
.barrav.mia{outline:2px solid var(--acc2)}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cmp .h{font-weight:900;color:var(--acc);font-size:14px;padding:4px 6px}
.cmp .c{display:flex;align-items:center;justify-content:space-between;gap:6px;background:rgba(255,255,255,.85);border-radius:14px;padding:8px 10px;font-weight:800}
.comic{display:grid;grid-template-columns:1fr;gap:12px}
.vin{border-radius:20px;background:rgba(255,255,255,.85);padding:12px;box-shadow:0 4px 12px rgba(52,72,160,.08)}
.vin .esc{font-size:14px;color:var(--suave)}
.vin .esc em{font-style:normal;font-weight:900;color:#fff;background:var(--acc);border-radius:8px;padding:0 7px;margin-right:6px}
.vin .glb{display:flex;gap:8px;align-items:center;margin:8px 0;padding:10px 12px;border-radius:18px 18px 18px 4px;background:#fff;border:2px solid var(--tinta);font-weight:800}
.vin .pie{font-size:14px;font-weight:700;color:var(--morado)}
.partes{display:flex;flex-wrap:wrap;gap:8px}
.detalle{display:flex;gap:10px;align-items:center;margin-top:12px;padding:12px 14px;border-radius:18px;background:#fff;box-shadow:0 6px 16px rgba(52,72,160,.12);animation:entra .25s}
@keyframes entra{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.linea-t{display:flex;gap:10px;overflow-x:auto;padding:8px 2px 12px;position:relative;scrollbar-width:thin}
.linea-t button{flex:0 0 auto;min-width:118px;border:1px solid var(--borde);border-radius:18px;background:rgba(255,255,255,.9);padding:10px;text-align:left;font-size:14px;box-shadow:0 4px 10px rgba(52,72,160,.1)}
.linea-t button b{display:block;color:var(--acc);font-size:15px}
.linea-t button.sel{outline:3px solid var(--acc2)}
.linea-t img{width:100%;height:90px;object-fit:cover;border-radius:12px;margin-bottom:6px}
.cancion{display:flex;flex-direction:column;gap:6px}
.cancion .l{display:flex;gap:10px;align-items:center;padding:6px 8px;border-radius:14px;background:rgba(255,255,255,.75);font-weight:800}
.cancion .l.on{background:var(--accT)}
.mente{display:flex;flex-direction:column;gap:8px}
.mente .c0{align-self:center;padding:12px 18px;border-radius:999px;background:linear-gradient(180deg,var(--acc2),var(--acc));color:#fff;font-weight:900}
.mente details{border-radius:16px;background:rgba(255,255,255,.85);padding:10px 12px}
.mente summary{font-weight:900;cursor:pointer}
.chat{display:flex;flex-direction:column;gap:8px;max-height:60vh;overflow:auto;padding:8px;border-radius:20px;background:rgba(255,255,255,.55)}
.msg{max-width:84%;padding:10px 12px;border-radius:18px;font-weight:700;display:flex;gap:6px;align-items:center}
.msg.el{align-self:flex-start;background:#fff;border-bottom-left-radius:6px}
.msg.yo{align-self:flex-end;background:linear-gradient(180deg,var(--acc2),var(--acc));color:#fff;border-bottom-right-radius:6px}
.semana7{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;position:relative}
.semana7 .d{border-radius:12px;background:rgba(255,255,255,.85);text-align:center;padding:8px 2px;font-weight:900;font-size:12px;min-height:84px;display:flex;flex-direction:column;align-items:center;gap:4px;border:2px solid transparent;transition:border-color .15s,background .15s}
.semana7 .d.sobre{border-color:var(--acc2);background:var(--accT)}
.semana7 .d img{width:38px;height:38px}
.semana7 .d .ev{font-size:11px;font-weight:800;background:var(--accT);color:var(--acc);border-radius:8px;padding:2px 4px;line-height:1.2}
.flecha{grid-column:var(--a)/var(--b);height:26px;border-radius:999px;background:linear-gradient(90deg,var(--acc2),var(--acc));color:#fff;font-size:12px;font-weight:900;display:flex;align-items:center;justify-content:center;margin-top:4px}
.idanim{display:flex;flex-direction:column;gap:8px}
.idanim .l{padding:10px 12px;border-radius:16px;background:#fff;font-weight:800;animation:entra .35s both;display:flex;gap:8px;align-items:center}
.idanim .l.oc span{filter:blur(6px)}
.iconos{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:10px 0}
.iconos button{border:1px solid var(--borde);background:#fff;border-radius:16px;padding:4px;width:64px;height:64px;box-shadow:0 3px 8px rgba(52,72,160,.12)}
.iconos button img{width:100%;height:100%}
.iconos button.sel{outline:3px solid var(--acc2)}
.cons .linea{min-height:64px;border:2px dashed #C9D3F2;border-radius:18px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:rgba(255,255,255,.6)}
.cons .fichas{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.cons select{border-radius:14px;border:1px solid #DDE4F7;min-height:46px;padding:0 10px;font-weight:800;background:#fff}
.crono{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.crono .big{font-size:56px;font-weight:900;min-width:96px;text-align:center;color:var(--acc)}
.auto .f{padding:10px 0;border-bottom:1px solid rgba(0,0,0,.06)}
.auto .f b{display:block;margin-bottom:6px}
.auto .ops{display:flex;gap:6px;flex-wrap:wrap}

/* ---------- juegos ---------- */
.juego{padding:0;overflow:hidden}
.juego .cab{display:flex;align-items:center;gap:10px;padding:14px 16px 6px}
.juego .cab img{width:40px;height:40px}
.juego .cab h3{font-size:19px;flex:1}
.juego .cuerpo{padding:6px 16px 18px}
.juego .pie{display:flex;gap:8px;flex-wrap:wrap;padding:10px 16px;border-top:1px solid rgba(255,255,255,.7);background:rgba(255,255,255,.35);font-size:14px;font-weight:800;color:var(--suave)}
.prog{height:9px;border-radius:9px;background:rgba(59,108,246,.13);overflow:hidden;margin:4px 0 14px}
.prog i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,#7DA6FF,var(--acc));transition:width .4s}
.preg{font-size:19px;font-weight:900;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ops{display:grid;grid-template-columns:1fr;gap:10px;margin-top:12px}
.op{min-height:56px;border-radius:18px;border:1px solid #DDE4F7;background:rgba(255,255,255,.95);font-weight:800;font-size:17px;text-align:left;padding:10px 16px;box-shadow:0 3px 0 #DDE4F7;transition:transform .1s}
.op:active{transform:translateY(2px);box-shadow:none}
.op.ok{background:var(--bienT);border-color:var(--bien);box-shadow:0 3px 0 var(--bien);color:#0B6B49}
.op.no{background:var(--malT);border-color:var(--mal);box-shadow:0 3px 0 var(--mal);color:#9B1C20}
.op.luz{animation:luz 1s ease-in-out 2}
@keyframes luz{50%{box-shadow:0 0 0 6px rgba(23,166,115,.35)}}
.fb{display:flex;gap:10px;align-items:center;margin-top:12px;padding:12px 14px;border-radius:18px;font-weight:800;animation:entra .25s}
.fb img{width:54px;height:54px;flex:0 0 54px}
.fb.ok{background:var(--bienT);color:#0B6B49}
.fb.no{background:#FFF4E5;color:#8A4B00}
.frase{font-size:19px;font-weight:800;line-height:2.1}
.hueco{width:6ch;min-width:3ch;border:0;border-bottom:3px solid var(--acc2);background:rgba(255,255,255,.85);border-radius:10px 10px 4px 4px;text-align:center;font-weight:900;font-size:19px;padding:4px 6px;outline:0;color:var(--acc)}
.hueco.c1{width:3ch}
.hueco.mal{border-color:var(--mal);color:var(--mal);animation:sacude .35s}
.sacude{animation:sacude .35s}
@keyframes sacude{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.ordenar .meta-l{min-height:64px;border:2px dashed #C9D3F2;border-radius:18px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:rgba(255,255,255,.55);transition:border-color .2s}
.ordenar.vert .meta-l{flex-direction:column;align-items:stretch}
.ordenar .pool,.pool{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.tren{display:flex;gap:4px;align-items:flex-end;overflow-x:auto;padding:6px 2px}
.vagon{flex:0 0 auto;min-width:92px;height:62px;border-radius:12px 12px 6px 6px;display:grid;place-items:center;color:#fff;font-weight:900;font-size:14px;position:relative;box-shadow:0 4px 0 rgba(0,0,0,.12)}
.vagon::after{content:"";position:absolute;bottom:-9px;left:14px;width:14px;height:14px;border-radius:50%;background:#33395A;box-shadow:50px 0 0 #33395A}
.rel{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rel .col{display:flex;flex-direction:column;gap:8px}
.rel .chip{width:100%;justify-content:center;text-align:center;font-size:15px}
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-top:12px}
.cats .cat{border:2px dashed #C9D3F2;border-radius:18px;background:rgba(255,255,255,.6);padding:10px;min-height:100px;text-align:left;transition:border-color .15s,background .15s}
.cats .cat.listo{border-color:var(--acc2);background:rgba(230,238,255,.8)}
.cats .cat b{display:block;font-size:15px;margin-bottom:6px}
.cats .dentro{display:flex;flex-wrap:wrap;gap:4px}
.cats .dentro span{font-size:13px;font-weight:800;background:var(--bienT);color:#0B6B49;border-radius:10px;padding:3px 8px}
.memo{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.memo button{aspect-ratio:1/1.1;border-radius:16px;border:1px solid var(--borde);background:linear-gradient(160deg,var(--acc2),var(--acc));color:#fff;font-weight:900;font-size:15px;padding:4px;box-shadow:0 4px 10px rgba(52,72,160,.18);transition:transform .3s}
.memo button.v{background:#fff;color:var(--tinta);transform:rotateY(0)}
.memo button.ok{background:var(--bienT);color:#0B6B49}
.sopa{display:grid;gap:3px;max-width:520px;margin:0 auto;touch-action:none;user-select:none}
.sopa button{aspect-ratio:1;border:0;border-radius:8px;background:rgba(255,255,255,.88);font-weight:900;font-size:clamp(12px,3.6vw,18px);padding:0}
.sopa button.f{background:#CFF3E3;color:#0B6B49}
.sopa button.s{background:var(--acc);color:#fff}
.palabras{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.palabras span{font-weight:800;font-size:14px;padding:3px 10px;border-radius:10px;background:rgba(255,255,255,.75)}
.palabras span.f{text-decoration:line-through;background:var(--bienT);color:#0B6B49}
.fin{text-align:center;padding:10px 0}
.fin img{width:130px;height:130px;filter:drop-shadow(0 10px 14px rgba(110,90,220,.25));animation:salta .6s cubic-bezier(.3,1.6,.5,1)}
@keyframes salta{from{transform:scale(.4) translateY(20px);opacity:0}to{transform:none;opacity:1}}
.fin .estrellas{font-size:38px;color:#FFB800;letter-spacing:4px;text-shadow:0 3px 8px rgba(255,184,0,.35)}
.fin h4{font-size:22px;margin:4px 0}
.niveles{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.lect{background:rgba(255,255,255,.85);border-radius:16px;padding:12px 14px;margin-bottom:12px}

/* buscar */
.buscar .campo{margin:6px 0 14px}
.res{display:block;width:100%;text-align:left;margin-bottom:8px;padding:12px 14px;border-radius:18px}
.res small{display:block;color:var(--suave);font-weight:600;font-size:13px}

/* maestro */
.pv{position:sticky;top:0;z-index:50;background:rgba(29,36,72,.92);color:#fff;font-size:13px;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.pv .in{max-width:1100px;margin:0 auto;padding:6px 16px;display:flex;gap:6px 14px;flex-wrap:wrap;align-items:center}
.pv select{font:inherit;font-size:13px;border-radius:8px;border:0;padding:3px 6px;background:#fff;color:var(--tinta)}
.maestro{background:rgba(255,248,230,.85)}
.maestro summary{font-weight:900;cursor:pointer}
.dl > div{padding:8px 0;border-bottom:1px solid rgba(0,0,0,.06);font-size:15px}
.dl b{display:block;font-size:13px;color:var(--suave)}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:60;background:rgba(29,36,72,.92);color:#fff;padding:10px 18px;border-radius:999px;font-weight:800;font-size:15px;animation:entra .25s;max-width:90vw;text-align:center}
.ajustes{display:flex;flex-direction:column;gap:10px}
.sw{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-radius:16px;background:rgba(255,255,255,.8);font-weight:800}
.sw input{width:48px;height:28px;accent-color:var(--acc)}

@media (min-width:760px){
  .grid2{grid-template-columns:repeat(3,1fr)}
  .flips{grid-template-columns:repeat(3,1fr)}
  .ops{grid-template-columns:1fr 1fr}
  .comic{grid-template-columns:1fr 1fr}
  .subt{grid-template-columns:1fr 1fr}
  .saludo h1{font-size:32px}
  .tabbar{width:420px}
  .memo{grid-template-columns:repeat(6,1fr)}
}
@media (min-width:1000px){ .flips{grid-template-columns:repeat(4,1fr)} }
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===================== Fase A ===================== */
:root{ --R:#2F7DE1; --L:#E8457C; --W:#FF7A3D; --S:#14A79A; }
.nota{font-size:13px;font-weight:700;color:var(--suave)}
body.sinscroll{overflow:hidden}
/* puntos R L W S */
.dots{display:inline-flex;gap:4px;margin-top:5px}
.dots i{font-style:normal;width:22px;height:22px;border-radius:7px;display:grid;place-items:center;font-size:12px;font-weight:900;color:#fff;background:var(--c);opacity:.28}
.dots i.on{opacity:1;box-shadow:0 2px 6px rgba(0,0,0,.18)}
.dotsrow{display:flex;align-items:center;gap:8px;margin-top:8px}
.dotsrow .dots{margin:0}
/* habilidades */
.skills{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sk{border-radius:18px;padding:10px 12px}
.sk .h{display:flex;align-items:center;gap:6px;font-size:14px}
.sk .h i{font-style:normal;width:26px;height:26px;border-radius:8px;background:var(--c);color:#fff;display:grid;place-items:center;font-weight:900}
.sk .h span{margin-left:auto;font-size:12px;font-weight:800;color:var(--suave)}
.sk .bar{height:10px;border-radius:99px;background:rgba(30,40,90,.1);margin:8px 0 4px;overflow:hidden}
.sk .bar b{display:block;height:100%;border-radius:99px;transition:width .6s}
.sk .lvl{font-size:12.5px;font-weight:800;color:var(--suave)}
/* para qué */
.objetivo.goal{margin-top:10px}
.paraque{display:flex;gap:8px;align-items:flex-start;background:rgba(255,255,255,.7);border-radius:14px;padding:8px 10px;font-size:14px;margin:6px 0 4px}
.paraque img{width:22px;height:22px;flex:none}
/* momentos */
.momnav{position:sticky;top:64px;z-index:20}
.momnav button span b{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--acc);color:#fff;font-size:11px;margin-right:2px}
.momento{scroll-margin-top:130px;margin-top:14px}
.momt{display:flex;align-items:center;gap:10px;margin:4px 2px 8px}
.momt .n{width:30px;height:30px;border-radius:10px;background:var(--acc);color:#fff;display:grid;place-items:center;font-weight:900}
.momt h2{margin:0;font-size:20px;line-height:1.1}
.momt h2 small{display:block;font-size:12px;font-weight:800;color:var(--suave)}
/* tarjetas de actividad */
.acts{display:grid;grid-template-columns:1fr;gap:8px}
.actc{display:grid;grid-template-columns:1fr auto;gap:2px 8px;text-align:left;border:0;border-radius:18px;padding:12px 14px;cursor:pointer;color:inherit;font:inherit}
.actc b{grid-column:1;font-size:16px}
.actc small{grid-column:1;font-size:12.5px;font-weight:800;color:var(--suave)}
.actc .chipk{grid-column:1/3}
.actc .st{grid-column:2;grid-row:2/4;align-self:center;color:#F5B400;font-size:18px;letter-spacing:1px}
.chipk{display:inline-block;justify-self:start;font-size:11.5px;font-weight:900;color:#fff;background:var(--c);border-radius:99px;padding:2px 9px;text-transform:uppercase;letter-spacing:.3px}
/* jugador */
.juego2 .phead{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ptit{margin:8px 0 2px;font-size:22px}
.prog2{display:flex;gap:4px;margin:10px 0}
.prog2 i{flex:1;height:8px;border-radius:99px;background:rgba(30,40,90,.12)}
.prog2 i.cur{background:var(--acc);opacity:.5}
.prog2 i.ok{background:#F5B400}
.prog2 i.auto{background:var(--bien)}
.prog2 i.no{background:#FF9A3D}
.helpbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:14px;padding-top:10px;border-top:2px dashed rgba(30,40,90,.12)}
.helpbar .lb{font-weight:900;font-size:13px;color:var(--suave)}
.helpbar .nota{flex-basis:100%;font-size:12px}
.hbtn{border:2px solid rgba(30,40,90,.15);background:#fff;border-radius:99px;padding:6px 12px;font:inherit;font-weight:800;font-size:13.5px;cursor:pointer;min-height:40px}
.hbtn.used{opacity:.55}
.escucha{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.speaker{width:58px;height:58px;border-radius:50%;border:0;background:var(--L);color:#fff;display:grid;place-items:center;cursor:pointer;flex:none;box-shadow:0 6px 14px rgba(232,69,124,.35)}
.speaker.s{background:var(--S);box-shadow:0 6px 14px rgba(20,167,154,.35)}
.speaker svg{width:28px;height:28px}
.stats{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:10px 0}
.stats span{background:rgba(255,255,255,.75);border-radius:99px;padding:4px 10px;font-weight:800;font-size:13px}
.dilo{display:grid;gap:12px}
.saytext{font-size:22px;font-weight:900;background:#fff;border-radius:16px;padding:12px 14px}
.saytext.tapa{color:transparent;background:repeating-linear-gradient(45deg,#E9ECF7,#E9ECF7 10px,#F4F6FD 10px,#F4F6FD 20px);user-select:none}
.escribe{display:grid;gap:10px}
.hueco.area{width:100%;min-height:120px;resize:vertical;text-align:left;font-size:17px;padding:10px 12px}
.rules{display:grid;gap:6px;margin-top:6px}
.rules div{display:flex;gap:8px;align-items:center;background:rgba(255,255,255,.7);border-radius:12px;padding:6px 10px;font-weight:700;font-size:14px}
.rules i{font-style:normal;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:rgba(30,40,90,.1);font-weight:900;flex:none}
.rules .y i{background:var(--bien);color:#fff}
.rules .n i{background:#FF9A3D;color:#fff}
.chat .msg.pista{background:#FFF6D6;color:#5a4a00;font-size:14px;align-self:center;max-width:100%}
.ctl{display:grid;gap:8px;margin-top:10px}
.fila-chat{display:flex;gap:8px}
.fila-chat .hueco{flex:1;min-width:0;text-align:left}
/* videos */
.vcard{display:flex;gap:12px;align-items:center;border-radius:20px;padding:10px;cursor:pointer;margin-bottom:10px}
.vthumb{position:relative;width:96px;height:150px;border-radius:14px;overflow:hidden;background:#1D2448;flex:none;display:grid;place-items:center}
.vthumb video{width:100%;height:100%;object-fit:cover}
.vthumb img{width:70px}
.vplay{position:absolute;inset:auto auto 50% 50%;transform:translate(-50%,50%);width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.92);display:grid;place-items:center;color:var(--acc)}
.vplay svg{width:22px;height:22px}
.vdur{position:absolute;right:6px;bottom:6px;background:rgba(0,0,0,.6);color:#fff;font-size:11px;font-weight:800;border-radius:6px;padding:1px 5px}
.vcard.encamino .vthumb{background:#E9ECF7}
.vcard.encamino .vdur{position:static;background:none;color:var(--suave);font-size:12px}
.vtxt b{display:block;font-size:17px;line-height:1.2}
.vtxt small{display:block;font-size:13px;font-weight:700;color:var(--suave);margin-top:3px}
.vtxt .visto{color:var(--bien)}
.vinline{margin:10px 0}
.v169{aspect-ratio:16/9;border-radius:16px;overflow:hidden;background:#000}
.v169 video{width:100%;height:100%}
.encamino-h{display:grid;place-items:center;gap:6px;padding:20px;color:var(--suave)}
.encamino-h img{width:80px}
.vplayer{position:fixed;inset:0;z-index:200;background:#0b0f24;display:flex;flex-direction:column;align-items:center;justify-content:center}
.vmarco{position:relative;width:100%;height:calc(100% - 74px);background:#000}
.vmarco video{width:100%;height:100%;object-fit:contain;display:block}
.vctl{height:74px;display:flex;gap:8px;align-items:center;justify-content:center}
.vb{min-width:64px;height:56px;border:0;border-radius:16px;background:rgba(255,255,255,.12);color:#fff;font:inherit;font-weight:900;display:grid;place-items:center;cursor:pointer}
.vb svg{width:20px;height:20px}
.vb small{font-size:10.5px;font-weight:800;opacity:.85}
.vq{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center;padding:14px;background:linear-gradient(180deg,transparent 30%,rgba(0,0,0,.55))}
.vqc{width:100%;max-width:440px;border-radius:20px;padding:14px}
.vqt{display:block;font-size:18px;margin:4px 0 8px}
@media (min-width:760px){
  .vmarco{box-sizing:content-box;width:min(420px,calc((100vh - 150px)*9/16));height:auto;aspect-ratio:9/16;border-radius:34px;border:12px solid #1b1f33;box-shadow:0 0 0 2px #3a3f5a,0 30px 80px rgba(0,0,0,.5);overflow:hidden}
  .vmarco::before{content:'';position:absolute;top:-8px;left:50%;transform:translateX(-50%);width:70px;height:5px;border-radius:99px;background:#3a3f5a;z-index:3}
  .vplayer.horizontal .vmarco{width:min(1100px,92vw);aspect-ratio:16/9;border-radius:18px;border-width:6px}
  .vplayer.horizontal .vmarco::before{display:none}
  .vctl{margin-top:10px}
  .acts{grid-template-columns:1fr 1fr}
}
/* laboratorio */

la de verbos con búsqueda y audio", "titulo": "Verb Bank", "contenido": "Carga el archivo adjunto Banco_de_verbos_400.csv (400 filas). Columnas: base · past · participle · español · tipo (regular/irregular) · familia (1 A A A, 2 A B B, 3 A B C, 4 A B A) · sonido de -ed (/t/, /d/, /ɪd/) · nota (variante británica). Búsqueda por inglés o español, filtro por tipo y por familia. Audio: voz sintética en inglés de Estados Unidos que lee «base, pasado, participio» (son 1,200 palabras: no es práctico grabarlas)."}, {"tipo": "Esquema de ramas", "titulo": "Las 4 familias de verbos rebeldes", "contenido": [["1 · A A A", "Las tres formas iguales", "cut – cut – cut · put – put – put · hit – hit – hit · read – read – read (el pasado suena /rɛd/)"], ["2 · A B B", "Pasado = participio", "buy – bought – bought · have – had – had · make – made – made · find – found – found · sell – sold – sold · teach – taught – taught"], ["3 · A B C", "Las tres distintas", "go – went – gone · see – saw – seen · eat – ate – eaten · take – took – taken · get – got – gotten · speak – spoke – spoken"], ["4 · A B A", "El participio regresa a la base", "come – came – come · become – became – become · run – ran – run"]]}], "actividades": [{"id": "A1", "tipo": "memorama", "titulo": "Base y pasado", "instrucciones": "Encuentra los pares: verbo base y su pasado.", "contenido": [["go", "went"], ["have", "had"], ["make", "made"], ["get", "got"], ["see", "saw"], ["eat", "ate"], ["take", "took"], ["buy", "bought"], ["find", "found"], ["come", "came"], ["put", "put"], ["sell", "sold"]], "nota": ""}], "libreta": "Usa tu banco de verbos impreso (7 páginas) pegado al final de la libreta.", "usos": [{"momento": "después", "sesion": "S4", "minutos": 5, "alumno": "Busca los verbos de tu lista My rebel verbs, escucha su pronunciación y marca su familia.", "docente": "Sin preparación.", "conexion": "Banco de verbos impreso y lista My rebel verbs."}], "entrega": null, "semana": 1}], "primero": [{"id": "E1-01", "titulo_en": "Days of the week", "titulo_es": "Los días de la semana", "grado": "1°", "tarjeta": "1° · Days, Months and Dates", "mes": "Octubre", "semana_cal": 2, "habilita": "Lunes 19 de octubre (apertura de la Encarta)", "modo": "casa", "sesion": "Después de la S1 (repaso; disponible desde el 19 de octubre)", "objetivo": "Digo los 7 días de la semana en orden, con su sílaba fuerte, y cuento qué hago cada día.", "aula": null, "articulo": [["Siete días", "En inglés los días siempre empiezan con mayúscula: Monday, Tuesday… Todos terminan en -day /deɪ/, que significa «día».", ""], ["¿De dónde vienen?", "Sunday es el día del sol (sun) y Monday el de la luna (moon), igual que «lunes». Saturday es el día de Saturno. Thursday es el día de Thor, el dios del trueno.", ""], ["La sílaba fuerte", "La fuerza va siempre al inicio: MON-day, TUES-day, WEDNES-day. Por eso en clase damos la palmada ahí.", ""], ["Ojo con tres", "Wednesday se escribe con d, pero esa d no suena: /ˈwɛnzdeɪ/. Tuesday /ˈtuːzdeɪ/ y Thursday /ˈθɜːrzdeɪ/ no son iguales: Thursday empieza con la lengua entre los dientes.", ""], ["Qué significa cada uno", "Sunday = domingo · Monday = lunes · Tuesday = martes · Wednesday = miércoles · Thursday = jueves · Friday = viernes · Saturday = sábado.", ""], ["Mi semana", "En la página 67 del libro: On Sundays, I spend time with my family. = Los domingos paso tiempo con mi familia. Con la s al final (Sundays) quiere decir «cada domingo».", ""], ["Dato curioso", "En muchos calendarios de Estados Unidos la semana empieza en Sunday, no en Monday. Fíjate la próxima vez que veas un calendario en inglés.", ""]], "recursos": [{"tipo": "imagen", "id": "IMG-E1-01-1", "donde": "Encabezado del artículo", "texto": "Prompt:\n```\nA long colorful toy-like train with seven wagons crossing a small town in central Mexico with a church, hills and nopal cactus; each wagon carries one object: a soccer ball, a fruit stall, a TV, a broom, a notebook, a small house, a sun. Contemporary Latin American edito , "id": "AUD-E1-01-1", "donde": "Al abrir el artículo", "habla": "Profesor Arturo (tu voz)", "texto": "Hola. Aquí practicas los días de la semana. Toca una tarjeta, escucha y repite en voz alta. Después, juega. Let's go!"}, {"tipo": "audio", "id": "AUD-E1-01-D", "donde": "Una por tarjeta de día (7 archivos)", "habla": "Voz sintética en inglés de Estados Unidos, velocidad 0.85", "texto": "El día dos veces y su ejemplo: «Monday. Monday. On Mondays, I do homework.» … «Sunday. Sunday. On Sundays, I play soccer.» Ejemplos completos en las tarjetas."}, {"tipo": "audio", "id": "AUD-E1-01-A", "donde": "Una por tarjeta de actividad (6 archivos)", "habla": "Voz sintética en inglés de Estados Unidos, velocidad 0.85", "texto": "La actividad dos veces y su ejemplo: «play soccer. play soccer. On Saturdays, I play soccer.» Ejemplos completos en las tarjetas."}], "interactivos": [{"tipo": "Tarjetas que se voltean", "titulo": "Los 7 días", "contenido": [{"palabra": "Monday", "afi": "/ˈmʌndeɪ/", "parecido": "«man» de «manta» (a relajada) + «dei» de «deidad»", "ejemplo": "On Mondays, I do homework.", "familia": "", "imagen": "IMG-E1-01-2 (la actividad del ejemplo)", "img": "IMG-E1-01-2-06", "mp3": "AUD-E1-01-D-1"}, {"palabra": "Tuesday", "afi": "/ˈtuːzdeɪ/", "parecido": "«tus» de «tus libros», con la s que zumba como abeja + «dei»", "ejemplo": "On Tuesdays, I help at home.", "familia": "", "imagen": "IMG-E1-01-2 (la actividad del ejemplo)", "img": "IMG-E1-01-2-05", "mp3": "AUD-E1-01-D-2"}, {"palabra": "Wednesday", "afi": "/ˈwɛnzdeɪ/", "parecido": "«güens» de «güero» + «dei»; la primera d no suena", "ejemplo": "On Wednesdays, I visit grandma.", "familia": "", "imagen": "IMG-E1-01-2 (la actividad del ejemplo)", "img": "IMG-E1-01-2-03", "mp3": "AUD-E1-01-D-3"}, {"palabra": "Thursday", "afi": "/ˈθɜːrzdeɪ/", "parecido": "z de España (lengua entre los dientes) + «ers» de «versos» con la lengua hacia atrás + «dei»", "ejemplo": "On Thursdays, I watch TV.", "familia": "", "imagen": "IMG-E1-01-  go to school from Monday to Friday.", ""], ["Hasta: until", "Until + día = hasta ese día; algo que dura y ahí termina: We have classes until Friday.", ""], ["Ojo con until", "Until va con algo que dura (have classes, stay). Para una actividad que haces varios días seguidos usa from… to: I wash clothes from Thursday to Saturday.", ""], ["Nuestra comunidad", "En muchas casas el agua llega ciertos días, las tortillas se compran casi diario y el tianguis es un día fijo. Todo eso se dice con on, from… to y until.", ""], ["Tu ID", "Tu ID Card «My Week ID» tiene cuatro rutinas. Practica decirla en voz alta: la vas a presentar sin leer.", ""]], "recursos": [{"tipo": "imagen", "id": "IMG-E1-02-1", "donde": "Encabezado del artículo", "texto": "Prompt:\n```\nA sunny street in a small town in central Mexico: a water truck filling blue drums in front of a house, a tortilla shop with warm steam, a market stall and a church tower in the back; a long seven-day calendar strip painted on a wall. Contemporary Latin American editorial illustration for a children's magazine, made by a professional illustrator: hand-painted digital gouache look with visible brush strokes, dry-brush and fine grain textures and a subtle paper texture; bold saturated palette of vermilion orange, marigold yellow, deep teal green and emerald, with small touches of pink and cream; lush stylized leaves and flowers framing the scene; characters built from simple rounded shapes, rosy cheeks, small dot eyes and expressive gestures; flat layered composition. Avoid glossy 3D render, airbrushed gradients, photorealism, generic clip art and plastic shine. No text, no letters, no numbers, no logos. Framing: horizontal 16:9.\n```"}, {"tipo": "imagen", "id": "IMG-E1-02-2", "donde": "Imagen de cada tarjeta de actividad (recorta en 10)", "texto": "Prompt:\n```\nSet of ten square icons in a 5 by 2 grid, same style and size: blue water drums filling from a hose; a stack of tortillas in a cloth; a basket with vegetables; a small corner shop; clothes being washed in a stone sink with bubbles; a trash bag next to a bin; a broom; a small house with a heart; a school backpack; a town plaza kiosk. Contemporary Latin American editorial illustration for a children's magazine, made by a professional illustrator: hand-painted digital gouache look with visible brush strokes, dry-brush and fine grain textures and a subtle paper texture; bold saturated palette of vermilion orange, marigold yellow, deep teal green and emerald, with small touches of pink and cream; lush stylized leaves and flowers framing the scene; characters built from simple rounded shapes, rosy cheeks, small dot eyes and expressive gestures; flat layered composition. Avoid glossy 3D render, airbrushed gradients, photorealism, generic clip art and plastic shine. No text, no letters, no numbers, no logos. Framing: cuadrado 1:1, cuadrícula de 5 × 2 íconos iguales.\n```"}, {"tipo": "audio", "id": "AUD-E1-02-T", "donde": "Una por tarjeta (10 archivos)", "habla": "Voz sintética en inglés de Estados Unidos, velocidad 0.85", "texto": "La actividad dos veces y su ejemplo: «get water. get water. We get water on Tuesdays.» … Ejemplos completos en las tarjetas."}, {"tipo": "audio", "id": "AUD-E1-02-L", "donde": "Al soltar cada tarjeta en la línea", "habla": "Voz sintética en inglés de Estados Unidos, velocidad 0.85", "texto": "La oración completa que formó el alumno, por ejemplo: «I go to school from Monday to Friday.»"}], "interactivos": [{"tipo": "Tarjetas que se voltean", "titulo": "Actividades de mi comunidad", "contenido": [{"palabra": "get water", "afi": "/ɡɛt ˈwɑːtər/", "parecido": "«gue» de «guerra» + t · «gua» de «guante» + «ter» de «terco» sin vibrar", "ejemplo": "We get water on Tuesdays.", "familia": "", "imagen": "IMG-E1-02-2 · gota de agua y tambos azules", "img": "IMG-E1-02-2-01", "mp3": "AUD-E1-02-T-1"}, {"palabra": "get tortillas", "afi": "/ɡɛt tɔːrˈtiːjəz/", "parecido": "«gue» + t · «tor» de «torta» + «ti» de «tila» + «yas ernes ✓", "solo el lunes", "hasta el lunes"]], ["audio: We have classes until Friday.", ["hasta el viernes ✓", "solo el viernes", "desde el viernes"]], ["audio: I wash clothes from Thursday to Saturday.", ["jueves, viernes y sábado ✓", "solo el jueves", "solo el sábado"]], ["audio: We get water on Tuesdays.", ["cada martes ✓", "de martes a jueves", "hasta el martes"]]], "nota": "Si falla: «on = un día · from… to = de un día a otro · until = hasta ese día»."}, {"id": "A2", "tipo": "relacionar", "titulo": "¿Qué haces?", "instrucciones": "Une cada actividad con su significado.", "contenido": [["get water", "recibir o juntar el agua"], ["get tortillas", "ir por las tortillas"], ["go to the market", "ir al mercado o al tianguis"], ["go to the store", "ir a la tienda"], ["wash clothes", "lavar la ropa"], ["take out the trash", "sacar la basura"], ["clean the house", "limpiar la casa"], ["visit family", "visitar a la familia"], ["go to school", "ir a la escuela"], ["go to the plaza", "ir a la plaza"]], "nota": ""}, {"id": "A3", "tipo": "completar espacios", "titulo": "on, from, to, until", "instrucciones": "Escribe la palabra que falta.", "contenido": [["I go to the market ___ Sundays.", "on", ""], ["I go to school ___ Monday to Friday.", "from", ""], ["I go to school from Monday ___ Friday.", "to", ""], ["We have classes ___ Friday.", "until", ""], ["We get water ___ Tuesdays.", "on", ""], ["I wash clothes from Thursday ___ Saturday.", "to", ""]], "nota": "Banco visible: on · from · to · until."}, {"id": "A4", "tipo": "ordenar", "titulo": "Arma la oración", "instrucciones": "Ordena las palabras.", "contenido": {"series": [["I", "go to school", "from", "Monday", "to", "Friday", "."], ["We", "get water", "on", "Tuesdays", "."], ["We", "have classes", "until", "Friday", "."], ["I", "visit my family", "on", "Sundays", "."]]}, "nota": "Si falla: «Primero quién (I, We), luego qué hace, al final cuándo»."}], "libreta": "Escribe tu semana en 7 renglones (día – actividad) y dos oraciones: una con on y otra con from… to.", "usos": [{"momento": "después", "sesion": "S2", "minutos": 8, "alumno": "Voltea las 10 tarjetas repitiendo en voz alta, arma tu semana en la línea y juega A1 a A4.", "docente": "En la primera clase después del 19 de octubre revisa en MyClass el reactivo más fallado de A1 y repítelo en la recuperación.", "conexion": "ID Card «My Week ID» de la S2."}], "entrega": null, "semana": 1}, {"id": "E1-03", "titulo_en": "My Week ID", "titulo_es": "Mi ID de la semana", "grado": "1°", "tarjeta": "1° · Days, Months and Dates", "mes": "Octubre", "semana_cal": 2, "habilita": "Lunes 19 de octubre (apertura de la Encarta)", "modo": "casa", "sesion": "Después de la S3 (práctica; disponible desde el 19 de octubre)", "objetivo": "Presento mi semana sin leer y entiendo la semana de otra persona cuando la escucho.", "aula": null, "articulo": [["Presentar sin leer", "Tres trucos: 1) respira contando 4 y suelta contando 4; 2) mira a tu público, no tu tarjeta; 3) si te trabas, mira tu ID una sola vez y sigue.", ""], ["El marco", "Hello! My name is ___. I am ___ years old. I live in ___. Después, tus cuatro rutinas. Al final: Thank you!", ""], ["Escuchar con una tarea", "Cuando escuchas, pega o dibuja la actividad en el día que oíste. Así no se te olvida.", ""], ["Hablar de otra persona", "Con he, she o el nombre, el verbo lleva s: Giancarlo visits his family on Sundays. Lupita gets water on Tuesdays. Si termina en sh, ch u o, lleva es: washes, goes.", ""], ["Tu privacidad", "Nadie tiene que decir lo que no quiere: puedes elegir otra actividad o cambiar el día.", ""]], "recursos": [{"tipo": "imagen", "id": "IMG-E1-03-1", "donde": "Encabezado del artículo", "texto": "Prompt:\n```\nA school patio in central Mexico: a girl presenting to classmates sitting in a half circle, she holds a small colorful card; classmates listen and place stickers on a big seven-column paper calendar. Mexican public secondary school students aged 12 to 13 in school uniforms, diverse and respectful, non-stereotyped. Contemporary Latin American editorial illustration for a children's magazine, made by a professional illustrator: hand-painted digital gouache look with visible brush strokes, dry-brush and fine grain textures and a subtle paper texture; bold saturated palette of vermilion orange, marigold yellow, deep teal green and emerald, with small touches of pink and cream; lush stylized leaves and flowers framing the scene; characters built from simple rounded shapes, rosy cheeks, small dot eyes and expressive gestures; flat layered composition. Avoid glossy 3D render, airbrushed gradients, photorealism, generic clip art and plastic shine. No text, no letters, no numbers, no logos. Framing: horizontal 16:9.\n```"}, {"tipo": "imagen", "id": "IMG-E1-03-2", "donde": "Avatares (dos círculos)", "texto": "Prompt:\n```\nTwo friendly illustrated bust portraits side by side: a girl with two black braids (Lupita) and a boy with short hair and round glasses (Beto), both smiling, green school uniform. Mexican public secondary school students aged 12 to 13 in school uniforms, diverse and respectful, non-stereotyped. Contemporary Latin American editorial illustration for a children's magazine, made by a professional illustrator: hand-painted digital gouache look with visible brush strokes, dry-brush and fine grain textures and a subtle paper texture; bold saturated palette of vermilion orange, marigold yellow, deep teal green and emerald, with small touches of pink and cream; lush stylized leaves and flowers framing the scene; characters built from simple rounded shapes, rosy cheeks, small dot eyes and expressive gestures; flat layered composition. Avoid glossy 3D render, airbrushed gradients, photorealism, generic clip art and plastic shine. No text, no letters, no numbers, no logos. Framing: cuadrado 1:1, dos retratos de busto lado a lado.\n```"}, {"tipo": "audio", "id": "AUD-E1-03-L", "donde": "ID de Lupita", "habla": "Voz femenina juvenil (sintética)", "texto": "Hello! My name is Lupita. I am 12 years old. I live in San Juan Zitlaltepec. We get water on Tuesdays. I go to get tortillas on Saturdays. I go to the market on Sundays. I help at home from Monday to Friday. Thank you!"}, {"tipo": "audio", "id": "AUD-E1-03-B", "donde": "ID de Beto", "habla": "Voz masculina juvenil (sintética)", "texto": "Hello! My name is Beto. I am 13 years old. I live in San Juan Zitlaltepec. I wash clothes on Saturdays. I take out the trash on Mondays. I go to the store on Fridays. I help my family from Saturday to Sunday. Thank you!"}], "interactivos": [{"tipo": "ID animada", "titulo": "Lupita's Week ID", "contenido": {"campos": {"personaje": "Lupita (IMG-E1-03-2, izquierda)", "lineas": "Hello! My name is Lupita. · I am 12 years old. I live in San Juan Zitlaltepec. · We get water on Tuesdays. · I go to get tortillas on Saturdays. · I go to the market on Sundays. · I help at home from Monday to Friday. · Thank you!", "audio": "AUD-E1-03-L", "funcionamiento": "Cada línea aparece con su audio; al final, el botón «Ahora tú» oculta el texto para que el alumno diga su propia ID en voz alta."}, "tablas": [], "lineas": null}}, {"tipo": "Calendario para escuchar", "titulo": "Beto's week", "contenido": {"campos": {"lineas": "Hello! My name is Beto. · I am 13 years old. I live in San Juan Zitlaltepec. · I wash clothes on Saturdays. · I take out the trash on Mondays. · I go to the store on Fridays. · I help my family from Saturday to Sunday. · Thank you!", "audio": "AUD-E1-03-B", "funcionamiento": "Mientras suena la ID de Beto, el alumno arrastra los íconos de IMG-E1-02-2 al día que oye. Al terminar se muestra la respuesta."}, "tablas": [], "lineas": null}}], "actividades": [{"id": "A1", "tipo": "escuchar y elegir", "titulo": "Lupita's week", "instrucciones": "Escucha la ID de Lupita y elige.", "contenido": [["¿Qué día llega el agua a casa de Lupita?", ["Tuesday ✓", "Thursday", "Sunday"]], ["¿Qué día va por las tortillas?", ["Saturday ✓", "Sunday", "Monday"]], ["¿Qué días ayuda en casa?", ["from Monday to Friday ✓", "on Mondays", "until Friday"]], ["¿Cuántos años tiene?", ["12 ✓", "13", "11"]]], "nota": "", "audios": [{"id": "AUD-E1-03-L", "texto": "", "etiqueta": "Escuchar a Lupita"}]}, {"id": "A2", "tipo": "opción múltiple", "titulo": "He or she: + s", "instrucciones": "Elige la forma correcta.", "contenido": [["Lupita ___ water on Tuesdays.", ["gets ✓", "get", "getting"]], ["Beto ___ clothes on Saturdays.", ["washes ✓", "wash", "washs"]], ["Giancarlo ___ his family on Sundays.", ["visits ✓", "visit", "visiting"]], ["She ___ to school from Monday to Friday.", ["goes ✓", "go", "gos"]]], "nota": "Si falla: «Con he, she o un nombre, el verbo lleva s; con sh, ch u o, lleva es»."}, {"id": "A3", "tipo": "ordenar", "titulo": "Mi presentación", "instrucciones": "Ordena la presentación.", "contenido": {"series": [["Hello! My name is Lupita.", "I am 12 years old. I live in San Juan Zitlaltepec.", "We get water on Tuesdays.", "Thank you!"]]}, "nota": "Primero el saludo y el nombre; al final, Thank you!"}], "libreta": "Escribe tu ID en la libreta (si no tienes la tarjeta) y dos oraciones sobre la semana de Beto con he: Beto washes clothes on Saturdays.", "usos": [{"momento": "después", "sesion": "S3", "minutos": 8, "alumno": "Escucha las ID de Lupita y Beto, llena el calendario de Beto y juega A1 a A3. Practica tu ID con «Ahora tú».", "docente": "En la primera clase después del 19 de octubre pide a dos alumnos que digan su ID sin leer.", "conexion": "ID Card y oraciones de la S3."}], "entrega": null, "semana": 1}, {"id": "E1-04", "titulo_en": "Months, the moon and a rhyme", "titulo_es": "Los meses, la luna y una rima", "grado": "1°", "tarjeta": "1° · Days, Months and Dates", "mes": "Octubre", "semana_cal": 2, "habilita": "Lunes 19 de octubre", "modo": "casa", "sesion": "Antes de la S4 (avance: los meses) y después de la S5 (práctica: la rima)", "objetivo": "Digo los 12 meses en orden y descubro cómo una rima me ayuda a recordar cuántos días tiene cada mes.", "aula": null, "articulo": [["Doce meses", "Los meses también empiezan con mayúscula: January, February… En clase los cantamos de tres en tres.", "avance"], ["La luna hace el mes", "Una vuelta de la luna dura unas cuatro semanas: one week, two weeks, three weeks, four weeks = one month. La palabra month viene de moon. Luna llena = full moon; luna nueva = new moon.", "avance"], ["Mi diario de la luna", "Dibuja la luna cada noche de esta semana en tu tira de siete días. The full moon is on Sunday, October 25th.", "avance"], ["Nombres con historia", "July lleva el nombre de Julio César y August el de Augusto, dos gobernantes de Roma. September viene de septem, «siete», porque el antiguo calendario romano empezaba en marzo.", "avance"], ["Una rima de hace siglos", "Thirty Days Has September es una rima tradicional para recordar cuántos días tiene cada mes. Escúchala: ¿qué meses oyes?", "avance"], ["June y July", "Se confunden mucho. June /dʒuːn/ tiene una sílaba. July /dʒʊˈlaɪ/ tiene dos y la fuerza al final: ju-LY.", "repaso"], ["La rima se oye", "September y November riman: terminan con el mismo sonido, /-ɛmbər/. Clear y year también riman. One y alone se escriben parecido, pero no riman: la rima se oye, no se ve.", "repaso"], ["Los números de la rima", "twenty-eight (28) · twenty-nine (29) · thirty (30) · thirty-one (31). Leap year = año bisiesto: febrero tiene 29 días. El próximo es 2028.", "repaso"]], "recursos": [{"tipo": "imagen", "id": "IMG-E1-04-1", "donde": "Rueda del año (diagrama tocable)", "texto": "Prompt:\n```\nA round wheel of the year divided into 12 equal colored sectors, each with one small seasonal scene from central Mexico: a crown and rosca bread, carnival masks, purple jacaranda flowers, children with balloons, a bouquet of flowers, a father and child, a beach ball, a summer sun, a Mexican flag, a village church festival with fireworks, marigold flowers and candles, a piñata. Contemporary Latin American editorial illustration for a children's magazine, made by a professional illustrator: hand-painted digital gouache look with visible brush strokes, dry-brush and fine grain textures and a subtle paper texture; bold saturated palette of vermilion orange, marigold yellow, deep teal green and emerald, with small touches of pink and cream; lush stylized leaves and flowers framing the scene; characters built from simple rounded shapes, rosy cheeks, small dot eyes and expressive gestures; flat layered composition. Avoid glossy 3D render, airbrushed gradients, photorealism, generic clip art and plastic shine. No text, no letters, no numbers, no logos. Framing: cuadrado 1:1, rueda centrada con 12 sectores iguales.\n```"}, {"tipo": "imagen", "id": "IMG-E1-04-2", "donde": "Ícono de cada tarjeta de mes (recorta en 12)", "texto": "Prompt:\n```\nSet of twelve simple square icons in a 4 by 3 grid, same size and style: a golden crown; a carnival mask; a purple jacaranda flower; a balloon; a flower bouquet; a necktie; a beach ball; a summer sun; a Mexican flag; a village church with fireworks; a marigold flower with a candle; a star piñata. Contemporary Latin American editorial illustration for a children's magazine, made by a professional illustrator: hand-painted digital gouache look with visible brush strokes, dry-brush and fine grain textures and a subtle paper texture; bold saturated palette of vermilion orange, marigold yellow, deep teal green and emerald, with small touches of pink and cream; lush stylized leaves and flowers framing the scene; characters built from simple rounded shapes, rosy cheeks, small dot eyes and expressive gestures; flat layered composition. Avoid glossy 3D render, airbrushed gradients, photorealism, generic clip art and plastic shine. No text, no letters, no numbers, no logos. Framing: cuadrado 1:1, cuadrícula de 4 × 3 íconos.\n```"}, {"tipo": "audio", "id": "AUD-E1-04-C", "donde": "Bloque «Doce meses»", "habla": "Profesor Arturo (tu voz)", "texto": "Canto de tres en tres con palmadas: January, February, March · April, May, June · July, August, September · October, November, December."}, {"tipo": "audio", "id": "AUD-E1-04-R", "donde": "Tarjeta de la rima", "habla": "Profesor Arturo (tu voz)", "texto": "La rima completa, dos veces, marcando el ritmo con palmadas: Thirty days has September, April, June, and November. All the rest have thirty-one, Except February alone, Which has twenty-eight days clear, And twenty-nine in each leap year."}, {"tipo": "audio", "id": "AUD-E1-04-M", "donde": "Una por tarjeta de mes (12 archivos)", "habla": "Voz sintética en inglés de Estados Unidos, velocidad 0.85", "texto": "El mes dos veces: «January. January.» … «December. December.»"}], "interactivos": [{"tipo": "Tarjetas que se voltean", "titulo": "Los 12 meses", "contenido": [{"palabra": "January", "afi": "/ˈdʒænjuˌɛri/", "parecido": "«yan» con y fuerte, como en «inyección» + «iu» de «ciudad» + «eri»", "ejemplo": "January · Three Kings Day (Día de Reyes)", "familia": "", "imagen": "IMG-E1-04-2 · ícono 1", "img": "IMG-E1-04-2-01", "mp3": "AUD-E1-04-M-1"}, {"palabra": "February", "afi": "/ˈfɛbruˌɛri/", "parecido": "«fe» de «feo» + «bru» de «bruja» + «e» + «ri» de «rico»; también se oye /ˈfɛbjuˌɛri/, sin la r: las dos están bien", "ejemplo": "February · carnival (carnaval; a veces es en marzo)", "familia": "", "imagen": "IMG-E1-04-2 · ícono 2", "img": "IMG-E1-04-2-02", "mp3": "AUD-E1-04-M-2"}, {"palabra": "March", "afi": "/mɑːrtʃ/", "parecido": "«march» de «marcha», sin la a final", "ejemplo": "March · spring (primavera) y el natalicio de Benito Juárez", "familia": "", "imagen": "IMG-E1-04-2 · ícono 3", "img": "IMG-E1-04-2-03", "mp3": "AUD-E1-04-M-3"}, {"palabra": "April", "afi": "/ˈeɪprəl/", "parecido": "«ei» de «reina» + «prol» de «prole»", "ejemplo": "April · Children's Day (Día del Niño, April 30th)", "familia": "", "imagen": "IMG-E1-04-2 · ícono 4", "img": "IMG-E1-04-2-04", "mp3": "AUD-E1-04-M-4"}, {"palabra": "May", "af nt dates in my community", "titulo_es": "Fechas importantes de mi comunidad", "grado": "1°", "tarjeta": "1° · Days, Months and Dates", "mes": "Octubre", "semana_cal": 3, "habilita": "Sábado 24 de octubre", "modo": "ambas", "sesion": "Durante la S8 (aula de cómputo) y después (práctica)", "objetivo": "Sé de qué trata un texto (skimming) y encuentro sus fechas (scanning) para elegir las fiestas de nuestro almanaque.", "aula": "S8 de 1°: primeros 14 minutos (llegan directo al aula; 2 de entrada, 10 de trabajo, 2 de regreso)", "articulo": [["Fechas de mi comunidad", "San Juan Zitlaltepec está en Zumpango, Estado de México. Aquí celebramos muchas fechas. Lee el texto de la clase.", ""], ["Important Dates in San Juan Zitlaltepec", "San Juan Zitlaltepec is in Zumpango, Estado de México. People here celebrate many dates. In September, we celebrate Independence Day on September 16th. In October, there is the Santo Jubileo. In November, families remember their loved ones on Day of the Dead, November 2nd. In December, we celebrate Christmas on December 25th. In the United States, many people celebrate Halloween on October 31st. · Glosario: celebrate = celebrar · remember = recordar · loved ones = seres queridos.", ""], ["Skimming", "Antes de leer todo, mira rápido el título y las primeras líneas: ¿de qué trata? Eso es skimming /ˈskɪmɪŋ/, el segundo rayo del faro.", ""], ["¿Skimming o scanning?", "Skimming: miras todo rápido para saber de qué trata. Scanning: buscas un dato. Elige según tu pregunta.", "repaso"], ["Dos fiestas distintas", "Halloween es una fiesta de Estados Unidos (October 31st). Day of the Dead es nuestra (November 2nd): recordamos a nuestros seres queridos. Están cerca en el calendario, pero no son lo mismo.", "repaso"], ["¿Quién decide?", "El Santo Jubileo o el carnaval no aparecen en el calendario escolar, pero son importantes para la comunidad. En nuestro almanaque sí van.", "repaso"]], "recursos": [{"tipo": "imagen", "id": "IMG-E1-07-1", "donde": "Encabeza pleta, on.", "repaso"], ["Así te evalúan", "Revisa la última hoja de tu libreta: ahí está lo que dictó el profesor en la S9.", "repaso"]], "recursos": [{"tipo": "imagen", "id": "IMG-E1-08-1", "donde": "Base del diagrama (las etiquetas se ponen con HTML encima)", "texto": "Prompt:\n```\nA handmade almanac page lying on a school desk: an empty title band at the top, a list area with tiny birthday cake icons, a drawing of a village church festival, a glued magazine cutout, a small framed box at the bottom; colored pencils beside the page; no writing on the page. Contemporary Latin American editorial illustration for a children's magazine, made by a professional illustrator: hand-painted digital gouache look with visible brush strokes, dry-brush and fine grain textures and a subtle paper texture; bold saturated palette of vermilion orange, marigold yellow, deep teal green and emerald, with small touches of pink and cream; lush stylized leaves and flowers framing the scene; characters built from simple rounded shapes, rosy cheeks, small dot eyes and expressive gestures; flat layered composition. Avoid glossy 3D render, airbrushed gradients, photorealism, generic clip art and plastic shine. No text, no letters, no numbers, no logos. Framing: vertical 3:4.\n```"}, {"tipo": "imagen", "id": "IMG-E1-08-2", "donde": "Ícono de cada rol (recorta en 4)", "texto": "Prompt:\n```\nFour simple round icons in a 2 by 2 grid: a pencil writing; a paintbrush; a magnifying glass with a check mark; a microphone. Contemporary Latin American editorial illustration for a children's magazine, made by a professional illustrator: hand-painted digital gouache look with visible brush strokes, dry-brush and fine grain textures and a subtle paper texture; bold saturated palette of vermilion orange, marigold yellow, deep teal green and emerald, with small touches of pink and cream; lush stylized leaves and flowers framing the scene; characters built from simple rounded shapes, rosy cheeks, small dot eyes and expressive gestures; flat layered composition. Avoid glossy 3D render, airbrushed gradients, photorealism, generic clip art and plastic shine. No text, no letters, no numbers, no logos. Framing: cuadrado 1:1, cuadrícula de 2 × 2.\n```"}, {"tipo": "audio", "id": "AUD-E1-08-1", "donde": "Parte 5 del diagrama", "habla": "Voz sintética en inglés de Estados Unidos, velocidad 0.85", "texto": "October. October. Noun."}], "interactivos": [{"tipo": "Diagrama con partes tocables", "titulo": "Una página del almanaque: October", "contenido": {"imagen": "IMG-E1-08-1", "partes": [["1 · Month name", "October", "Escrito correcto y con mayúscula."], ["2 · Birthdays", "Ana – October 14th · Luis – October 3rd · Sofía – October 22nd", "Fecha completa con terminación."], ["3 · Community date", "The Santo Jubileo is in October.", "Una fecha de la comunidad con su oración."], ["4 · Picture", "Dibujo a lápiz o recorte de tu Muy Interesante Junior", "Explica la fecha; no se califica qué tan bonita es."], ["5 · Glossary word", "October /ɑːkˈtoʊbər/ — noun", "Una palabra con su pronunciación y su categoría."]]}}, {"tipo": "Encuesta del grupo", "titulo": "¿Qué rol te gustaría en tu equipo?", "contenido": {"opciones": ["Writer", "Artist", "Checker", "Speaker"], "muestra": "Barras del grupo; ayuda a equilibrar los roles en la S9."}}], "actividades": [{"id": "A1", "tipo": "relacionar", "titulo": "Los roles", "instrucciones": "Une cada rol con su tarea.", "contenido": [["Writer", "escribe las fechas"], ["Artist", "ilustra la página"], ["Checker", "revisa con la lista"], ["Speaker", "organiza la presentación"]], "nota": ""}, {"id": "A2", "tipo": "opción múltiple", "titulo": "Nuestro almanaque", "instrucciones": "Elige la respuesta correcta.", "contenido": [["¿Qué es un almanaque?", ["Un libro o calendario con fechas y datos importantes del año ✓", "Un diccionario", "Una revista de deportes"]], ["When is your birthday?", ["My birthday is on October 14th. ✓", "My birthday is in October 14th." e sentence. · The picture explains the date.", "repaso"], ["Los errores más comunes", "October 22th → 22nd · in Monday → on Monday · november → November · Wensday → Wednesday.", "repaso"], ["Fuentes", "Si usaste una fecha de tu revista Muy Interesante Junior, escribe la fuente: número y página.", "repaso"], ["Entrega", "El Checker de cada equipo sube una foto de la página terminada.", "repaso"]], "recursos": [{"tipo": "imagen", "id": "IMG-E1-09-1", "donde": "Viñetas del cómic (4 imágenes del mismo estilo)", "texto": "Prompt:\n```\nFour-panel comic, same two characters in every panel (a girl with a ponytail holding a big magnifying glass, and a boy with short hair), in a classroom. Panel 1: the girl examines a paper page with the magnifying glass. Panel 2: the boy counts on his fingers, thinking. Panel 3: the girl points at a line on the page, the boy raises a finger. Panel 4: a team of four students holds up the finished page, smiling. Leave empty white space at the top of each panel for speech bubbles. Mexican public secondary school students aged 12 to 13 in school uniforms, diverse and respectful, non-stereotyped. Contemporary Latin American editorial illustration for a children's magazine, made by a professional illustrator: hand-painted digital gouache look with visible brush strokes, dry-brush and fine grain textures and a subtle paper texture; bold saturated palette of vermilion orange, marigold yellow, deep teal green and emerald, with small touches of pink and cream; lush stylized leaves and flowers framing the scene; characters built from simple rounded shapes, rosy cheeks, small dot eyes and expressive gestures; flat layered composition. Avoid glossy 3D render, airbrushed gradients, photorealism, generic clip art and plastic shine. No text, no letters, no numbers, no logos. Framing: cuadrado 1:1 cada viñeta; mantener los mismos personajes.\n```"}, {"tipo": "audio", "id": "AUD-E1-09-C", "donde": "Un audio por globo (4 archivos)", "habla": "Carla: Voz sintética en inglés de EE. UU., femenina juvenil · Beto: Voz sintética en inglés de EE. UU., masculina juvenil", "texto": "Carla: Check the date! October 22th? / Beto: 22… it ends in 2: nd! October 22nd! / Carla: My birthday is in Monday? / Beto: On Monday! / Team: Our page is ready!"}], "interactivos": [{"tipo": "Cómic", "titulo": "Checker Carla", "contenido": {"vinetas": [["1", "Carla, con una lupa, mira una página del almanaque.", "Carla: Check the date! October 22th?", "Carla es la Checker de su equipo."], ["2", "Beto cuenta con los dedos.", "Beto: 22… it ends in 2: nd! October 22nd!", "22 termina en 2: nd."], ["3", "Carla señala otra línea.", "Carla: My birthday is in Monday? / Beto: On Monday!", "Con días va on."], ["4", "Todo el equipo levanta la página, contento.", "Team: Our page is ready!", "ready = lista. Revisar con criterios te ayuda a encontrar tus propios errores."]]}}, {"tipo": "Infografía", "titulo": "Los 4 criterios", "contenido": [["1", "Month name", "Bien escrito y con mayúscula."], ["2", "st, nd, rd, th", "Cada fecha con su terminación."], ["3", "Community date", "Con su oración."], ["4", "Picture", "Explica la fecha."]], "parte": "repaso"}], "actividades": [{"id": "A1", "tipo": "opción múltiple", "titulo": "Fix the Date", "instrucciones": "Cada fecha tiene un error. Elige la corrección.", "contenido": [["October 22th", ["October 22nd ✓", "October 22st"]], ["My birthday is in Monday.", ["on Monday ✓", "at Monday"]], ["Wensday", ["Wednesday ✓", "Wendsday"]], ["november 2nd", ["November 2nd ✓", "novembre 2nd"]], ["Christmas is on December.", ["in December ✓", "at December"]], ["February 30th", ["No existe: February tiene 28 o 29 días ✓", "February 30rd"]], ["September 31st", ["No existe: September tiene 30 días ✓", "September 31th"]], ["October 1th", ["October 1st ✓", "October 1nd"]], ["March 3th", ["March 3rd ✓", "March 3nd"]], ["the 11st", ["the 11th ✓", "the 11nd"]], ["On Saturday's, I play soccer.", ["On Saturdays ✓", "On Saturday"]], ["Thursady",
