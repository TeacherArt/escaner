spués de la S2", "objetivo": "Pronuncio el pasado regular con su sonido correcto (/t/, /d/ o /ɪd/) y digo cuándo pasó algo.", "aula": null, "articulo": [["Tres sonidos", "-ed no siempre suena igual: /t/ walked, /d/ played, /ɪd/ visited.", ""], ["/ɪd/: una sílaba más", "Solo cuando el verbo termina en t o d: visit → visi-ted, decide → deci-ded.", ""], ["¿/t/ o /d/?", "Pon la mano en tu garganta y di el final del verbo. Si no vibra (p, k, s, ch, sh, f), -ed suena /t/: walked. Si vibra (vocales, l, n, m, g, b, v), suena /d/: played.", ""], ["Los gestos de clase", "/t/ chasquido · /d/ zumbido de abeja · /ɪd/ dos palmadas.", ""], ["¿Cuándo pasó? (libro p. 40)", "yesterday · last + día, mes o año (last Sunday, last month) · tiempo + ago (two days ago) · in + año (in 2020).", ""]], "recursos": [{"tipo": "imagen", "id": "IMG-E2-02-1", "donde": "Base del diagrama", "texto": "Prompt:\n```\nThree colorful doors side by side in a school hallway: the first with a big pair of snapping fingers painted on it, the second with a friendly bee, the third with two clapping hands; each door slightly open with light coming out. Contemporary Latin American editorial illustration for a children's magazine, made by a professional illustrator: hand-painted digital gouache look with visible brush strokes, dry-brush and fine grain textures and a subtle paper texture; bold saturated palette of vermilion orange, marigold yellow, deep teal green and emerald, with small touches of pink and cream; lush stylized leaves and flowers framing the scene; characters built from simple rounded shapes, rosy cheeks, small dot eyes and expressive gestures; flat layered composition. Avoid glossy 3D render, airbrushed gradients, photorealism, generic clip art and plastic shine. No text, no letters, no numbers, no logos. Framing: horizontal 16:9.\n```"}, {"tipo": "audio", "id": "AUD-E2-02-V", "donde": "Una por tarjeta (12 archivos)", "habla": "Voz sintética en inglés de Estados Unidos, velocidad 0.85", "texto": "El verbo dos veces y su ejemplo: «walked. walked. I walked to school.» … Lista completa en las tarjetas."}, {"tipo": "video", "id": "VID-E2-02-1", "donde": "Debajo del bloque «Los gestos de clase»", "texto": "Qué muestra: Te grabas diciendo walked, played y visited con su gesto (chasquido, zumbido, dos palmadas) y la mano en la garganta para mostrar la vibración."}], "interactivos": [{"tipo": "Tarjetas que se voltean", "titulo": "12 verbos y su sonido", "contenido": [{"palabra": "walked · /t/", "afi": "/wɔːkt/", "parecido": "«guo» de «guapo» sin la g, con o abierta + kt; la l no suena y no hay sílaba extra", "ejemplo": "I walked to school.", "familia": "", "imagen": null, "mp3": "AUD-E2-02-V-1"}, {"palabra": "watched · /t/", "afi": "/wɑːtʃt/", "parecido": "«guach» de «guacho» sin la g + t", "ejemplo": "I watched a movie.", "familia": "", "imagen": null, "mp3": "AUD-E2-02-V-2"}, {"palabra": "helped · /t/", "afi": "/hɛlpt/", "parecido": "«gel» de «gel» (j suave, solo aire) + pt", "ejemplo": "I helped my mom.", "familia": "", "imagen": null, "mp3": "AUD-E2-02-V-3"}, {"palabra": "danced · /t/", "afi": "/dænst/", "parecido": "«dans» de «danza» con la a muy abierta + t", "ejemplo": "We danced at the party.", "familia": "", "imagen": null, "mp3": "AUD-E2-02-V-4"}, {"palabra": "played · /d/", "afi": "/pleɪd/", "parecido": "«ple» de «pleno» + i + d suave (rima con «rey»)", "ejemplo": "I played soccer.", "familia": "", "imagen": null, "mp3": "AUD-E2-02-V-5"}, {"palabra": "cleaned · /d/", "afi": "/kliːnd/", "parecido": "«clín» de «clínica» con i larga + d", "ejemplo": "I cleaned my room.", "familia": "", "imagen": null, "mp3": "AUD-E2-02-V-6"}, {"palabra": "listened · /d/", "afi": "/ˈlɪsənd/", "parecido": "«li» de «libro» + «send» de «sendero»; la t no suena", "ejemplo": "I listened to music.", "familia": "", "imagen": null, "mp3": "AUD-E2-02-V-7"}, {"palabra": "stayed · /d/", "afi": "/steɪd/", "parecido": "s + «te» de «tela» + i + d", "ejemplo": "I stayed at home.", "familia": "", "imagen": null, "mp3": "AUD-E2-02-V-8"}, {"palabra": "visited · /ɪd/", "afi": "/ˈvɪzɪtɪd/", "parecido": "«visi» de «visita» + «tid»: una sílaba más", "ejemplo": "I visited my grandma.", "familia": "", "imagen": null, "mp3": "AUD-E2-02-V-9"}, {"palabra": "wanted · /ɪd/", "afi": "/ˈwɑːntɪd/", "parecido": "«guan» de «guante» sin la g + «tid»", "ejemplo": "I wanted a dog.", "familia": "", "imagen": null, "mp3": "AUD-E2-02-V-10"}, {"palabra": "decided · /ɪd/", "afi": "/dɪˈsaɪdɪd/", "parecido": "«di» de «dime» + «sai» de «sainete» + «did»", "ejemplo": "I decided to stay.", "familia": "", "imagen": null, "mp3": "AUD-E2-02-V-11"}, {"palabra": "waited · /ɪd/", "afi": "/ˈweɪtɪd/", "parecido": "u + «ei» de «reina» + «tid»", "ejemplo": "I waited for the bus.", "familia": "", "imagen": null, "mp3": "AUD-E2-02-V-12"}], "mp3s": ["AUD-E2-02-V-1", "AUD-E2-02-V-2", "AUD-E2-02-V-3", "AUD-E2-02-V-4", "AUD-E2-02-V-5", "AUD-E2-02-V-6", "AUD-E2-02-V-7", "AUD-E2-02-V-8", "AUD-E2-02-V-9", "AUD-E2-02-V-10", "AUD-E2-02-V-11", "AUD-E2-02-V-12"]}, {"tipo": "Diagrama con partes tocables", "titulo": "¿/t/, /d/ o /ɪd/?", "contenido": {"imagen": "IMG-E2-02-1", "partes": [["Paso 1", "¿El verbo termina en t o d?", "Sí → /ɪd/: visited, wanted, decided, waited."], ["Paso 2", "Si no: ¿tu garganta vibra al final?", "No vibra → /t/: walked, watched, helped, danced."], ["Paso 3", "Sí vibra", "→ /d/: played, cleaned, listened, stayed."]]}}], "actividades": [{"id": "A1", "tipo": "escuchar y elegir", "titulo": "-ed Sounds", "instrucciones": "Escucha el verbo y elige su sonido.", "contenido": [["audio: walked", ["/t/ ✓", "/d/", "/ɪd/"]], ["audio: watched", ["/t/ ✓", "/d/", "/ɪd/"]], ["audio: helped", ["/t/ ✓", "/d/", "/ɪd/"]], ["audio: danced", ["/t/ ✓", "/d/", "/ɪd/"]], ["audio: played", ["/t/", "/d/ ✓", "/ɪd/"]], ["audio: cleaned", ["/t/", "/d/ ✓", "/ɪd/"]], ["audio: listened", ["/t/", "/d/ ✓", "/ɪd/"]], ["audio: stayed", ["/t/", "/d/ ✓", "/ɪd/"]], ["audio: visited", ["/t/", "/d/", "/ɪd/ ✓"]], ["audio: wanted", ["/t/", "/d/", "/ɪd/ ✓"]], ["audio: decided", ["/t/", "/d/", "/ɪd/ ✓"]], ["audio: waited", ["/t/", "/d/", "/ɪd/ ✓"]]], "nota": "Si pone visited en /t/: «/ɪd/ solo va después de t o d: visit termina en t, por eso visi-ted». Si pone walked en /ɪd/: «walk termina en k: el -ed suena /t/, sin sílaba extra»."}, {"id": "A2", "tipo": "arrastrar a categorías", "titulo": "Tres puertas", "instrucciones": "Escucha y arrastra cada verbo a su puerta.", "contenido": [["/t/", ["cooked", "washed", "stopped", "liked", "looked", "worked"]], ["/d/", ["called", "lived", "loved", "opened", "studied", "cried"]], ["/ɪd/", ["needed", "started", "painted", "ended", "invited", "rested"]]], "nota": "Nivel 1 muestra el verbo escrito; nivel 2 solo el audio."}, {"id": "A3", "tipo": "completar espacios", "titulo": "¿Cuándo pasó?", "instrucciones": "Completa con last, ago, yesterday o in.", "contenido": [["I visited my grandma ___ Sunday.", "last", ""], ["I played soccer two days ___.", "ago", ""], ["I cleaned my room ___.", "yesterday", ""], ["My sister was born ___ 2015.", "in", ""], ["We watched a movie ___ night.", "last", ""]], "nota": "Si escribe ago antes del tiempo: «ago va después: two days ago»."}], "libreta": "Dibuja 3 columnas /t/ · /d/ · /ɪd/, escribe 4 verbos en cada una y dilos en voz alta con su gesto.", "usos": [{"momento": "después", "sesion": "S2", "minutos": 8, "alumno": "Voltea las 12 tarjetas repitiendo con el gesto y juega A1 a A3.", "docente": "La recuperación de la S3 (tres verbos con su sonido) usa los verbos que más fallaron en MyClass.", "conexion": "Tres columnas de la libreta (S2) y libro p. 40."}], "entrega": null, "semana": 1}, {"id": "E2-03", "titulo_en": "My weekend in three scenes", "titulo_es": "Mi fin de semana en tres escenas", "grado": "2°", "tarjeta": "2° · Past Simple (Lives We Remember)", "mes": "Octubre", "semana_cal": 2, "habilita": "Lunes 19 de octubre (apertura de la Encarta)", "modo": "casa", "sesion": "Antes de la S3 (avance) y después (práctica)", "objetivo": "Cuento mi fin de semana en tres oraciones sin leer y sé qué escucha un buen oyente.", "aula": null, "articulo": [["Contar en tres escenas", "Una historia corta tiene inicio, medio y final. Tres escenas bastan.", "avance"], ["Palabra clave, no oración", "Debajo de cada dibujo escribe solo el verbo en pasado: visited · cooked · watched. Así hablas sin leer.", "avance"], ["¿Cuándo pasó? (libro, p. 40)", "yesterday = ayer · last Sunday = el domingo pasado · eight months ago = hace ocho meses · in 2010 = en 2010. Con una de estas expresiones tu historia dice cuándo pasó.", "avance"], ["Escucha a Sofía", "Sofía cuenta su sábado en tres escenas. ¿Qué hizo?", "avance"], ["El oyente con lista", "☐ 3 sentences ☐ verbs in the past ☐ correct -ed sounds ☐ a time expression ☐ no reading. Se marca lo que se oye, no lo que se sabe.", "repaso"], ["Tu punto de partida", "Las dos listas que marcaron tus compañeros son tu punto de partida oral. En noviembre grabarás y compararás.", "repaso"]], "recursos": [{"tipo": "imagen", "id": "IMG-E2-03-1", "donde": "Las 3 viñetas de Sofía (mismo personaje)", "texto": "Prompt:\n```\nThree-panel comic with the same 13-year-old girl (Sofía, long dark hair, casual clothes): panel 1 helping her mother at a colorful Mexican street market stall with fruit; panel 2 playing soccer with three cousins on a dirt street in the afternoon; panel 3 watching a movie at home at night with popcorn. Mexican public secondary school students aged 12 to 13 in school uniforms, diverse and respectful, non-stereotyped. Contemporary Latin American editorial illustration for a children's magazine, made by a professional illustrator: hand-painted digital gouache look with visible brush strokes, dry-brush and fine grain textures and a subtle paper texture; bold saturated palette of vermilion orange, marigold yellow, deep teal green and emerald, with small touches of pink and cream; lush stylized leaves and flowers framing the scene; characters built from simple rounded shapes, rosy cheeks, small dot eyes and expressive gestures; flat layered composition. Avoid glossy 3D render, airbrushed gradients, photorealism, generic clip art and plastic shine. No text, no letters, no numbers, no logos. Framing: cuadrado 1:1 cada viñeta.\n```"}, {"tipo": "audio", "id": "AUD-E2-03-S", "donde": "Botón de audio del cómic", "habla": "Voz sintética en inglés de EE. UU., femenina juvenil", "texto": "Last Saturday, I helped my mom at the tianguis. In the afternoon, I played soccer with my cousins. At night, I watched a movie."}, {"tipo": "audio", "id": "AUD-E2-03-A", "donde": "Juego A2, versión A", "habla": "Voz sintética en inglés de EE. UU., masculina juvenil, lento y con pausas, como si leyera", "texto": "Last Sunday, I… visit my grandpa. We… cook tamales. Then, we… listen to music."}, {"tipo": "audio", "id": "AUD-E2-03-B", "donde": "Juego A2, versión B", "habla": "Voz sintética en inglés de EE. UU., masculina juvenil, fluido", "texto": "Last Sunday, I visited my grandpa. We cooked tamales. Then, we listened to music."}], "interactivos": [{"tipo": "Cómic", "titulo": "Sofía's Saturday", "contenido": {"vinetas": [["1", "Sofía ayuda a su mamá en un puesto del tianguis.", "Last Saturday, I helped my mom at the tianguis.", "helped = ayudé · tianguis"], ["2", "Sofía juega fútbol con sus primos en una calle de tierra.", "In the afternoon, I played soccer with my cousins.", "afternoon = tarde · cousins = primos"], ["3", "Sofía ve una película en casa, de noche.", "At night, I watched a movie.", "at night = en la noche"]]}, "mp3": "AUD-E2-03-S"}, {"tipo": "Infografía", "titulo": "La lista del oyente", "contenido": [["☐", "3 sentences", "Tres oraciones."], ["☐", "verbs in the past", "Verbos en pasado."], ["☐", "correct -ed sounds", "Sonidos de -ed correctos."], ["☐", "no reading", "Sin leer."]], "parte": "repaso"}], "actividades": [{"id": "A1", "tipo": "ordenar", "titulo": "Story Order", "instrucciones": "Ordena cada historia.", "contenido": {"series": [["Last Saturday, I helped my mom at the tianguis.", "In the afternoon, I played soccer with my cousins.", "At night, I watched a movie."], ["Last Sunday, I visited my grandpa.", "We cooked tamales.", "Then, we listened to music."]]}, "nota": "Si falla: «Busca las pistas de tiempo: last Saturday, in the afternoon, at night, then»."}, {"id": "A2", "tipo": "escuchar y elegir", "titulo": "El oyente con lista", "instrucciones": "Escucha las dos versiones de Beto y responde.", "contenido": [["¿Qué versión usa verbos en pasado?", ["B ✓", "A"]], ["En la versión A, ¿qué falta?", ["Verbos en pasado ✓", "Tres oraciones", "Hablar fuerte"]], ["¿Cuántas oraciones dice Beto en la versión B?", ["3 ✓", "2", "4"]], ["En la versión B, ¿cómo suena visited?", ["/ɪd/ ✓", "/t/", "/d/"]]], "nota": "Botones para escuchar A y B las veces que quiera.", "audios": [{"id": "AUD-E2-03-A", "texto": "Last Sunday, I… visit my grandpa. We… cook tamales. Then, we… listen to music.", "etiqueta": "Versión A"}, {"id": "AUD-E2-03-B", "texto": "Last Sunday, I visited my grandpa. We cooked tamales. Then, we listened to music.", "etiqueta": "Versión B"}]}, {"id": "A3", "tipo": "completar espacios", "titulo": "El verbo debajo de la escena", "instrucciones": "Escribe el pasado.", "contenido": [["help → ___", "helped", ""], ["play → ___", "played", ""], ["watch → ___", "watched", ""], ["visit → ___", "visited", ""], ["cook → ___", "cooked", ""], ["listen → ___", "listened", ""]], "nota": ""}], "libreta": "Dibuja tus 3 escenas con su verbo en pasado y cuéntalas en voz alta a alguien de tu casa.", "usos": [{"momento": "antes", "sesion": "S3", "minutos": 5, "alumno": "Lee y escucha el cómic de Sofía.", "docente": "En el paso «Modelo» de la S3 compara tu tira con la de Sofía.", "conexion": "Tira de 3 escenas de la libreta."}, {"momento": "después", "sesion": "S3", "minutos": 8, "alumno": "Juega A1 a A3.", "docente": "Sin preparación.", "conexion": "Sus dos listas del oyente (punto de partida oral)."}], "entrega": null, "semana": 1}, {"id": "E2-04", "titulo_en": "Rebel verbs", "titulo_es": "Verbos rebeldes", "grado": "2°", "tarjeta": "2° · Past Simple (Lives We Remember)", "mes": "Octubre", "semana_cal": 2, "habilita": "Lunes 19 de octubre", "modo": "casa", "sesion": "Después de la S4 (práctica)", "objetivo": "Uso el pasado de los 8 verbos irregulares más comunes y encuentro cualquier verbo en mi banco de verbos.", "aula": null, "articulo": [["No todos usan -ed", "Algunos verbos son rebeldes: cambian a su manera. go → went, eat → ate, buy → bought.", "avance"], ["Los 8 más usados", "go – went · have – had · make – made · get – got · see – saw · eat – ate · take – took · buy – bought.", ""], ["Tres formas", "base · pasado · participio: eat – ate – eaten. En este tema usamos base y pasado; el participio, en el Tema 7.", ""], ["Cuatro familias", "1 · A A A (cut – cut – cut) · 2 · A B B (buy – bought – bought) · 3 · A B C (eat – ate – eaten) · 4 · A B A (come – came – come).", ""], ["Tu banco de verbos", "Busca cualquier verbo en Herramientas → Banco de verbos. Es para consultar, no para memorizar de golpe.", ""], ["Find someone who", "Did you go to the tianguis last weekend? — Yes, I did. / No, I didn't. La pregunta se usa como frase hecha; en la S7 vemos por qué.", "repaso"]], "recursos": [{"tipo": "imagen", "id": "IMG-E2-04-1", "donde": "Encabezado del artículo", "texto": "Prompt:\n```\nA cheerful steam train with four colored wagons on a track through green hills of central Mexico, each wagon carrying a different group of playful cartoon objects, a small station sign without words. Contemporary Latin American editorial illustration for a children's magazine, made by a professional illustrator: hand-painted digital gouache look with visible brush strokes, dry-brush and fine grain textures and a subtle paper texture; bold saturated palette of vermilion orange, marigold yellow, deep teal green and emerald, with small touches of pink and cream; lush stylized leaves and ook · get – got"], ["4 · A B A", "El participio regresa a la base", "come – came · run – ran"]]}}, {"tipo": "Tarjetas que se voltean", "titulo": "Los 8 rebeldes", "contenido": [{"palabra": "go /ɡoʊ/", "afi": "went /wɛnt/", "parecido": "go: «go» de «gorra» con u breve · went: «güen» de «güero» + t", "ejemplo": "I went to the tianguis.", "familia": "3", "imagen": "IMG-E2-04-2 · ícono 1", "img": "IMG-E2-04-2-01", "mp3": "AUD-E2-04-V-1"}, {"palabra": "have /hæv/", "afi": "had /hæd/", "parecido": "have: «ja» de «jabón» (j suave) + v · had: «ja» de «jade» + d; la a muy abierta", "ejemplo": "I had a party.", "familia": "2", "imagen": "IMG-E2-04-2 · ícono 2", "img": "IMG-E2-04-2-02", "mp3": "AUD-E2-04-V-2"}, {"palabra": "make /meɪk/", "afi": "made /meɪd/", "parecido": "make: m + «ei» de «reina» + k · made: m + «ei» de «reina» + d", "ejemplo": "I made dinner.", "familia": "2", "imagen": "IMG-E2-04-2 · ícono 3", "img": "IMG-E2-04-2-03", "mp3": "AUD-E2-04-V-3"}, {"palabra": "get /ɡɛt/", "afi": "got /ɡɑːt/", "parecido": "get: «gue» de «guerra» + t · got: «ga» de «gato» + t", "ejemplo": "I got up early.", "familia": "3", "imagen": "IMG-E2-04-2 · ícono 4", "img": "IMG-E2-04-2-04", "mp3": "AUD-E2-04-V-4"}, {"palabra": "see /siː/", "afi": "saw /sɔː/", "parecido": "see: «sí» alargada · saw: «so» de «sol» con la boca más abierta", "ejemplo": "I saw a movie.", "familia": "3", "imagen": "IMG-E2-04-2 · ícono 5", "img": "IMG-E2-04-2-05", "mp3": "AUD-E2-04-V-5"}, {"palabra": "eat /iːt/", "afi": "ate /eɪt/", "parecido": "eat: «i» de «iglú» alargada + t · ate: «ei» de «reina» + t; suena igual que eight (8)", "ejemplo": "I ate tacos.", "familia": "3", "imagen": "IMG-E2-04-2 · ícono 6", "img": "IMG-E2-04-2-06", "mp3": "AUD-E2-04-V-6"}, {"palabra": "take /teɪk/", "afi": "took /tʊk/", "parecido": "take: t + «ei» de «reina» + k · took: «tu» de «tuyo», corta, + k", "ejemplo": "I took a bus.", "familia": "3", "imagen": "IMG-E2-04-2 · ícono 7", "img": "IMG-E2-04-2-07", "mp3": "AUD-E2-04-V-7"}, {"pa do. El presidente Porfirio Díaz la apoyó y estuvo en su examen.", "repaso"], ["Cómo la leímos", "Para saber de qué trata: título, primeras líneas y fotos (skimming). Para las fechas: busca números (scanning).", "repaso"]], "recursos": [{"tipo": "foto", "id": "FOTO-MATILDE", "donde": "Línea del tiempo y foto de perfil del chat · Qué: Fotografía histórica de Matilde Montoya (la misma de la p. 42 del libro) · Fuente: Wikimedia Commons, dominio público. No generes su rostro con IA. Verifica la licencia y escribe el crédito debajo.", "texto": ""}, {"tipo": "imagen", "id": "IMG-E2-05-1", "donde": "Encabezado del artículo (sin personas)", "texto": "Prompt:\n```\nAn old 19th-century medical book open on a wooden desk, a brass stethoscope, an inkwell with a quill and a rolled diploma tied with a red ribbon, warm window light. Contemporary Latin American editorial illustration for a children's magazine, made by a professional illustrator: hand-painted digital gouache look with visible brush strokes, dry-brush and fine grain textures and a subtle paper texture; bold saturated palette of vermilion orange, marigold yellow, deep teal green and emerald, with small touches of pink and cream; lush stylized leaves and flowers framing the scene; characters built from simple rounded shapes, rosy cheeks, small dot eyes and expressive gestures; flat layered composition. Avoid glossy 3D render, airbrushed gradients, photorealism, generic clip art and plastic shine. No text, no letters, no numbers, no logos. Framing: horizontal 16:9.\n```"}, {"tipo": "audio", "id": "AUD-E2-05-L", "donde": "Un audio por punto de la línea (7 archivos)", "habla": "Profesor Arturo (tu voz)", "texto": "1859 · March 14th: She was born in Mexico City. / Age 4: She could read and write. / Age 11: She was ready to attend high school. / Age 14: She took courses at the school of Medicine. / Before 1887: She worked as a midwife in Cuernavaca. / 1887 · August 24th: She passed her exam. She was the first female doctor in Mexico. / 1938 · January 26th: She passed away."}], "interactivos": [{"tipo": "Línea del tiempo", "titulo": "La vida de Matilde Montoya", "contenido": {"cab": ["Fecha", "Oración (con audio)", "Significado"], "puntos": [["1859 · March 14th", "She was born in Mexico City.", "Nació en la Ciudad de México."], ["Age 4", "She could read and write.", "Ya sabía leer y escribir."], ["Age 11", "She was ready to attend high school.", "Estaba lista para la escuela superior."], ["Age 14", "She took courses at the school of Medicine.", "Tomó cursos en la Escuela de Medicina."], ["Before 1887", "She worked as a midwife in Cuernavaca.", "Trabajó como partera en Cuernavaca."], ["1887 · August 24th", "She passed her exam. She was the first female doctor in Mexico.", "Aprobó su examen: la primera médica de México."], ["1938 · January 26th", "She passed away.", "Falleció."]], "extra": "", "funcionamiento": "Puntos de izquierda a derecha; al tocar: oración en inglés con audio y su significado en español."}, "parte": "repaso", "mp3s": ["AUD-E2-05-L-1", "AUD-E2-05-L-2", "AUD-E2-05-L-3", "AUD-E2-05-L-4", "AUD-E2-05-L-5", "AUD-E2-05-L-6", "AUD-E2-05-L-7"]}], "actividades": [{"id": "A1", "tipo": "ordenar", "titulo": "Story Order: Matilde", "instrucciones": "Ordena los momentos de su vida.", "contenido": {"series": [["At age 4, she could read and write.", "At age 14, she took courses at the school of Medicine.", "She worked as a midwife in Cuernavaca.", "In 1887, she passed her exam.", "In 1938, she passed away."]]}, "nota": "Si falla: «Busca las pistas de tiempo: edades y años»."}, {"id": "A2", "tipo": "relacionar", "titulo": "Números de una vida", "instrucciones": "Une cada número con lo que pasó.", "contenido": [["4", "She could read and write."], ["11", "She was ready to attend high school."], ["14", "She took courses at the school of Medicine."], ["1887", "She passed her exam."], ["1938", "She passed away."]], "nota": ""}, {"id": "A3", "tipo": "opción múltiple", "titulo": "Scanning: Matilde", "instrucciones": "Busca el dato en la línea del tiempo.", "contenido": [["¿De qué trata?", ["La vida de la primera médica de México ✓", "Una leyenda", "Un hospital"]], ["¿En qué año aprobó su examen?", ["1887 ✓", "1938", "1859"]], ["¿Dónde trabajó como partera?", ["Cuernavaca ✓", "Zumpango", "Chicago"]], ["¿Qué hacía a los 4 años?", ["Leía y escribía ✓", "Trabajaba", "Presentó su examen"]], ["¿Quién estuvo en su examen?", ["El presidente Porfirio Díaz ✓", "Benito Juárez", "Frida Kahlo"]]], "nota": ""}], "libreta": "Completa tu reloj de arena con 4 momentos de Matilde (año o edad y lo que pasó).", "usos": [{"momento": "antes", "sesion": "S5", "minutos": 3, "alumno": "Mira la foto y lee «¿Quién es ella?».", "docente": "En el paso «Predicción» de la S5 pregunta primero a quien vio el avance.", "conexion": "Libro p. 42."}, {"momento": "después", "sesion": "S5", "minutos": 8, "alumno": "Explora la línea del tiempo y juega A1 a A3.", "docente": "Sin preparación.", "conexion": "Reloj de arena de la libreta y libro pp. 42–43."}], "entrega": null, "semana": 2}, {"id": "E2-06", "titulo_en": "Words in context", "titulo_es": "Palabras por contexto", "grado": "2°", "tarjeta": "2° · Past Simple (Lives We Remember)", "mes": "Octubre", "semana_cal": 2, "habilita": "Lunes 19 de octubre", "modo": "casa", "sesion": "Antes de la S6 (avance) y después (práctica y encuesta del proyecto)", "objetivo": "Descubro qué significa una palabra por las pistas de la oración, sin diccionario, y elijo la historia de mi proyecto.", "aula": null, "articulo": [["Sin diccionario", "Muchas veces puedes adivinar qué significa una palabra por las otras palabras de la oración: son pistas.", "avance"], ["Ejemplo", "My grandma was a midwife. She helped many women have their babies at home. ¿Qué es una midwife? La pista: helped women have their babies.", "avance"], ["Las palabras de la página 44", "midwife · youngster · get sick · older adults · used to · passed away · immodest · struggle · due to.", "repaso"], ["used to", "People used to wash clothes in the river. = Antes la gente lavaba la ropa en el río (ya no). Sirve para hablar de lo que cambió.", "repaso"], ["Nuestro proyecto", "Lives We Remember: una línea del tiempo de 4 momentos, una reflexión y una grabación. Opciones: (a) alguien que tu familia recuerda en Día de Muertos · (b) una persona mayor de la comunidad · (c) un suceso de la escuela o la comunidad · (d) una persona o suceso de la historia o de tu revista. Nadie tiene que compartir algo doloroso: la (d) siempre está disponible.", "repaso"], ["La entrevista", "5 preguntas en español, con fechas, durante el fin de semana largo.", "repaso"]], "recursos": [{"tipo": "imagen", "id": "IMG-E2-06-1", "donde": "Encabezado del artículo", "texto": "Prompt:\n```\nA detective magnifying glass over an open book with highlighted words glowing softly, small arrows pointing from surrounding words to the highlighted one, warm desk light. Contemporary Latin American editorial illustration for a children's magazine, made by a professional illustrator: hand-painted digital gouache look with visible brush strokes, dry-brush and fine grain textures and a subtle paper texture; bold saturated palette of vermilion orange, marigold yellow, deep teal green and emerald, with small touches of pink and cream; lush stylized leaves and flowers framing the scene; characters built from simple rounded shapes, rosy cheeks, small dot eyes and expressive gestures; flat layered composition. Avoid glossy 3D render, airbrushed gradients, photorealism, generic clip art and plastic shine. No text, no letters, no numbers, no logos. Framing: horizontal 16:9.\n```"}, {"tipo": "audio", "id": "AUD-E2-06-P", "donde": "Una por tarjeta (9 archivos)", "habla": "Voz sintética en inglés de Estados Unidos, velocidad 0.85", "texto": "La palabra dos veces y su oración: «midwife. midwife. My grandma was a midwife…» Lista completa en las tarjetas."}], "interactivos": [{"tipo": "Tarjetas que se voltean", "t ia": "", "imagen": null, "mp3": "AUD-E2-06-P-7"}, {"palabra": "struggle", "afi": "/ˈstrʌɡəl/", "parecido": "s + «tra» de «trapo» con a relajada + «gol» de «gol» suave · significa: lucha, algo muy difícil", "ejemplo": "Learning English was a struggle for Ana, but she practiced every day.", "familia": "", "imagen": null, "mp3": "AUD-E2-06-P-8"}, {"palabra": "due to", "afi": "/ˈduː tə/", "parecido": "«du» de «duda» + «ta» suave · significa: debido a", "ejemplo": "The class was canceled due to the rain.", "familia": "", "imagen": null, "mp3": "AUD-E2-06-P-9"}], "mp3s": ["AUD-E2-06-P-1", "AUD-E2-06-P-2", "AUD-E2-06-P-3", "AUD-E2-06-P-4", "AUD-E2-06-P-5", "AUD-E2-06-P-6", "AUD-E2-06-P-7", "AUD-E2-06-P-8", "AUD-E2-06-P-9"]}, {"tipo": "Encuesta del grupo", "titulo": "¿Qué opción de proyecto elegiste?", "contenido": {"opciones": ["(a) Alguien que mi familia recuerda", "(b) Una persona mayor de la comunidad", "(c) Un suceso de la escuela o la comunidad", "(d) Una persona o suceso de la historia o de mi revista"], "muestra": "El alumno ve el total del grupo; tú ves quién eligió qué."}, "parte": "repaso"}], "actividades": [{"id": "A1", "tipo": "opción múltiple", "titulo": "Guess the Word", "instrucciones": "Lee la oración y elige el significado de la palabra en negritas.", "contenido": [["My grandma was a **midwife**. She helped many women have their babies at home.", ["partera ✓", "enfermera", "vecina"]], ["When my dad was a **youngster**, he played in the street all day.", ["joven ✓", "anciano", "maestro"]], ["If you don't eat well, you can **get sick**.", ["enfermarse ✓", "curarse", "despertarse"]], ["**Older adults** in my family tell great stories about the past.", ["adultos mayores ✓", "niños pequeños", "maestros"]], ["People in my town **used to** wash clothes in the river. Now they have washing machines.", ["antes acostumbraba (y ya no) ✓", "usó para", "nunca"]], ["My grandpa **passed away** in 2019. We remember him on Day of the Dead.", ["falleció ✓", "se fue de viaje", "pasó la calle"]], ["Some people called Matilde **immodest** because she studied the human body. That was unfair.", ["impúdica (así llamaban a quien hablaba del cuerpo) ✓", "muy inteligente", "muy rica"]], ["Learning English was a **struggle** for Ana, but she practiced every day.", ["lucha, algo muy difícil ✓", "fiesta", "regalo"]], ["The class was canceled **due to** the rain.", ["debido a ✓", "después de", "a pesar de"]]], "nota": "Al fallar se resalta la pista, por ejemplo: «helped women have their babies te dice qué hace una midwife»."}, {"id": "A2", "tipo": "relacionar", "titulo": "Palabra y significado", "instrucciones": "Une cada palabra con su significado.", "contenido": [["midwife", "partera"], ["youngster", "joven"], ["get sick", "enfermarse"], ["older adults", "adultos mayores"], ["used to", "antes acostumbraba"], ["passed away", "falleció"], ["immodest", "impúdica"], ["struggle", "lucha, algo muy difícil"], ["due to", "debido a"]], "nota": ""}, {"id": "A3", "tipo": "completar espacios", "titulo": "Words in Context: Matilde", "instrucciones": "Arrastra la palabra que encaja.", "contenido": [["Matilde wanted to be a doctor. First, she worked as a ___.", "midwife", ""], ["Many people said no; it was a ___.", "struggle", ""], ["She passed her ___ in 1887.", "exam", ""], ["She ___ in 1938.", "passed away", ""]], "nota": "Banco: midwife · struggle · exam · passed away · youngster · due to."}], "libreta": "Escribe 3 palabras de la p. 44 con tu propia oración y la pista que te ayudó.", "usos": [{"momento": "antes", "sesion": "S6", "minutos": 5, "alumno": "Lee el ejemplo de midwife y voltea las tarjetas midwife, struggle y used to.", "docente": "En el crucigrama de la S6 pide a quien vio el avance que explique cómo usó la pista.", "conexion": "Libro p. 44."}, {"momento": "después", "sesion": "S6", "minutos": 8, "alumno": "Juega A1 a A3 y vota su opción de proyecto.", "docente": "Revisa en MyClass la encuesta: habla en privado con quien no eligió opción.", "conexion": "Tema elegido y guía de entrevista en la libreta."}], "entrega": null, "semana": 2}, {"id": "E2-07", "titulo_en": "Asking about the past: did", "titulo_es": "Preguntar en pasado: did", "grado": "2°", "tarjeta": "2° · Past Simple (Lives We Remember)", "mes": "Octubre", "semana_cal": 3, "habilita": "Sábado 24 de octubre", "modo": "casa", "sesion": "Antes de la S7 (avance) y después (práctica para la entrevista)", "objetivo": "Hago preguntas en pasado con did y respondo Yes, I did / No, I didn't para entrevistar a mi familia.", "aula": null, "articulo": [["Una pregunta en pasado", "Did you go to the tianguis? = ¿Fuiste al tianguis? Did /dɪd/ avisa que la pregunta es en pasado.", "avance"], ["¿Qué le pasó a went?", "I went to the tianguis. → Did you go to the tianguis? Did se lleva el pasado y el verbo regresa a su forma base: go.", "repaso"], ["Respuestas cortas", "Yes, I did. / No, I didn't. Y agrega una oración: Yes, I did. I visited my grandpa.", "repaso"], ["Preguntas con When, Where, What", "When did you…? · Where did you…? · What did you…? · Who was your…? · Did you like…?", "repaso"], ["La trampa", "Did you went? ✗ → Did you go? ✓ · Did you visited? ✗ → Did you visit? ✓", "repaso"], ["Tu entrevista en casa", "Este fin de semana largo entrevista a tu familia en español: 5 preguntas, con fechas. Antes practica con la abuela Chayo.", ""], ["Skeleton, skeleton", "Canción del Prof. Arturo Meneses. found es el pasado de find (familia 2: find – found – found).", ""]], "recursos": [{"tipo": "imagen", "id": "IMG-E2-07-1", "donde": "Encabezado del artículo", "texto": "Prompt:\n```\nA joyful cartoon skeleton dancing next to a Mexican ofrenda with marigold flowers, candles, pan de muerto and papel picado, warm candlelight, friendly and not scary. Contemporary Latin American editorial illustration for a children's magazine, made by a professional illustrator: hand-painted digital gouache look with visible brush strokes, dry-brush and fine grain textures and a subtle paper texture; bold saturated palette of vermilion orange, marigold yellow, deep teal green and emerald, with small touches of pink and cream; lush stylized leaves and flowers framing the scene; characters built from simple rounded shapes, rosy cheeks, small dot eyes and expressive gestures; flat layered composition. Avoid glossy 3D render, airbrushed gradients, photorealism, generic clip art and plastic shine. No text, no letters, no numbers, no logos. Framing: horizontal 16:9.\n```"}, {"tipo": "imagen", "id": "IMG-E2-07-2", "donde": "Foto de perfil de la abuela Chayo (personaje inventado)", "texto": "Prompt:\n```\nIllustrated bust portrait of a kind elderly Mexican woman with gray hair in a braid, a rebozo shawl, smiling warmly, a small adobe kitchen in the soft background. Contemporary Latin American editorial illustration for a children's magazine, made by a professional illustrator: hand-painted digital gouache look with visible brush strokes, dry-brush and fine grain textures and a subtle paper texture; bold saturated palette of vermilion orange, marigold yellow, deep teal green and emerald, with small touches of pink and cream; lush stylized leaves and flowers framing the scene; characters built from simple rounded shapes, rosy cheeks, small dot eyes and expressive gestures; flat layered composition. Avoid glossy 3D render, airbrushed gradients, photorealism, generic clip art and plastic shine. No text, no letters, no numbers, no logos. Framing: cuadrado 1:1, retrato de busto.\n```"}, {"tipo": "audio", "id": "AUD-E2-07-S", "donde": "Tarjeta de la canción", "habla": "Profesor Arturo (tu voz) (las dos partes)", "texto": "All: Skeleton, skeleton, dancing around, / what did you find in the ofrenda ground? / Calacas: I found a candle, I found some bread, / I found a flower, orange and red!"}], "interactivos": [{"tipo": "Tabla comparativa", "titulo": "Afirmativa, pregunta y negativa", "contenido": {"columnas": ["Afirmativa", "Pregunta", "Negativa"], "filas": [["I went.", "Did you go?", "I didn't go."], ["I ate.", "Did you eat?", "I didn't eat."], ["I visited.", "Did you visit?", "I didn't visit."], ["I played.", "Did you play?", "I didn't play."]]}, "parte": "repaso"}, {"tipo": "Simulador de chat", "titulo": "Abuela Chayo", "contenido": "Guion completo en la sección «Chats»: CHAT-C.", "chat": "CHAT-C"}, {"tipo": "Tarjeta de canción", "titulo": "Skeleton, skeleton (canción del Prof. Arturo Meneses)", "contenido": {"lineas": ["All: Skeleton, skeleton, dancing around,", "what did you find in the ofrenda ground?", "Calacas: I found a candle, I found some bread,", "I found a flower, orange and red!"], "extra": {"glosario": "found = encontré · bread = pan · candle = vela · flower = flor", "funcionamiento": "Pregunta y respuesta: el alumno elige ser «All» o «Calacas» y su parte se ilumina para cantarla.", "audio": "AUD-E2-07-S"}}}], "actividades": [{"id": "A1", "tipo": "ordenar", "titulo": "Ask the Past", "instrucciones": "Ordena la pregunta. Cuidado: hay una ficha trampa que sobra.", "contenido": {"series": [["Did", "you", "go", "to the tianguis", "?"], ["Where", "did", "you", "live", "?"], ["What", "did", "you", "eat", "?"], ["When", "did", "you", "get up", "?"], ["Did", "you", "visit", "your grandma", "?"]], "trampas": ["went", "lived", "ate", "got", "visited"]}, "nota": "Si usa la trampa: «Did ya lleva el pasado; el verbo regresa a su forma base: Did you go?»."}, {"id": "A2", "tipo": "opción múltiple", "titulo": "¿Cuál está bien?", "instrucciones": "Elige la pregunta o la respuesta correcta.", "contenido": [["Pregunta", ["Did you go to school? ✓", "Did you went to school?", "You did go to school?"]], ["Pregunta", ["What did you eat? ✓", "What did you ate?", "What you ate?"]], ["Pregunta", ["Where did you live? ✓", "Where did you lived?", "Where you did live?"]], ["Did you visit the cemetery?", ["Yes, I did. ✓", "Yes, I visited.", "Yes, I do."]], ["Did you watch TV?", ["No, I didn't. ✓", "No, I don't watched.", "No, I not."]]], "nota": ""}, {"id": "A3", "tipo": "completar espacios", "titulo": "Did, did, didn't", "instrucciones": "Completa.", "contenido": [["___ you play soccer last Saturday?", "Did", ""], ["Yes, I ___.", "did", ""], ["No, I ___.", "didn't", ""], ["What did you ___? (eat)", "eat", "Con did, el verbo va en base."], ["Where did you ___? (go)", "go", ""]], "nota": ""}], "libreta": "Escribe tus 5 preguntas de la entrevista en español y 2 en inglés con did.", "usos": [{"momento": "antes", "sesion": "S7", "minutos": 5, "alumno": "Lee el avance y escucha la canción Skeleton, skeleton.", "docente": "En la S7 la canción ya es conocida para quien la escuchó: que guíen el coro.", "conexion": "Abanico de preguntas de la libreta (S7)."}, {"momento": "después", "sesion": "S7", "minutos": 10, "alumno": "Chatea con la abuela Chayo (CHAT-C) y juega A1 a A3; prepara su entrevista del fin de semana largo.", "docente": "Lee en MyClass las transcripciones del chat y anota los errores frecuentes para la recuperación de la S8.", "conexion": "Guía de entrevista de la S6."}], "entrega": null, "semana": 3}, {"id": "E2-08", "titulo_en": "The rabbit on the moon", "titulo_es": "El conejo en la luna", "grado": "2°", "tarjeta": "2° · Past Simple (Lives We Remember)", "mes": "Octubre", "semana_cal": 3, "habilita": "Sábado 24 de octubre", "modo": "casa", "sesion": "Antes de la S8 (avance) y después (práctica)", "objetivo": "Entiendo una leyenda mesoamericana contada en pasado y explico por qué es valiosa.", "aula": null, "articulo": [["¿Qué ves en la luna?", "Mira la luna llena. En México muchos ven un conejo. Zitlaltepec significa «lugar en el cerro de la estrella» en náhuatl.", "avance"], ["La luna llena del 25 de octubre", "Last Sunday, October 25th, there was a full moon. Did you see the rabbit? Con luna llena el conejo se ve completo; con media luna, solo la mitad.", "avance"], ["Conejos en la luna del mundo", "En China cuentan del Conejo de Jade, que vive en la luna. En Japón, el conejo de la luna prepara mochi, unos pastelitos de arroz. Toca el mapa.", "avance"], ["Un conejo en el espacio", "En 2013, China mandó a la luna un vehículo explorador llamado Yutu, que significa «Conejo de Jade».", "avance"], ["The Rabbit on the Moon", "A long time ago, the god Quetzalcóatl wanted to know the world, so he traveled as a man. He walked for many days. One night, he was very tired and hungry. He sat down near a forest. A little rabbit saw him and asked, “What is wrong?” Quetzalcóatl said, “I am hungry.” The rabbit only had grass. Then the rabbit said, “Eat me.” Quetzalcóatl was very surprised. He lifted the rabbit up to the moon, and the rabbit's picture stayed there. “Now everyone will remember you,” he said. Look at the full moon tonight. Can you see the rabbit? · Glosario: god = dios · tired = cansado · hungry = con hambre · grass = pasto · lifted = levantó · stayed = se quedó.", "repaso"], ["Regulares e irregulares", "Regulares (una línea): wanted, traveled, walked, asked, lifted, stayed. Irregulares (dos líneas): was, sat, saw, had, said.", "repaso"], ["¿Por qué es valiosa?", "I think this legend is important because ___. Las leyendas guardan los valores y la memoria de los pueblos originarios.", "repaso"]], "recursos": [{"tipo": "imagen", "id": "IMG-E2-08-1", "donde": "Base del mapa interactivo", "texto": "Prompt:\n```\nA simple flat world map in soft colors with three highlighted countries: Mexico, China and Japan; a full moon with a rabbit silhouette rising over the Pacific Ocean; no labels. Contemporary Latin American editorial illustration for a children's magazine, made by a professional illustrator: hand-painted digital gouache look with visible brush strokes, dry-brush and fine grain textures and a subtle paper texture; bold saturated palette of vermilion orange, marigold yellow, deep teal green and emerald, with small touches of pink and cream; lush stylized leaves and flowers framing the scene; characters built from simple rounded shapes, rosy cheeks, small dot eyes and expressive gestures; flat layered composition. Avoid glossy 3D render, airbrushed gradients, photorealism, generic clip art and plastic shine. No text, no letters, no numbers, no logos. Framing: horizontal 2:1, mapa mundial simplificado.\n```"}, {"tipo": "imagen", "id": "IMG-E2-08-2", "donde": "Las 4 viñetas de la leyenda (mismo estilo)", "texto": "Prompt:\n```\nFour-panel illustrated legend inspired by Mesoamerican art, respectful and warm: panel 1 a tall traveler wearing a simple cloak and a feathered headdress walking on a path at night under a new moon; panel 2 the traveler sitting tired near a forest under a crescent moon; panel 3 a small white rabbit talking to him under a full moon; panel 4 the traveler lifting the rabbit toward a big moon that shows the rabbit's shape. Contemporary Latin American editorial illustration for a children's magazine, made by a professional illustrator: hand-painted digital gouache look with visible brush strokes, dry-brush and fine grain textures and a subtle paper texture; bold saturated palette of vermilion orange, marigold yellow, deep teal green and emerald, with small touches of pink and cream; lush stylized leaves and flowers framing the scene; characters built from simple rounded shapes, rosy cheeks, small dot eyes and expressive gestures; flat layered composition. Avoid glossy 3D render, airbrushed gradients, photorealism, generic clip art and plastic shine. No text, no letters, no numbers, no logos. Framing: cuadrado 1:1 cada viñeta; una fase de la luna en la esquina de cada una.\n```"}, {"tipo": "audio", "id": "AUD-E2-08-L", "donde": "Bloque de la leyenda", "habla": "Profesor Arturo (tu voz)", "texto": "A long time ago, the god Quetzalcóatl wanted to know the world, so he traveled as a man. He walked for many days. One night, he was very tired and hungry. He sat down near a forest. A little rabbit saw him and asked, “What is wrong?” Quetzalcóatl said, “I am hungry.” The rabbit only had grass. Then the rabbit said, “Eat me.” Quetzalcóatl was very surprised. He lifted the rabbit up to the moon, and the rabbit's picture stayed there. “Now everyone will remember you,” he said. Look at the full moon tonight. Can you see the rabbit?"}, {"tipo": "audio", "id": "AUD-E2-08-M", "donde": "Un audio por pin del mapa (3 archivos)", "habla": "Voz sintética en inglés de Estados Unidos, velocidad 0.85", "texto": "In Mexico, people see a rabbit on the moon. / In China, people tell a story about a Jade Rabbit. / In Japan, people see a rabbit making mochi."}], "interactivos": [{"tipo": "Mapa interactivo", "titulo": "El conejo en la luna en el mundo", "contenido": {"imagen": "IMG-E2-08-1", "puntos": [["México", "Quetzalcóatl y el conejo", "In Mexico, people see a rabbit on the moon."], ["China", "El Conejo de Jade (Yutu)", "In China, people tell a story about a Jade Rabbit."], ["Japón", "El conejo que prepara mochi", "In Japan, people see a rabbit making mochi."]]}}, {"tipo": "Cómic", "titulo": "La leyenda en 4 fases de la luna", "contenido": {"vinetas": [["1", "Luna nueva: Quetzalcóatl camina como hombre por un camino.", "Quetzalcóatl traveled as a man.", ""], ["2", "Cuarto creciente: está sentado junto al bosque, cansado.", "He was tired and hungry.", ""], ["3", "Luna llena: el conejo le habla.", "The rabbit said, “Eat me.”", ""], ["4", "Cuarto menguante: Quetzalcóatl eleva al conejo hacia la luna.", "He lifted the rabbit to the moon.", ""]]}, "parte": "repaso"}, {"tipo": "Encuesta del grupo", "titulo": "¿Ves un conejo en la luna llena?", "contenido": {"opciones": ["Sí", "No", "Nunca me había fijado: hoy lo busco"], "muestra": "Barras del grupo."}}], "actividades": [{"id": "A1", "tipo": "ordenar", "titulo": "Story Order: la leyenda", "instrucciones": "Ordena las 4 fases.", "contenido": {"series": [["Quetzalcóatl traveled as a man.", "He was tired and hungry.", "The rabbit said, “Eat me.”", "He lifted the rabbit to the moon."]]}, "nota": ""}, {"id": "A2", "tipo": "arrastrar a categorías", "titulo": "Regulares e irregulares", "instrucciones": "Arrastra cada verbo de la leyenda.", "contenido": [["Regular (-ed)", ["wanted", "traveled", "walked", "asked", "lifted", "stayed"]], ["Irregular", ["was", "sat", "saw", "had", "said"]]], "nota": "Si pone said en regulares: «said viene de say: es irregular (familia 2: say – said – said)»."}, {"id": "A3", "tipo": "opción múltiple", "titulo": "¿Entendiste la leyenda?", "instrucciones": "Elige la respuesta.", "contenido": [["¿Por qué viajó Quetzalcóatl como hombre?", ["Quería conocer el mundo ✓", "Buscaba un conejo", "Estaba perdido"]], ["¿Cómo estaba una noche?", ["Cansado y con hambre ✓", "Feliz", "Enfermo"]], ["¿Qué tenía el conejo?", ["Solo pasto ✓", "Tamales", "Agua"]], ["¿Qué hizo Quetzalcóatl al final?", ["Subió al conejo a la luna ✓", "Se comió al conejo", "Regresó a su casa"]], ["¿Qué valor muestra el conejo?", ["Generosidad ✓", "Miedo", "Enojo"]]], "nota": "En la última, la retroalimentación agrega: «También puedes decir bondad o sacrificio»."}, {"id": "A4", "tipo": "completar espacios", "titulo": "Words in Context: la leyenda", "instrucciones": "Arrastra la palabra que encaja.", "contenido": [["Quetzalcóatl traveled for many days. He was ___ and ___.", "tired · hungry", ""], ["The rabbit only had ___.", "grass", ""], ["Now we can see the rabbit on the ___.", "moon", ""]], "nota": "Banco: tired · hungry · grass · moon · forest. Pista al fallar: «had only ___: algo que come un conejo → grass»."}], "libreta": "Dibuja las 4 fases de la luna con una oración de la leyenda en cada una y escribe I think this legend is important because ___.", "usos": [{"momento": "antes", "sesion": "S8", "minutos": 5, "alumno": "Lee el avance, toca el mapa y vota en la encuesta.", "docente": "En el paso «Gancho» de la S8 usa el resultado: «¿cuántos ven el conejo?».", "conexion": "Libreta: fases de la luna (S8)."}, {"momento": "después", "sesion": "S8", "minutos": 8, "alumno": "Escucha la leyenda y juega A1 a A4.", "docente": "Sin preparación.", "conexion": "Apreciación escrita de la S8."}], "entrega": null, "semana": 3}, {"id": "E2-09", "titulo_en": "Interview Matilde", "titulo_es": "Entrevista a Matilde", "grado": "2°", "tarjeta": "2° · Past Simple (Lives We Remember)", "mes": "Octubre", "semana_cal": 3, "habilita": "Sábado 24 de octubre", "modo": "aula de cómputo", "sesion": "Durante la S9 (aula de cómputo) y después (práctica)", "objetivo": "Hago preguntas con did a Matilde y convierto sus respuestas en oraciones para una línea del tiempo.", "aula": "S9 de 2°: toda la sesión (50 minutos) en el aula de cómputo", "articulo": [["Entrevista a Matilde", "Es una simulación con datos reales. Escríbele preguntas con did y ella te responde.", ""], ["De respuesta a oración", "Matilde: I passed my exam in 1887. → Tu línea: In 1887, Matilde passed her exam. Cambia I → she (o Matilde) y my → her.", ""], ["La reflexión", "I think Matilde was important because she opened the door for other women.", ""], ["Tu línea del tiempo", "4 puntos con año o expresión de tiempo, imagen y oración; reflexión al final.", ""]], "recursos": [{"tipo": "foto", "id": "FOTO-MATILDE", "donde": "Línea del tiempo y foto de perfil del chat · Qué: Fotografía histórica de Matilde Montoya (la misma de la p. 42 del libro) · Fuente: Wikimedia Commons, dominio público. No generes su rostro con IA. Verifica la licencia y escribe el crédito debajo.", "texto": ""}], "interactivos": [{"tipo": "Simulador de chat", "titulo": "Matilde Montoya", "contenido": "Guion completo en la sección «Chats»: CHAT-M.", "chat": "CHAT-M"}, {"tipo": "Constructor de oraciones", "titulo": "De su voz a tu línea", "contenido": {"campos": {"modelo": "I passed my exam in 1887.", "fichas": "In 1887, · Matilde · she · passed · pass · her · my · exam · .", "correcta": "In 1887, Matilde passed her exam.", "reglas": "Trampas: my y pass. Se aceptan Matilde o she."}, "tablas": [], "lineas": null}}], "actividades": [{"id": "A1", "tipo": "opción múltiple", "titulo": "Chat con Matilde", "instrucciones": "Elige o escribe tus preguntas.", "contenido": "Ver CHAT-M (aciertos: preguntas bien formadas / intentos).", "nota": "Cuenta como un juego."}, {"id": "A2", "tipo": "completar espacios", "titulo": "Life Timeline: Matilde", "instrucciones": "Completa cada estación con el verbo en pasado.", "contenido": [["At age 4, she ___ read and write. (can)", "could", ""], ["In 1887, she ___ her exam. (pass)", "passed", ""], ["She ___ as a midwife in Cuernavaca. (work)", "worked", ""], ["In 1938, she ___ away. (pass)", "passed", ""]], "nota": "Si deja el verbo en presente: «Ya pasó: usa el pasado. pass → passed»."}, {"id": "A3", "tipo": "opción múltiple", "titulo": "Cambia I por she", "instrucciones": "Elige cómo queda en tu línea del tiempo.", "contenido": [["I was born in Mexico City.", ["She was born in Mexico City. ✓", "She is born in Mexico City.", "I was born in Mexico City."]], ["I worked as a midwife.", ["She worked as a midwife. ✓", "She works as a midwife.", "She work as a midwife."]], ["My exam was in 1887.", ["Her exam was in 1887. ✓", "My exam was in 1887.", "She exam was in 1887."]], ["I learned to read when I was four.", ["She learned to read when she was four. ✓", "She learn to read when she was four.", "She learned to read when I was four."]]], "nota": ""}], "libreta": "Sin aula de cómputo: el profesor es Matilde en voz alta y tú escribes en la libreta 3 preguntas con did y 4 oraciones de su línea del tiempo.", "usos": [{"momento": "durante", "sesion": "S9", "minutos": 28, "alumno": "En parejas: entrevistan a Matilde en el chat (16 min: al menos 5 preguntas con did) y convierten sus respuestas en 4 oraciones con A2 y el constructor; las copian en la libreta (12 min).", "docente": "Modela la primera pregunta en la computadora del frente, recorre parejas y en MyClass revisa en vivo quién no ha hecho preguntas bien formadas para acompañarlo.", "conexion": "Libreta: 4 oraciones de Matilde y reflexión modelo; base de su línea del tiempo."}, {"momento": "después", "sesion": "S9", "minutos": 5, "alumno": "Juega A3.", "docente": "Sin preparación.", "conexion": "Plan de la línea del tiempo."}], "entrega": null, "semana": 3}, {"id": "E2-10", "titulo_en": "Writing my story", "titulo_es": "Escribo mi historia", "grado": "2°", "tarjeta": "2° · Past Simple (Lives We Remember)", "mes": "Noviembre", "semana_cal": 4, "habilita": "Sábado 31 de octubre", "modo": "casa", "sesion": "Antes de la S10 (avance) y después (entrega del borrador)", "objetivo": "Escribo los 4 momentos de la historia que investigué, en pasado y con una reflexión, eligiendo mi nivel de apoyo.", "aula": null, "articulo": [["Tu historia en 4 momentos", "Cuatro momentos con año o expresión de tiempo y una reflexión al final.", "avance"], ["Elige tu nivel", "A: marco completo · B: solo palabras clave · C: libre. Todos llegan a la misma meta por caminos distintos.", "avance"], ["Ejemplo: Don Pedro (personaje de práctica)", "In 1950, he was born in Zitlaltepec. In 1965, he worked in the fields. In 1972, he got married. In 2010, he opened a store. I think it is important to remember Don Pedro because he worked hard for his family. · Glosario: fields = el campo · got married = se casó · store = tienda · worked hard = trabajó mucho.", ""], ["Conectores", "then = después · after that = después de eso · in + año.", ""], ["Si tu tema viene de la revista", "Pasa los datos al inglés con tu banco de verbos; no copies párrafos. Anota número y página.", ""], ["Revisión entre pares", "Check the verb! Revisa con los criterios que definió el grupo en la S9.", "repaso"], ["Jingle Bells", "J. L. Pierpont, 1857, dominio público. El coro cuenta un paseo divertido en un trineo de un caballo.", ""]], "recursos": [{"tipo": "imagen", "id": "IMG-E2-10-1", "donde": "Las 4 imágenes de la línea de Don Pedro (mismo personaje que envejece)", "texto": "Prompt:\n```\nFour illustrations of the same Mexican man at different ages: as a baby in a small adobe house in 1950s rural central Mexico; as a teenager working in green corn fields; as a young man at a simple wedding; as an older man smiling at the door of his small corner store. Contemporary Latin American editorial illustration for a children's magazine, made by a professional illustrator: hand-painted digital gouache look with visible brush strokes, dry-brush and fine grain textures and a subtle paper texture; bold saturated palette of vermilion orange, marigold yellow, deep teal green and emerald, with small touches of pink and cream; lush stylized leaves and flowers framing the scene; characters built from simple rounded shapes, rosy cheeks, small dot eyes and expressive gestures; flat layered composition. Avoid glossy 3D render, airbrushed gradients, photorealism, generic clip art and plastic shine. No text, no letters, no numbers, no logos. Framing: cuadrado 1:1 cada una.\n```"}, {"tipo": "audio", "id": "AUD-E2-10-P", "donde": "Bloque del ejemplo de Don Pedro", "habla": "Profesor Arturo (tu voz)", "texto": "In 1950, he was born in Zitlaltepec. In 1965, he worked in the fields. In 1972, he got married. In 2010, he opened a store. I think it is important to remember Don Pedro because he worked hard for his family."}, {"tipo": "audio", "id": "AUD-E2-10-J", "donde": "Tarjeta de la canción", "habla": "Profesor Arturo (tu voz) cantando, o una grabación de dominio público (no comercial)", "texto": "Jingle bells, jingle bells, / Jingle all the way! / Oh, what fun it is to ride / In a one-horse open sleigh!"}], "interactivos": [{"tipo": "Línea del tiempo", "titulo": "La vida de Don Pedro", "contenido": {"cab": ["Fecha", "Oración (con audio)", "Significado"], "puntos": [["1950", "In 1950, he was born in Zitlaltepec.", "nació"], ["1965", "In 1965, he worked in the fields.", "trabajó en el campo"], ["1972", "In 1972, he got married.", "se casó"], ["2010", "In 2010, he opened a store.", "abrió una tienda"]], "extra": "", "funcionamiento": ""}}, {"tipo": "Tabla comparativa", "titulo": "Lo ay.", ["passed away ✓", "pass awayed", "passes away"]], ["He go to Mexico City in 1980.", ["went ✓", "goed", "goes"]]], "nota": ""}], "libreta": "Escribe tu borrador en la libreta con el nivel que elegiste.", "usos": [{"momento": "antes", "sesion": "S10", "minutos": 5, "alumno": "Lee el ejemplo de Don Pedro y la tabla de los tres niveles para decidir su nivel.", "docente": "En el paso «Borrador» de la S10 pregunta quién ya eligió nivel.", "conexion": "Notas de la entrevista y plan de la S9."}, {"momento": "después", "sesion": "S10", "minutos": 5, "alumno": "Sube la foto del borrador y juega A3.", "docente": "Revisa las fotos en MyClass y deja un comentario por alumno antes de la S11.", "conexion": "Borrador de la libreta."}], "entrega": {"que": "Foto de tu borrador: 4 momentos y reflexión, revisado por un compañero.", "como": "Botón «Subir foto» del subtema. Una foto por página, de frente y con luz. Hasta el día de tu S11. Sin dispositivo: muestras tu libreta en la S11.", "criterios": "Retroalimentación, no calificación: se revisa con las filas 1 a 3 de la rúbrica (Momentos en pasado · Reflexión · Orden y conectores; 2 / 1 / 0 cada una) para que mejores la versión final.", "importante": "Si usas revisión automática, queda oculta para el alumno hasta que tú la apruebes."}, "semana": 4}, {"id": "E2-11", "titulo_en": "Speak without reading: 4/3/2", "titulo_es": "Hablar sin leer: 4/3/2", "grado": "2°", "tarjeta": "2° · Past Simple (Lives We Remember)", "mes": "Noviembre", "semana_cal": 4, "habilita": "Sábado 31 de octubre", "modo": "casa", "sesion": "Antes de la S11 (avance) y después (entrega de la versión final)", "objetivo": "Cuento mi línea del tiempo sin leer, cada vez con más fluidez, para grabarla en clase.", "aula": null, "articulo": [["La técnica 4/3/2", "Cuentas lo mismo tres veces a tres personas distintas, cada vez con menos tiempo. En clase: 60, 45 y 30 segundos.", "avance"], ["¿Por qué funciona?", "Al repetir, ya no buscas las palabras: te concentras en decirlo. Con menos tiempo, hablas con más fluidez.", "avance"], ["Escucha a Don Pedro", "Un modelo de unos 35 segundos. Fíjate en los conectores: after that, then.", ""], ["La rúbrica de la grabación", "☐ 4 moments in the past ☐ correct -ed sounds ☐ no reading ☐ 45 – 60 seconds.", ""], ["Compara", "Escucha tu grabación y compárala con tu punto de partida de la S3: ¿qué mejoró?", "repaso"], ["Entrega", "Sube una foto de tu línea del tiempo final.", "repaso"]], "recursos": [{"tipo": "imagen", "id": "IMG-E2-11-1", "donde": "Encabezado del artículo", "texto": "Prompt:\n```\nThree pairs of students talking face to face in a classroom, three big friendly stopwatches floating above them showing shorter and shorter times, one student holding a phone to record. Mexican public secondary school students aged 12 to 13 in school uniforms, diverse and respectful, non-stereotyped. Contemporary Latin American editorial illustration for a children's magazine, made by a professional illustrator: hand-painted digital gouache look with visible brush strokes, dry-brush and fine grain textures and a subtle paper texture; bold saturated palette of vermilion orange, marigold yellow, deep teal green and emerald, with small touches of pink and cream; lush stylized leaves and flowers framing the scene; characters built from simple rounded shapes, rosy cheeks, small dot eyes and expressive gestures; flat layered composition. Avoid glossy 3D render, airbrushed gradients, photorealism, generic clip art and plastic shine. No text, no letters, no numbers, no logos. Framing: horizontal 16:9.\n```"}, {"tipo": "audio", "id": "AUD-E2-11-M", "donde": "Bloque «Escucha a Don Pedro»", "habla": "Profesor Arturo (tu voz)", "texto": "This is the story of Don Pedro. In 1950, he was born in Zitlaltepec. In 1965, he worked in the fields. After that, in 1972, he got married. Then, in 2010, he opened a store. I think it is important to remember Don Pedro because he worked hard for his family."}], "interactivos": [{"tipo": "Infografía", "titulo": "4/3/2 en clase", "contenido": [["Ronda 1", "60 segundos", "Compañero 1."], ["Ronda 2", "45 segundos", "Compañero 2."], ["Ronda 3", "30 segundos", "Compañero 3."]]}, {"tipo": "Herramienta", "titulo": "Cronómetro 60 · 45 · 30", "contenido": "Tres botones grandes; al terminar cada ronda suena una campana y aparece «¿Lo dijiste sin leer? Sí / Todavía no» (se registra para el docente)."}], "actividades": [{"id": "A1", "tipo": "escuchar y elegir", "titulo": "Escucha el modelo", "instrucciones": "Escucha a Don Pedro y responde.", "contenido": [["¿Cuándo nació Don Pedro?", ["In 1950 ✓", "In 1965", "In 1972"]], ["¿Qué hizo en 1972?", ["He got married. ✓", "He opened a store.", "He worked in the fields."]], ["¿Qué conector usa antes de 2010?", ["Then ✓", "Last", "Ago"]], ["¿Por qué es importante recordarlo?", ["He worked hard for his family. ✓", "He was a doctor.", "He lived in China."]]], "nota": ""}, {"id": "A2", "tipo": "completar espacios", "titulo": "Conectores", "instrucciones": "Completa con then, after, in o because.", "contenido": [["In 1950, he was born. ___, he worked in the fields.", "Then", "También vale After that."], ["___ that, he got married.", "After", ""], ["___ 2010, he opened a store.", "In", ""], ["It is important to remember him ___ he worked hard.", "because", ""]], "nota": ""}], "libreta": "Practica en voz alta con un reloj: 60, 45 y 30 segundos, con alguien de tu casa.", "usos": [{"momento": "antes", "sesion": "S11", "minutos": 5, "alumno": "Escucha el modelo y practica una vez con el cronómetro.", "docente": "En las «Tres rondas» de la S11 pide a quien practicó que modele la ronda 1.", "conexion": "Línea del tiempo de la libreta."}, {"momento": "después", "sesion": "S11", "minutos": 5, "alumno": "Sube la foto de su línea del tiempo final.", "docente": "Califica las fotos con las filas 1 a 3 de la rúbrica y apruébalas en MyClass.", "conexion": "Producto del proyecto."}], "entrega": {"que": "Foto de tu línea del tiempo  terminación correcta, o in + mes sin número.", "errores": [["in + número", "Con número de día va on: on March 3rd."], ["on + mes sin número", "Con el mes solo va in: in March."], ["terminación incorrecta", "{n} termina en {último dígito}: {n}{terminación correcta}. Recuerda: 11th, 12th y 13th."]], "reaccion": "Great! 🎉 My birthday is on January 9th."}, {"n": "K4", "kevin": "When is the Santo Jubileo? I want to visit! ✈️", "tipo": "opciones", "opciones": [["It's in October.", true, ""], ["It's on October.", false, "Con el mes solo va in: in October."], ["It's in Monday.", false, "Monday es un día de la semana. ¿En qué mes es el Santo Jubileo?"]], "reaccion": "October! Cool! 🎶"}, {"n": "K5", "kevin": "When is Day of the Dead? 🕯️", "tipo": "opciones", "opciones": [["It's on November 2nd.", true, ""], ["It's in November 2nd.", false, "Con fecha completa va on: on November 2nd."], ["It's on November 2th.", false, "2 termina en 2: 2nd."]], "reaccion": "In Chicago, we have Halloween on October 31st. 🎃"}, {"n": "K6", "kevin": "When do you play soccer? ⚽", "tipo": "opciones", "opciones": [["On Saturdays.", true, ""], ["I don't play soccer.", true, ""], ["In Saturday.", false, "Con días va on y el día con s: On Saturdays."]], "reaccion": "Si eligió On Saturdays: «Me too! I play soccer on Sundays. ⚽» (me too = yo también). Si eligió I don't play soccer: «OK! 🙂 I play soccer on Sundays.»"}, {"n": "K7", "kevin": "When is Christmas? 🎄", "tipo": "opciones", "opciones": [["It's on December 25th.", true, ""], ["It's in December 25th.", false, "Con fecha completa va on."], ["It's on December 25.", false, "Casi: falta la terminación: 25th."]], "reaccion": "Yes! 🎁"}, {"n": "K8", "kevin": "I want to visit you in October. What can I see? 🤔", "tipo": "opciones", "opciones": [["The Santo Jubileo!", true, ""], ["Day of the Dead!", false, "Day of the Dead es en November, no en October."], ["Christmas!", false, "Christmas es en December."]], "reaccion": "Yes! The Santo Jubileo! 🎉"}, {"n": "K9", "kevin": "Thank you, {nombre}! 🙌 See you in October! 👋", "tipo": "fin", "reaccion": "Pantalla de resumen: aciertos / intentos y «Nuevo intento»."}], "seguridad": "Antes de K1 aparece una tarjeta: «Kevin es un personaje de la clase. En la vida real no damos dirección, teléfono ni fotos a quien conocemos solo por chat.»"}, "CHAT-M": {"id": "CHAT-M", "grado": "2°", "subtema": "E2-09", "personaje": "Matilde Montoya (1859–1938), primera médica de México. Simulación con datos reales del libro (pp. 42–43).", "avatar": "FOTO-MATILDE", "reglas": ["Abajo del chat hay 9 tarjetas de pregunta. Cada tarjeta muestra dos versiones en desorden: una bien formada y una con error. El alumno toca una.", "Si toca la bien formada, Matilde responde. Si toca la de error, Matilde responde «Sorry, I don't understand. 🤔», debajo aparece la pista en español de esa tarjeta y la tarjeta se queda para volver a intentar.", "También hay un campo para escribir su propia pregunta (máximo 80 caracteres). Se responde por palabras clave (tabla de abajo).", "Aciertos = preguntas bien formadas; intentos = todas las preguntas enviadas.", "Al terminar (botón «Terminar entrevista»): pide convertir 2 respuestas en oraciones de línea del tiempo (In 1887, Matilde passed her exam.) y se guardan para el docente.", "Aviso fijo arriba: «Simulación con datos reales. Matilde Montoya vivió de 1859 a 1938.»"], "saludo": "Hello! I'm Matilde Montoya. 👋 I was the first female doctor in Mexico. Ask me questions with «did»!", "tarjetas": [{"n": "M1", "bien": "Where were you born?", "error": "Where you were born?", "respuesta": "I was born in Mexico City, on March 14th.", "pista": "Con were, primero were y después you: Where were you…?"}, {"n": "M2", "bien": "When did you learn to read?", "error": "When did you learned to read?", "respuesta": "I learned to read and write when I was four. 📖", "pista": "Con did, el verbo va en base: learn."}, {"n": "M3", "bien": "Did you study when you were young?", "error": "Did you studied when you were young?", "respuesta": "Yes, I did. When I was fourteen, I took courses at the Medicine school and I passed my midwife exam.", "pista": "Con did, el verbo va en base: study."}, {"n": "M4", "bien": "Where did you work?", "error": "Where did you worked?", "respuesta": "I worked as a midwife in Cuernavaca, in Morelos.", "pista": "Con did, el verbo va en base: work."}, {"n": "M5", "bien": "Did people say no?", "error": "Did people said no?", "respuesta": "Yes, they did. Many people said: «A woman can't be a doctor!» But I didn't stop. 💪", "pista": "Con did, el verbo va en base: say."}, {"n": "M6", "bien": "When did you pass your exam?", "error": "When did you passed your exam?", "respuesta": "I passed my exam on August 24th, 1887. 🎓", "pista": "Con did, el verbo va en base: pass."}, {"n": "M7", "bien": "Did someone help you?", "error": "Did someone helped you?", "respuesta": "Yes. The president, Porfirio Díaz, helped me. He was at my exam.", "pista": "Con did, el verbo va en base: help."}, {"n": "M8", "bien": "Were you the first female doctor?", "error": "Did you were the first female doctor?", "respuesta": "Yes, I was. I was the first female doctor in Mexico.", "pista": "Con was o were no se usa did: Were you…?"}, {"n": "M9", "bien": "When did you pass away?", "error": "When did you passed away?", "respuesta": "I passed away on January 26th, 1938.", "pista": "Con did, el verbo va en base: pass away."}], "respuesta_error": "Sorry, I don't understand. Can you ask with «did»? Did you…?", "respuesta_sin_dato": "I don't remember. 🤔 Look in your book, pages 42 and 43!", "despedida": "Thank you for your questions! Remember: study and don't stop. 💪", "palabras_clave": [["born", "M1"], ["read, write", "M2"], ["study, young, school", "M3"], ["work, job, midwife", "M4"], ["people, say no, said", "M5"], ["exam, pass your exam", "M6"], ["help", "M7"], ["first, doctor", "M8"], ["die, pass away", "M9"], ["bye, goodbye, thank you", "despedida"]], "detectar_error": "Si l /* ===== registro para el docente (se guarda en la hoja de MyClass a través del portal) ===== */
const REG = (function(){
  let cola = []; try{ cola = JSON.parse(localStorage.getItem('encarta_cola')||'[]'); }catch(e){}
  let enviando = false;
  function guardarCola(){ try{ localStorage.setItem('encarta_cola', JSON.stringify(cola.slice(-400))); }catch(e){} }
  const disp = (window.matchMedia && matchMedia('(pointer:coarse)').matches) ? 'celular' : 'computadora';
  function anota(tipo, datos){
    if (!S.c || MAESTRO) return;
    cola.push(Object.assign({t:tipo, f:new Date().toISOString(), d:disp}, datos||{})); guardarCola();
    if (cola.length >= 8) enviar();
  }
  function enviar(beacon){
    if (!PORTAL || !S.c || !cola.length || enviando) return;
    const lote = cola.slice(0, 40);
    const cuerpo = JSON.stringify({encarta:'ev', c:S.c, tk:S.tk, ev:lote});
    if (beacon && navigator.sendBeacon){ try{ if (navigator.sendBeacon(PORTAL, new Blob([cuerpo],{type:'text/plain'}))){ cola = cola.slice(lote.length); guardarCola(); } }catch(e){} return; }
    enviando = true;
    fetch(PORTAL, {method:'POST', mode:'no-cors', headers:{'Content-Type':'text/plain'}, body:cuerpo})
      .then(()=>{ cola = cola.slice(lote.length); guardarCola(); })
      .catch(()=>{}).finally(()=>{ enviando=false; if (cola.length) setTimeout(enviar, 3000); });
  }
  setInterval(()=>enviar(), 20000);
  document.addEventListener('visibilitychange', ()=>{ if (document.visibilityState==='hidden'){ TIEMPO.cerrar(); enviar(true); } });
  return { anota, enviar };
})();
/* minutos activos por subtema: solo cuenta si hubo actividad en el último minuto */
const TIEMPO = (function(){
  let sub = null, seg = 0, ult = 0;
  ['click','keydown','touchstart','scroll'].forEach(e=>document.addEventListener(e, ()=>{ ult = Date.now(); }, {passive:true, capture:true}));
  setInterval(()=>{ if (sub && document.visibilityState==='visible' && Date.now()-ult < 60000) seg += 15; }, 15000);
  function cerrar(){ if (sub && seg >= 15) REG.anota('tiempo', {s:sub, seg}); seg = 0; }
  return { entrar(id){ if (sub!==id){ cerrar(); sub = id; ult = Date.now(); } }, salir(){ cerrar(); sub = null; }, cerrar };
})();
function jsonp(params){
  return new Promise(res=>{
    if (!PORTAL) return res({ok:false, e:'SIN'});
    const cb = 'enc' + Date.now() + Math.floor(Math.random()*1000); const sc = document.createElement('script');
    const tm = setTimeout(()=>fin({ok:false,e:'RED'}), 15000);
    function fin(r){ clearTimeout(tm); delete window[cb]; sc.remove(); res(r); }
    window[cb] = fin; sc.onerror = ()=>fin({ok:false,e:'RED'});
    /* Google rechaza (error 400) el parámetro «c» con un código de 6 letras: el código viaja como «cod» */
    const q = Object.keys(params).map(k=>(k==='c'?'cod':k)+'='+encodeURIComponent(params[k])).join('&');
    sc.src = PORTAL + (PORTAL.indexOf('?')>=0?'&':'?') + q + '&cb=' + cb;
    document.body.appendChild(sc);
  });
}

/* karaoke aproximado: reparte la duración del mp3 entre las líneas según su largo */
function karaoke(ls, lineas){
  const a = sonando; if (!a) return;
  const tot = lineas.reduce((s,l)=>s+l.length,0);
  const marcar = ()=>{ const d = a.duration||0; if (!d) return; let acc=0; const t=a.currentTime; let k=-1;
    const ciclo = d > tot*0.11 && lineas.length>2 && d/(tot*0.075) > 1.7 ? 2 : 1; const dd = d/ciclo; const tt = t % dd;
    lineas.forEach((l,i)=>{ const ini=acc*dd/tot; acc+=l.length; if (tt>=ini) k=i; });
    ls.forEach((x,i)=>x.classList.toggle('on', i===k)); };
  a.addEventListener('timeupdate', marcar); a.addEventListener('ended', ()=>ls.forEach(x=>x.classList.remove('on')));
}

/* ----- E1-02: línea de la semana (on · from… to · until) ----- */
function lineaSemana(el,c,it,f){
  const dias = campoLista(c.campos.dias);
  const deck = ((f.interactivos||[]).find(x=>x.tipo==='Tarjetas que se voltean')||{}).contenido||[];
  const acts = deck.map(t=>{ const m = (t.ejemplo||'').match(/^(I|We|She|He)\b/); return {frase:t.palabra, suj:m?m[1]:'I', img:t.img}; });
  const ejemplos = campoLista(c.campos.ejemplos);
  let sel = null, modo = 'on', ini = null, puestos = [];
  const oracion = p => p.modo==='on' ? `${p.a.suj} ${p.a.frase} on ${dias[p.d1]}s.` : p.modo==='from' ? `${p.a.suj} ${p.a.frase} from ${dias[p.d1]} to ${dias[p.d2]}.` : `${p.a.suj} ${p.a.frase} until ${dias[p.d2]}.`;
  const dib = ()=>{
    el.innerHTML = `<div class="tip" style="margin-top:0">${mishi('idea')}<div>${ejemplos.map(x=>`<div>${esc(x)}</div>`).join('')}</div></div>
      <p class="ins">1) Elige una actividad. 2) Elige <b>on</b>, <b>from… to</b> o <b>until</b>. 3) Toca el día (o el primero y el último).</p>
      <div class="iconos">${acts.map((a,i)=>`<button data-a="${i}" class="${sel===i?'sel':''}" title="${esc(a.frase)}" aria-label="${esc(a.frase)}">${a.img?`<img src="${BASE}img/${a.img}.webp" alt="">`:esc(a.frase)}</button>`).join('')}</div>
      <p style="text-align:center;font-weight:900;min-height:24px">${sel!=null?esc(acts[sel].frase):''}</p>
      <div class="acciones" style="justify-content:center;margin-top:0">${[['on','● on'],['from','⟷ from… to'],['until','→| until']].map(([k,t])=>`<button class="chip ${modo===k?'sel':''}" data-m="${k}">${t}</button>`).join('')}</div>
      <div class="semana7" style="margin-top:12px">${dias.map((d,i)=>`<button class="d ${ini===i?'sobre':''}" data-d="${i}">${esc(d.slice(0,3))}${puestos.filter(p=>p.modo==='on'&&p.d1===i).map(p=>p.a.img?`<img src="${BASE}img/${p.a.img}.webp" alt="">`:`<span class="ev">${esc(p.a.frase)}</span>`).join('')}</button>`).join('')}
        ${puestos.filter(p=>p.modo!=='on').map(p=>`<div class="flecha" style="--a:${(p.modo==='from'?p.d1:0)+1};--b:${p.d2+2}">${p.modo==='until'?'→|':'⟷'} ${esc(p.a.frase)}</div>`).join('')}</div>
      <div id="frs" style="margin-top:12px">${puestos.slice().reverse().map(p=>`<div class="detalle">${bAud(oracion(p),null,.85)}<b>${esc(oracion(p))}</b></div>`).join('')}</div>
      ${puestos.length?`<div class="acciones"><button class="btn sec ch" id="bLim">Empezar de nuevo</button></div>`:''}`;
    $$('[data-a]',el).forEach(b=>b.onclick=()=>{ sel=+b.dataset.a; ini=null; fx('pop'); decir(acts[sel].frase,null,.85); dib(); });
    $$('[data-m]',el).forEach(b=>b.onclick=()=>{ modo=b.dataset.m; ini=null; fx('pop'); dib(); });
    $$('[data-d]',el).forEach(b=>b.onclick=()=>{ if (sel==null){ fx('no'); toast('Primero elige una actividad'); return; } const d=+b.dataset.d;
      let p=null;
      if (modo==='on') p={a:acts[sel], modo, d1:d};
      else if (modo==='until') p={a:acts[sel], modo, d2:d};
      else { if (ini==null){ ini=d; fx('pop'); dib(); return; } p={a:acts[sel], modo, d1:Math.min(ini,d), d2:Math.max(ini,d)}; if (p.d1===p.d2){ ini=null; fx('no'); toast('Elige otro día para el final'); dib(); return; } ini=null; }
      puestos = puestos.filter(x=>x.a!==p.a); puestos.push(p); fx('drop'); dib(); decir(oracion(p),null,.85); REG.anota('linea',{s:f.id, x:oracion(p)}); });
    const l=$('#bLim',el); if (l) l.onclick=()=>{ puestos=[]; sel=null; dib(); };
  }; dib();
}

  let oculto = false;
  el.innerHTML = `${foto}<div class="acciones" style="justify-content:center;margin-top:0"><button class="btn ch" id="bPlay">▶ Ver y escuchar</button><button class="btn sec ch" id="bTu">Ahora tú</button></div><div class="idanim" id="ls" style="margin-top:12px"></div>`;
  const pintarL = n => { $('#ls',el).innerHTML = ls.slice(0,n).map(l=>`<div class="l ${oculto?'oc':''}">${bAud(l,null,.9)}<span>${esc(l)}</span></div>`).join(''); };
  pintarL(0);
  $('#bPlay',el).onclick = function(){ oculto=false; pintarL(0); const b=this;
    if (mp){ decir(ls.join(' '), b, .9, mp); const a=sonando; const tot=ls.reduce((s,l)=>s+l.length,0); let n=0;

/* arrastrar con el dedo o el mouse (además de tocar) */
function arrastrable(chip, zonas, alSoltar){
  let fant=null, x0=0, y0=0, mov=false, sobre=null;
  chip.addEventListener('pointerdown', e=>{ if (e.button>0) return; x0=e.clientX; y0=e.clientY; mov=false; chip.setPointerCapture(e.pointerId); });
  chip.addEventListener('pointermove', e=>{
    if (!chip.hasPointerCapture || !chip.hasPointerCapture(e.pointerId)) return;
    if (!mov && Math.hypot(e.clientX-x0, e.clientY-y0) < 10) return;
    if (!mov){ mov=true; fx('pop'); fant=chip.cloneNode(true); const r=chip.getBoundingClientRect(); fant.style.cssText=`position:fixed;left:${r.left}px;top:${r.top}px;width:${r.width}px;z-index:99;pointer-events:none;opacity:.92;transform:scale(1.08) rotate(-2deg);box-shadow:0 12px 26px rgba(30,40,90,.3)`; document.body.appendChild(fant); chip.style.opacity='.3'; fant._dx=x0-r.left; fant._dy=y0-r.top; }
    fant.style.left=(e.clientX-fant._dx)+'px'; fant.style.top=(e.clientY-fant._dy)+'px';
    const z = zonas().find(z=>{ const r=z.getBoundingClientRect(); return e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom; });
    if (z!==sobre){ if (sobre) sobre.classList.remove('sobre','listo'); sobre=z; if (z) z.classList.add('sobre','listo'); }
  });
  const fin = e=>{ if (!mov) return; mov=false; if (fant) fant.remove(); fant=null; chip.style.opacity=''; if (sobre){ sobre.classList.remove('sobre','listo'); const z=sobre; sobre=null; chip._arrastrado=true; setTimeout(()=>chip._arrastrado=false,50); alSoltar(z); } };
  chip.addEventListener('pointerup', fin); chip.addEventListener('pointercancel', ()=>{ if (fant) fant.remove(); fant=null; chip.style.opacity=''; mov=false; });
}

function ctxRun(){
  return {
    stage:()=>$('#stage')||document.createElement('div'),
    total(n){ RUN.total=n; drawProg(); },
    begin(){ RUN.cur={help:0,tries:0}; },
    help(nombre){ if (RUN.cur) RUN.cur.help++; if (nombre){ RUN.helpsLog[nombre]=(RUN.helpsLog[nombre]||0)+1; P.ayudas[nombre]=(P.ayudas[nombre]||0)+1; } },
    miss(){ if (RUN.cur) RUN.cur.tries++; },
    fallo(q,r){ if (!RUN.fall.some(x=>x.q===q)) RUN.fall.push({q:String(q).slice(0,120), r:String(r).slice(0,80)}); },
    done(ok=true){ const c=RUN.cur||{help:0,tries:0}; const first=c.tries===0; const auto=ok&&first&&c.help===0;
      const sk = RUN.nivelSk || RUN.a.skill; RUN.items.push({ok,first,auto,help:c.help,sk}); RUN.cur=null; drawProg(); registrarReactivo(sk,auto,ok,first,c.help); },
    helps(list){ drawHelps(list); },
    finish(extra){ finishAct(extra||{}); }
  };
}
function drawProg(){ const p=$('#prog'); if(!p||!RUN) return; const n=RUN.total||0;
  p.innerHTML = Array.from({length:n},(_,i)=>{ const it=RUN.items[i]; return `<i class="${it?(it.auto?'auto':it.ok?'ok':'no'):i===RUN.items.length?'cur':''}"></i>`; }).join(''); }

  $$('[data-h]',hb).forEach(b=>b.onclick=()=>{ const h=list[+b.dataset.h]; if (h.count!==false) ctxRun().help(h.label); h.used=true; fx('pop'); h.fn(); drawHelps(list); });
}
const MSG_FIN = p => p.auto>=80 ? ['¡Lo hiciste casi todo sin ayuda!','Eso es autonomía: ya no necesitas que te lleven de la mano.']
  : p.first>=60 ? ['¡Muy bien!','La mayoría te salió a la primera. La próxima, intenta sin ayudas para ganar la tercera estrella.']

    <div class="acciones" style="justify-content:center"><button class="btn" id="bOtra">Play again<small>Nuevo intento</small></button><button class="btn sec" id="bSigA">${sig?'Next activity<small>Siguiente</small>':'Back<small>Volver al subtema</small>'}</button></div></div>`;

const ENGINES = {};
/* ---- elegir · escuchar y elegir ---- */

    const orden = mezclar(opts);
    const draw = ()=>{
      const st = c.stage(); if (!st) return;
      st.innerHTML = `${lectura?`<div class="lectura vid2">${String(lectura).split(/(?<=\.)\s+/).map(x=>`<span>${esc(x)}</span>`).join(' ')}</div>`:''}${isL?`<div class="escucha"><button class="speaker" id="spk" aria-label="Escuchar">${SPK}</button><div><div class="preg" style="margin:0">${shown?esc(aud||q):'Listen · Escucha'}</div><div class="nota">${shown?'Texto visible (usaste una ayuda)':'Toca la bocina. Puedes escuchar 2 veces gratis.'}</div></div></div>`
        :`<p class="preg">${negritas(q)} ${tieneIngles(sinMarcas(q))&&!/___/.test(q)&&!/^¿/.test(q)?bAud(sinMarcas(q)):''}</p>`}
        <div class="ops">${orden.map((o,j)=>(quitada && !isOk(o) && j===orden.findIndex(x=>!isOk(x)))?'':`<button class="op" data-o="${j}">${esc(clean(o))}</button>`).join('')}</div><div class="fbz"></div>`;
      const sp=$('#spk'); if (sp) sp.onclick=()=>{ plays++; if (plays>2) c.help('Escuchar más de 2 veces'); hablar(aud||q); };
      $$('.op',st).forEach(b=>b.onclick=()=>{
        const o = orden[+b.dataset.o];
        if (isOk(o)){ b.classList.add('ok'); fx('ok'); $$('.op',st).forEach(x=>x.disabled=true);
          $('.fbz',st).innerHTML = `<div class="fb ok">${mishi('feliz')}<span><b>Great job! · ¡Muy bien!</b>${aud&&!shown?` Dijo: <i>${esc(aud)}</i>`:''}</span></div><div class="acciones"><button class="btn ch" id="nx">Next<small>Siguiente</small></button></div>`;
          if (aud) hablar(aud); $('#nx').onclick=()=>{ c.done(true); i++; next(); }; }
        else { errs++; fx('no'); b.classList.add('no','sacude'); b.disabled=true; c.miss();
          if (errs>=2){ const k=orden.findIndex(isOk); $(`.op[data-o="${k}"]`,st)?.classList.add('luz'); c.fallo(aud||q, clean(opts.find(isOk)||'')); }
          $('.fbz',st).innerHTML = `<div class="fb no">${mishi('pensando')}<span><b>Next time · La próxima vez</b> ${esc(nota||'Vuelve a mirar o a escuchar con calma y elige otra opción.')}</span></div>`; }
      });
      c.helps([
        ...(isL?[{label:'Ver el texto',fn:()=>{ shown=true; draw(); }},{label:'Más lento',fn:()=>hablar(aud||q,true)}]:[]),

        ...(orden.length>2&&!quitada?[{label:'Quitar una opción',fn:()=>{ quitada=true; draw(); }}]:[])

    };

ENGINES.choice = (a,c)=>runChoice(a.c, c, false, ()=>c.finish(), a.nota, a.lectura);

/* ---- completar · dictado ---- */

/* ---- ordenar ---- */
function runOrder(items, c, onEnd, nota, titulo){

    if (i>=seqs.length) return onEnd();
