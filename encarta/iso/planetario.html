<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Planetario de la luna</title><style>
.iso{
  --anatomy-page:#0b0b0b;--anatomy-card:#131313;--anatomy-text:#a3a3a3;--anatomy-strong:#e6e6e6;--anatomy-muted:#6e6e6e;
  --anatomy-paper:#131313;--anatomy-face:#1b1b1b;--anatomy-top:#1c1c1c;
  --anatomy-shade-0:#0f0f0f;--anatomy-shade-1:#121212;--anatomy-shade-2:#151515;--anatomy-shade-3:#181818;
  --anatomy-lit-top:#262626;--anatomy-lit-shade:#1d1d1d;
  --anatomy-hi:#d4d4d4;--anatomy-mid:#6a6a6a;--anatomy-lo:#3e3e3e;--anatomy-faint:#2a2a2a;--anatomy-lit:#ffffff;
  --anatomy-halo:#050505;--anatomy-halo-opacity:.9;--anatomy-dot:#e6e6e6;
  --anatomy-red:#ff6b6b;--anatomy-green:#6be0a0;--anatomy-blue:#6b9bff;
  --anatomy-weight:.6px;--anatomy-ease:cubic-bezier(.32,.72,0,1);
  --anatomy-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --anatomy-lift:inset 0 1px 0 0 #ffffff0a,inset 0 0 0 1px #ffffff06,0 0 0 1px #00000026,0 1px 1px -.5px #00000014,0 3px 3px -1.5px #00000014,0 6px 6px -3px #00000014,0 12px 12px -6px #00000014;
}
.iso[data-theme="light"]{
  --anatomy-page:#f2f2ef;--anatomy-card:#fbfbfa;--anatomy-text:#57575a;--anatomy-strong:#18181a;--anatomy-muted:#8c8c90;
  --anatomy-paper:#fbfbfa;--anatomy-face:#ffffff;--anatomy-top:#ffffff;
  --anatomy-shade-0:#dcdcd9;--anatomy-shade-1:#e5e5e2;--anatomy-shade-2:#ededea;--anatomy-shade-3:#f4f4f1;
  --anatomy-lit-top:#ffffff;--anatomy-lit-shade:#eeeeeb;
  --anatomy-hi:#26262a;--anatomy-mid:#8a8a8f;--anatomy-lo:#b4b4b8;--anatomy-faint:#d4d4d6;--anatomy-lit:#000000;
  --anatomy-halo:#8a8a80;--anatomy-halo-opacity:.32;--anatomy-dot:#3a3a3e;
  --anatomy-red:#e5484d;--anatomy-green:#30a46c;--anatomy-blue:#3e63dd;
  --anatomy-lift:inset 0 1px 0 0 #ffffff,0 0 0 1px #0000000f,0 1px 1px -.5px #0000000a,0 3px 3px -1.5px #0000000a,0 6px 6px -3px #0000000a,0 12px 12px -6px #0000000a;
}
.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}
.iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
.iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}
.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}
.iso-top{fill:var(--anatomy-top)}
.iso-solid[data-lit]>.iso-top{fill:var(--anatomy-lit-top)}
.iso-solid[data-lit]>.iso-shade{fill:var(--anatomy-lit-shade)}
.iso-solid[data-seamless]>.iso-shade,.iso-solid[data-seamless]>.iso-top{stroke-width:.4;stroke-linejoin:round}
.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}
.iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}
.iso-solid[data-seamless]>.iso-shade[data-shade="3"]{stroke:var(--anatomy-shade-3)}
.iso-solid[data-seamless]>.iso-top{stroke:var(--anatomy-top)}
.iso-solid[data-seamless][data-lit]>.iso-top{stroke:var(--anatomy-lit-top)}
.iso-solid[data-seamless][data-lit]>.iso-shade{stroke:var(--anatomy-lit-shade)}
.iso-solid[data-lit]>.iso-edge{stroke:var(--anatomy-lit)}
.iso-halo{fill:var(--anatomy-halo);stroke:none;filter:blur(9px);opacity:var(--anatomy-halo-opacity);transform:translateY(3px)}
.iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}
.iso-line[data-flow]{stroke-dasharray:2 6}
.iso-wire-end{fill:var(--anatomy-paper);stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight)}
.iso-wire[data-tone="hi"] .iso-wire-end{stroke:var(--anatomy-hi)}
.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
.iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:var(--anatomy-hi)}
.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}

*{box-sizing:border-box}
html{color-scheme:dark}
body[data-theme="light"]{color-scheme:light}
body{margin:0;background:var(--anatomy-page);color:var(--anatomy-text);font:14px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.iso-page{width:min(650px,100% - 32px);margin:64px auto 96px}

const P = {"origin":[333.7756229351796,263.61777180747276],"scale":1.5416392146155597,"azimuth":60,"elevation":30};
const DAYS = 28, ORB = 58, LID = 35.5, GEAR_TOP = 39, GEAR_N = 40, GEAR_R = 21, PIN_N = 10, PIN_R = 5.25;
const PIN = [18.561553006146873,18.56155300614687], MESH = 0.7853981633974483, CRANK_L = 12, INDEX = 1.7453292519943295, DIAL_R = 17.2, HUB_R = 7.5, ARM_Z0 = 58.5, ARM_Z1 = 61.5;
const LIGHT = [-1,0,0];
const PHASE_RHO = 8;
const WIN = {"day":{"u0":-28,"u1":-8,"z0":11,"z1":25,"size":9,"pitch":12},"week":{"u0":-3,"u1":9,"z0":11,"z1":25,"size":9,"pitch":12}};
const AUDIO = {"newmoon":"AUD-P-new-moon","halfmoon":"AUD-P-half-moon","fullmoon":"AUD-P-full-moon","oneweek":"AUD-P-one-week","twoweeks":"AUD-P-two-weeks","threeweeks":"AUD-P-three-weeks","fourweeks":"AUD-P-four-weeks","onemonth":"AUD-P-one-month"};
const f2 = (n) => (Math.round(n * 100) / 100).toString();
function litPath(rho, lr, lw) {

function gearRing(cx, cy, n, rp, phase) {

function gearSolid(ring, cx, cy, z, h) {

    const j = (i + 1) % n, [ax, ay] = ring[i], [bx, by] = ring[j];
    const dx = bx - ax, dy = by - ay, len = Math.hypot(dx, dy) || 1, nx = dy / len, ny = -dx / len;
    const v = nx * vx + ny * vy > 1e-9 && ((ax + bx) / 2 - cx) * vx + ((ay + by) / 2 - cy) * vy > 0;

      const i = (start + s) % n, j = (i + 1) % n;
      if (!vis[i]) continue;

      run.push(bot[j]);

function bar(from, to, w, steps = 8) {

  const a = Math.atan2(to[1] - from[1], to[0] - from[0]);
  const ring = [];
  for (let i = 0; i <= steps; i++) { const t = a - Math.PI / 2 - (i / steps) * Math.PI; ring.push([from[0] + w * Math.cos(t), from[1] + w * Math.sin(t)]); }

function armRing(u) {

function dialTicks(u) {

  for (let i = 0; i < DAYS; i++) {
    const a = INDEX + (2 * Math.PI * (i - u)) / DAYS;
    const len = i === 0 ? 3.6 : i % 7 === 0 ? 3 : 1.6;
    const p0 = [(DIAL_R - len) * Math.cos(a), (DIAL_R - len) * Math.sin(a)];
    const p1 = [DIAL_R * Math.cos(a), DIAL_R * Math.sin(a)];

}
function gearHoles(u) {
  const g = gearPhase(u);
  return [0, 1, 2, 3].map((i) => { const a = g + (i * Math.PI) / 2 + Math.PI / 4; return ring(10.6 * Math.cos(a), 10.6 * Math.sin(a), 2.4, GEAR_TOP, P, 20); }).join("");

const gearPhase = (u) => MESH + Math.PI / GEAR_N - (2 * Math.PI * u) / DAYS;
const pinPhase = (u) => MESH + Math.PI + (4 * 2 * Math.PI * u) / DAYS;
const crankAngle = (u) => pinPhase(u) + Math.PI / 2 - MESH - Math.PI;
const moonAt = (u) => { const th = (2 * Math.PI * u) / DAYS; return [-ORB * Math.cos(th), ORB * Math.sin(th)]; };

/* the class's Moon lab boundaries, read on the Day number: from day 7 half moon, from 15 full moon, from 22 half moon */
const PHASES = [[1, "new moon"], [7, "half moon"], [15, "full moon"], [22, "half moon"]];
const phaseOf = (n) => PHASES.reduce((word, [from, w]) => (n >= from ? w : word), "new moon");
const NUM = ["one", "two", "three", "four"];
const dayOf = (u) => ((Math.round(u) % DAYS) + DAYS) % DAYS + 1;
function partsOf(u) {
  const n = dayOf(u), week = Math.floor((n - 1) / 7) + 1;
  return n === DAYS ? ["Day " + n, phaseOf(n), "four weeks = one month"] : ["Day " + n, phaseOf(n), "week " + week];
}

const stage = document.querySelector(".iso-stage"), svg = stage.querySelector("svg");
const readout = document.querySelector("[data-readout]");
const still = matchMedia("(prefers-reduced-motion: reduce)");
const back = svg.querySelector('[data-slot="back"]'), front = svg.querySelector('[data-slot="front"]');
const moon = svg.querySelector("[data-moon]"), moonMove = svg.querySelector("[data-moonmove]"), handle = svg.querySelector("[data-handle]");
const live = (name) => { const g = svg.querySelector('[data-live="' + name + '"]'); return { fill: g.querySelector(".iso-fill"), shades: [...g.querySelectorAll(".iso-shade")], top: g.querySelector(".iso-top"), crease: g.querySelector(".iso-crease"), bevel: g.querySelector(".iso-bevel"), edge: g.querySelector(".iso-edge") }; };
const GEAR = live("gear"), PINION = live("pinion"), CRANK = live("crank"), ARM = live("arm");
function setSolid(q, s) {
  q.fill.setAttribute("d", s.fill); s.shades.forEach((d, i) => q.shades[i].setAttribute("d", d || ""));
  q.top.setAttribute("d", s.top); q.crease.setAttribute("d", s.crease); q.bevel.setAttribute("d", s.bevel || ""); q.edge.setAttribute("d", s.outline);
}
const ticks = { minor: svg.querySelector('[data-ticks="minor"]'), major: svg.querySelector('[data-ticks="major"]'), zero: svg.querySelector('[data-ticks="zero"]') };
const holes = svg.querySelector("[data-holes]"), phase = svg.querySelector("[data-phase]");
const drums = { day: svg.querySelector('[data-drum="day"]'), week: svg.querySelector('[data-drum="week"]') };
const rowsOf = (g) => [...g.querySelectorAll("text")];
const dayRows = rowsOf(drums.day), weekRows = rowsOf(drums.week);

/* what the Earth sees: the moon's lit half (it faces the lamp) seen from the Earth's centre, looking at the moon */
function phaseFromEarth(u) {
  const th = 2 * Math.PI * u / DAYS;
  const m = [-Math.cos(th), Math.sin(th), 0];          // Earth → moon
  const right = [-m[1], m[0], 0];                      // the observer's right (z up)
  const lr = LIGHT[0] * right[0] + LIGHT[1] * right[1] + LIGHT[2] * right[2];
  const lw = -(LIGHT[0] * m[0] + LIGHT[1] * m[1] + LIGHT[2] * m[2]);
  return litPath(PHASE_RHO, lr, lw);
}
function rollDrum(rows, value, w, label) {
  const c = Math.floor(value), frac = value - c;
  rows.forEach((t, i) => { const row = i - 1; t.textContent = label(c + row); });
  rows[0].parentNode.setAttribute("transform", "translate(0 " + f2(-frac * w.pitch) + ")");
}
let u = 14, target = 14, vel = 0, slot = null, shown = "";
function paint() {
  setSolid(GEAR, gearSolid(gearRing(0, 0, GEAR_N, GEAR_R, gearPhase(u)), 0, 0, LID, GEAR_TOP - LID));
  setSolid(PINION, gearSolid(gearRing(PIN[0], PIN[1], PIN_N, PIN_R, pinPhase(u)), PIN[0], PIN[1], LID, GEAR_TOP - LID));
  const c = crankAngle(u), end = [PIN[0] + CRANK_L * Math.cos(c), PIN[1] + CRANK_L * Math.sin(c)];

  handle.setAttribute("transform", translateAlong(P, [end[0], end[1], 0]));
  const t = dialTicks(u); ticks.minor.setAttribute("d", t.minor); ticks.major.setAttribute("d", t.major); ticks.zero.setAttribute("d", t.zero);

  setSolid(ARM, extrude(armRing(u), ARM_Z0, ARM_Z1 - ARM_Z0, P, { bevel: 0.4 }));
  const [mx, my] = moonAt(u);
  moonMove.setAttribute("transform", translateAlong(P, [mx, my, 0]));
  const near = depthOf([mx, my, 0], P) > depthOf([0, 0, 0], P) ? front : back;
  if (near !== slot) { near.appendChild(moon); slot = near; }
  phase.setAttribute("d", phaseFromEarth(u));
  rollDrum(dayRows, u, WIN.day, (n) => String(((n % DAYS) + DAYS) % DAYS + 1));
  const w = Math.floor(u / 7) + Math.min(1, Math.max(0, (((u % 7) + 7) % 7) - 6));
  rollDrum(weekRows, w, WIN.week, (n) => String(((n % 4) + 4) % 4 + 1));

/* motion: the arm follows the target day at a calm, capped speed; a released drag clicks into the nearest day */
let frame = 0, last = 0, clock = 0, touring = !still.matches, visible = false, idle = 0, dragging = false, vmax = 7;
const TOUR = [0, 7, 14, 21, 27];
let tourI = 2;
const nextAt = (from, day) => { let t = Math.round(from); while ((((t % DAYS) + DAYS) % DAYS) !== day) t++; return t; };
function tick(now) {
  const dt = last ? Math.min((now - last) / 1000, 1 / 30) : 1 / 60; last = now;
  if (touring) { clock += dt; if (clock > 3) { clock = 0; tourI = (tourI + 1) % TOUR.length; target = nextAt(target + 0.01, TOUR[tourI]); } }
  if (still.matches) { u = target; vel = 0; }
  else {
    const diff = target - u;
    const want = Math.sign(diff) * Math.min(Math.abs(diff) / 0.18, dragging ? 40 : vmax);
    vel += (want - vel) * (1 - Math.exp(-dt / 0.12));
    u += vel * dt;
    if (Math.abs(target - u) < 0.002 && Math.abs(vel) < 0.05) { u = target; vel = 0; }
  }

  const settled = !touring && !dragging && u === target;

const run = () => { if (!frame && visible) { last = 0; frame = requestAnimationFrame(tick); } };

const step = (d) => goTo(Math.round(target) + d);

new IntersectionObserver((e) => { visible = e[e.length - 1].isIntersecting; if (visible) run(); }, { rootMargin: "120px 0px" }).observe(stage);

/* drag sideways anywhere on the figure: about 22 viewBox units per day (left turns back, right turns on) */
let x0 = 0, t0 = 0, perDay = 1;
stage.addEventListener("pointerdown", (ev) => {
  if (ev.button !== undefined && ev.button > 0) return;
  hold(); dragging = true; x0 = ev.clientX; t0 = Math.round(target); perDay = svg.getBoundingClientRect().width * 22 / 600;

stage.addEventListener("pointerup", release);
stage.addEventListener("pointercancel", release);
stage.addEventListener("keydown", (ev) => {
  const map = { ArrowRight: 1, ArrowUp: 1, ArrowLeft: -1, ArrowDown: -1, PageUp: 7, PageDown: -7 };
  if (ev.key in map) { ev.preventDefault(); step(map[ev.key] * (ev.shiftKey && Math.abs(map[ev.key]) === 1 ? 7 : 1)); return; }

document.querySelectorAll("[data-jump]").forEach((b) => b.addEventListener("click", () => jump(+b.dataset.jump)));

/* Listen: the readout in pieces with the Encarta's voice (new moon, half moon, full moon, four weeks, one month);
   the browser's voice only for a piece that has no mp3 ("Day 15", "week 3"). A new press cancels the old one. */
const AUDB = "https://teacherart.github.io/escaner/encarta/audio/";
const norm = (t) => t.toLowerCase().replace(/[^a-z0-9]/g, "");
let sonando = null, turno = 0;
function vozNav(t, fin) { try { const s = new SpeechSynthesisUtterance(t); s.lang = "en-US"; s.rate = .85; s.onend = fin; s.onerror = fin; speechSynthesis.speak(s); } catch (e) { fin(); } }
function pieza(t, mio, fin) {
  if (mio !== turno) return;
  const id = AUDIO[norm(t)];
  if (!id) { vozNav(t, () => setTimeout(fin, 60)); return; }
  const a = new Audio(AUDB + id + ".mp3"); sonando = a; let listo = false;
  const sig = () => { if (!listo) { listo = true; setTimeout(fin, 120); } };
  a.onended = sig; a.onerror = () => { if (!listo) { listo = true; vozNav(t, () => setTimeout(fin, 60)); } };
  a.play().catch(() => a.onerror());
}
document.querySelector("[data-listen]").addEventListener("click", () => {
  try { speechSynthesis.cancel(); } catch (e) {} if (sonando) { try { sonando.pause(); } catch (e) {} }
  const mio = ++turno;
  const pieces = partsOf(target).flatMap((p) => p.split(" = "));
  let i = 0; const sig = () => { if (mio !== turno || i >= pieces.length) return; pieza(pieces[i++], mio, sig); }; sig();
});
if (still.matches) touring = false;
paint();
stage.setAttribute("aria-valuetext", partsOf(u).join(", "));
