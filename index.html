<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#120E26">
<title>Camera scanner</title>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#120E26;color:#fff;font-family:Figtree,-apple-system,system-ui,sans-serif}
button{font:inherit;color:inherit;border:0;cursor:pointer}
.app{display:flex;flex-direction:column;gap:12px;min-height:100vh;padding:max(14px,env(safe-area-inset-top)) 16px 110px;max-width:620px;margin:0 auto}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.top h1{font-size:20px;font-weight:800;margin:0}
.top small{display:block;font-size:13px;opacity:.7;font-weight:600}
.cuenta{min-width:46px;height:46px;padding:0 10px;border-radius:23px;background:#7C5CFF;display:grid;place-items:center;font-weight:900;font-size:18px}
.modos{display:flex;background:rgba(255,255,255,.08);border-radius:999px;padding:4px}
.modos button{flex:1;padding:10px;border-radius:999px;font-weight:700;font-size:14px;background:none;opacity:.7}
.modos button.on{background:#fff;color:#120E26;opacity:1}
.video{position:relative;border-radius:26px;overflow:hidden;background:#000;aspect-ratio:3/4;max-height:58vh;width:100%}
.video video,.video canvas{position:absolute;inset:0;width:100%;height:100%}
.video video{object-fit:cover}
.marco{position:absolute;inset:10%;border:3px solid rgba(255,255,255,.85);border-radius:28px;pointer-events:none}
.msg{position:absolute;left:12px;right:12px;bottom:12px;text-align:center;font-size:14px;margin:0}
.res{border-radius:20px;padding:12px 16px;background:rgba(255,255,255,.1);transition:background .15s}
.res b{display:block;font-size:19px;font-weight:800}.res span{font-size:14px;opacity:.85}
.res.ok{background:#1F9D62}.res.mal{background:#E5484D}
.clave{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.clave span{font-size:14px;opacity:.8;margin-right:4px}
.clave button{width:46px;height:46px;border-radius:14px;background:rgba(255,255,255,.12);font-weight:900;font-size:18px}
.clave button.on{background:#1F9D62}
.barras{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.barra{background:rgba(255,255,255,.08);border-radius:14px;padding:8px;text-align:center;font-weight:800}
.barra.ok{background:#1F9D62}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:6px}
.tile{height:54px;border-radius:12px;background:rgba(255,255,255,.1);font-weight:800;font-size:15px;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05}
.tile small{font-size:9px;font-weight:600;opacity:.8;max-width:50px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.tile.on{background:#1F9D62}.tile.mal{background:#E5484D}
.tile i{position:absolute;top:-5px;right:-5px;min-width:20px;height:20px;border-radius:10px;background:#7C5CFF;font-style:normal;font-size:12px;display:grid;place-items:center}
.nota{font-size:13px;opacity:.7;margin:0}
.btns{display:flex;gap:10px;position:fixed;left:0;right:0;bottom:0;padding:12px 16px max(14px,env(safe-area-inset-bottom));background:linear-gradient(transparent,#120E26 35%);max-width:620px;margin:0 auto}
.btns button{flex:1;padding:16px;border-radius:999px;font-weight:800;font-size:16px}
.ok-btn{background:#7C5CFF}.sec{background:#2A2545}
</style>
</head>
<body>
<div class="app">
  <div class="top"><div><h1 id="titulo">Scanner</h1><small id="sub"></small></div><div class="cuenta" id="cuenta">0</div></div>
  <div class="modos" id="modos"><button data-m="tarjetas">Big cards</button><button data-m="qr">QR codes</button></div>
  <div class="video"><video id="vid" playsinline muted></video><canvas id="capa"></canvas><div class="marco" id="marco"></div><p class="msg" id="msg">Starting camera…</p></div>
  <div class="res" id="res"><b>Ready</b><span>Point the camera at the cards</span></div>
  <div id="quiz" hidden>
    <div class="clave"><span>Correct answer:</span><button data-k="A">A</button><button data-k="B">B</button><button data-k="C">C</button><button data-k="D">D</button></div>
    <div class="barras" id="barras" style="margin-top:10px"></div>
  </div>
  <p class="nota" id="ayuda">Green numbers are already scanned. Tap a number to add or remove it by hand.</p>
  <div class="tiles" id="tiles"></div>
  <div class="btns"><button class="sec" id="cancelar">Cancel</button><button class="ok-btn" id="terminar">Finish and save</button></div>
</div>
<script>

  function hamming(a, b) { var n = 0; for (var i = 0; i < 25; i++) if (a[i] !== b[i]) n++; return n; }

      pts.forEach(function (p) { var d = vx * (p[1] - a[1]) - vy * (p[0] - a[0]); if (d > m1) { m1 = d; c1 = p; } if (-d > m2) { m2 = -d; c2 = p; } });

(function () {
  var fuente = location.hash.length > 1 ? location.hash.slice(1) : location.search.slice(1);
  var q = new URLSearchParams(fuente);
  var modo = q.get('m') || 'asis', gid = q.get('g') || '', act = q.get('a') || '', ret = q.get('r') || '', t = q.get('t') || String(Date.now());
  var nombres = { asis: 'Attendance', part: 'Participation', act: 'Turned in', quiz: 'Quiz' };
  document.getElementById('titulo').textContent = nombres[modo] || 'Scanner';
  document.getElementById('sub').textContent = (q.get('l') || '') + (q.get('x') ? ' · ' + q.get('x') : '') + (modo === 'part' ? ' · each scan adds 1' : '');
  var porCodigo = {}, porNum = {}, orden = [];
  (q.get('n') || '').split(',').forEach(function (p) {
    var x = p.split(':'); if (!x[0]) return;
    var al = { code: x[0], num: x[1], nom: x[2] ? decodeURIComponent(x[2]) : '' };
    porCodigo[al.code] = al; porNum[String(Number(al.num))] = al; orden.push(al);
  });
  var conteo = {}, respuesta = {}, ultimo = {}, total = 0, clave = '';
  var metodo = modo === 'quiz' ? 'tarjetas' : (localStorage.getItem('metodo') || 'tarjetas');
  if (modo === 'quiz') { document.getElementById('modos').hidden = true; document.getElementById('quiz').hidden = false; document.getElementById('ayuda').textContent = 'Students turn the card so their answer letter is on top. Answers update live.'; }
  function ponerMetodo(m) {
    metodo = m; localStorage.setItem('metodo', m);
    document.querySelectorAll('#modos button').forEach(function (b) { b.classList.toggle('on', b.dataset.m === m); });
    document.getElementById('marco').hidden = m === 'tarjetas';
    aviso2('Ready', m === 'tarjetas' ? 'Point the camera at the cards, several at once is fine' : 'Show a QR code inside the frame');
  }
  document.querySelectorAll('#modos button').forEach(function (b) { b.onclick = function () { ponerMetodo(b.dataset.m); }; });
  document.querySelectorAll('.clave button').forEach(function (b) { b.onclick = function () { clave = clave === b.dataset.k ? '' : b.dataset.k; document.querySelectorAll('.clave button').forEach(function (x) { x.classList.toggle('on', x.dataset.k === clave); }); pintar(); }; });
  var tiles = document.getElementById('tiles');
  function pintar() {
    tiles.innerHTML = '';
    var cuenta = { A: 0, B: 0, C: 0, D: 0 };
    orden.forEach(function (al) {
      var b = document.createElement('button'), c = al.code, r = respuesta[c];
      var on = modo === 'quiz' ? !!r : !!conteo[c];
      b.className = 'tile' + (on ? (modo === 'quiz' && clave && r !== clave ? ' mal' : ' on') : '');
      b.innerHTML = '<span></span><small></small>'; b.firstChild.textContent = modo === 'quiz' && r ? al.num + ' ' + r : al.num; b.lastChild.textContent = al.nom;
      if (modo === 'part' && conteo[c] > 1) { var i = document.createElement('i'); i.textContent = conteo[c]; b.appendChild(i); }
      if (r) cuenta[r]++;

        if (modo === 'quiz') { var o = ['A', 'B', 'C', 'D', undefined], k = o.indexOf(respuesta[c]); respuesta[c] = o[(k + 1) % 5]; if (!respuesta[c]) delete respuesta[c]; }
        else if (conteo[c] && modo !== 'part') delete conteo[c]; else conteo[c] = (conteo[c] || 0) + 1;
        total = Object.keys(conteo).reduce(function (s, k) { return s + conteo[k]; }, 0); actualizar();
      };
      tiles.appendChild(b);
    });
    if (modo === 'quiz') {
      document.getElementById('barras').innerHTML = ['A', 'B', 'C', 'D'].map(function (k) { return '<div class="barra' + (clave === k ? ' ok' : '') + '">' + k + ' · ' + cuenta[k] + '</div>'; }).join('');
    }
  }
  function actualizar() {
    document.getElementById('cuenta').textContent = modo === 'quiz' ? Object.keys(respuesta).length + '/' + orden.length : modo === 'part' ? total : Object.keys(conteo).length;
    pintar();
  }
  var audio = null;
  function sonar(ok) {
    try { audio = audio || new (window.AudioContext || window.webkitAudioContext)(); var o = audio.createOscillator(), g = audio.createGain(); o.frequency.value = ok ? 880 : 220; g.gain.value = .08; o.connect(g); g.connect(audio.destination); o.start(); o.stop(audio.currentTime + (ok ? .08 : .25)); } catch (e) { }
    if (navigator.vibrate) navigator.vibrate(ok ? 30 : [80, 60, 80]);
  }
  function aviso2(a, b, cls) { var r = document.getElementById('res'); r.className = 'res' + (cls ? ' ' + cls : ''); r.innerHTML = '<b></b><span></span>'; r.firstChild.textContent = a; r.lastChild.textContent = b || ''; }
  function registrar(al, resp) {
    var c = al.code, ahora = Date.now();
    if (modo === 'quiz') {
      if (respuesta[c] !== resp) { respuesta[c] = resp; sonar(true); aviso2('No. ' + al.num + ' ' + al.nom, 'Answer ' + resp, 'ok'); actualizar(); }
      return;
    }
    if (ultimo[c] && ahora - ultimo[c] < (modo === 'part' ? 4000 : 2500)) return; ultimo[c] = ahora;
