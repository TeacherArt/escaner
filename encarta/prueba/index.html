    const vert = pieces.some(p=>p.split(' ').length>4);
    const pool = mezclar(pieces.concat(s.trampa?[s.trampa]:[]).map((w,k)=>({w,k}))); let pick=[]; c.begin(); let tries=0;
    const pieza = (o, attr, cls) => tren ? `<button class="vagon ${cls||''}" ${attr} style="background:${COLORES_TREN[o.k%12]}">${esc(o.w)}</button>` : `<button class="chip ${cls||''}" ${attr}>${esc(o.w)}</button>`;

        <div class="pool ${tren?'tren':''}">${pool.map((p,j)=>pick.includes(p)?'':pieza(p,`data-p="${j}"`)).join('')}</div></div>
        <div class="acciones"><button class="btn ch" id="chk" ${pick.length<pieces.length?'disabled':''}>Check<small>Revisar</small></button><button class="btn sec ch" id="lis">Listen<small>Escuchar</small></button></div><div class="fbz">${msg}</div>`;
      const meta = $('.meta-l',st);
      $$('[data-p]',st).forEach(b=>{ const o=pool[+b.dataset.p]; b.onclick=()=>{ if (b._arrastrado) return; fx('pop'); pick.push(o); if (!vert && /^[A-Za-z]/.test(o.w)) decir(o.w,null,.9); draw(); }; arrastrable(b, ()=>[meta], ()=>{ fx('pop'); pick.push(o); draw(); }); });
      $$('[data-r]',st).forEach(b=>b.onclick=()=>{ fx('drop'); pick = pick.slice(0, +b.dataset.r); draw(); });
      $('#lis').onclick=()=>hablar(pick.map(p=>p.w).join(' ')||pieces.join(' '));
      $('#chk').onclick=()=>{
        const bien = pick.map(p=>p.w).join('|')===pieces.join('|'); const frase1 = vert ? pieces.join(' ') : frase(pieces)+end;

        else { tries++; c.miss(); fx('no'); const trap = s.trampa && pick.some(p=>p.w===s.trampa);
          if (tries>=3){ c.fallo(pieces.join(' '), frase1); draw(`<div class="fb no">${mishi('idea')}<span><b>Next time · La próxima vez</b> Así queda: <b>${esc(frase1)}</b></span></div><div class="acciones"><button class="btn ch" id="nx">Next<small>Siguiente</small></button></div>`); $('#chk').disabled=true; $('#nx').onclick=()=>{ c.done(false); i++; next(); }; }
          else { const k = pick.findIndex((p,j)=>p.w!==pieces[j]); pick = pick.slice(0, Math.max(0,k)); draw(`<div class="fb no">${mishi('pensando')}<span><b>Casi.</b> ${trap?`<b>${esc(s.trampa)}</b> es una pieza trampa: sobra.`:esc(nota||'Revisa el orden: quién, qué hace y cuándo.')}${k>0?' Las primeras '+k+' piezas estaban bien.':''}</span></div>`); } }
      };
      c.helps([{label:'Poner la primera pieza',fn:()=>{ const f1=pool.find(p=>p.w===pieces[0]); pick=[f1]; draw(); }}, ...(nota?[{label:'Pista',fn:()=>{ $('.fbz',st).innerHTML=`<div class="fb no">${mishi('idea')}<span><b>Pista</b> ${esc(nota)}</span></div>`; }}]:[])]);
    };
    draw();
  };
  next();
}
ENGINES.order = (a,c)=>{ const items = (Array.isArray(a.c) && typeof a.c[0]==='string') ? [a.c] : (a.c && a.c.series) ? a.c.series.map((s,i)=>({orden:s, trampa:(a.c.trampas||[])[i]||null})) : a.c; runOrder(items, c, ()=>c.finish(), a.nota, a.titulo); };

/* ---- sopa de letras ---- */
ENGINES.soup = (a,c)=>{
  const {palabras, filas, posiciones} = a.c; const hall=new Set(); let ini=null; c.total(palabras.length);
  const celdasDe = w => { const [r,col,dir]=posiciones[w]; return [...w.toUpperCase()].map((_,k)=>dir==='→'?[r-1,col-1+k]:[r-1+k,col-1]); };
  const draw=(pista=null)=>{ const st=c.stage(); const fc=new Set([...hall].flatMap(w=>celdasDe(w).map(x=>x.join(','))));
    st.innerHTML = `<p class="muted" style="font-size:14px;font-weight:700;margin-top:0">Toca la primera letra y luego la última (→ o ↓).</p><div class="sopa" style="grid-template-columns:repeat(${filas[0].length},1fr)">${filas.map((f,r)=>[...f].map((ch,k)=>`<button data-rc="${r},${k}" class="${fc.has(r+','+k)?'f':''} ${(ini&&ini[0]===r&&ini[1]===k)||(pista&&pista[0]===r&&pista[1]===k)?'s':''}">${ch}</button>`).join('')).join('')}</div><div class="palabras">${palabras.map(p=>`<span class="${hall.has(p)?'f':''}">${esc(p)}</span>`).join('')}</div>`;
    $$('[data-rc]',st).forEach(b=>b.onclick=()=>{ const [r,k]=b.dataset.rc.split(',').map(Number);
      if (!ini){ ini=[r,k]; c.begin(); fx('pop'); draw(); return; }
      const w = palabras.find(p=>!hall.has(p) && (()=>{ const cs=celdasDe(p); return cs[0][0]===ini[0]&&cs[0][1]===ini[1]&&cs[cs.length-1][0]===r&&cs[cs.length-1][1]===k; })());
      ini=null; if (w){ hall.add(w); fx('ok'); decir(w,null,.9); c.done(true); draw(); if (hall.size===palabras.length) setTimeout(()=>c.finish(),500); } else { c.miss(); fx('no'); draw(); } });
    c.helps([{label:'Mostrar dónde empieza',fn:()=>{ const w=palabras.find(x=>!hall.has(x)); if (w) draw(celdasDe(w)[0]); }}]);
  }; draw();
};

/* ---- Escríbelo (Writing): lista que revisa y «Send to my teacher» ---- */
function ordOk(text){ const ms=[...text.matchAll(/\b(\d{1,2})(st|nd|rd|th)\b/g)]; if (!ms.length) return false; return ms.every(m=>{ const n=+m[1], s=m[2]; const t=n%100>=11&&n%100<=13?'th':n%10===1?'st':n%10===2?'nd':n%10===3?'rd':'th'; return s===t; }); }
function checkRule(r, text){
  try {
    if (r.t==='re') return new RegExp(r.p, r.f).test(text);
    if (r.t==='cnt') return (text.match(new RegExp(r.p, (r.f||'')+'g'))||[]).length>=r.n;
    if (r.t==='sent') return text.split(/[.!?]+/).map(s=>s.trim()).filter(s=>s.split(/\s+/).length>=2).length>=r.n;
    if (r.t==='distinct') return new Set(r.list.filter(w=>new RegExp('\\b'+w+'\\b','i').test(text))).size>=r.n;
    if (r.t==='ord') return ordOk(text);
    if (r.t==='nodid') return !/\bdid\s+(\w+\s+)?(\w+ed|went|ate|saw|had|made|got|took|bought|came|said|was|were)\b/i.test(text);
  } catch(e){}
  return false;
}
function enviarTrabajo(f, a, tipo, texto, rev){
  const id = (S.c||'X')+'-'+f.id+'-'+a.id+'-'+Date.now().toString(36);
  P.trabajos = P.trabajos||{}; P.trabajos[f.id+'/'+a.id] = {id, f:hoyISO(), texto}; guardarP();
  REG.anota('trabajo',{s:f.id, a:a.id});
  if (!PORTAL || !S.c) return;
  try { fetch(PORTAL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify({encarta:'tr', c:S.c, tk:S.tk, id, s:f.id, a:a.id, tipo, texto, rev})}).catch(()=>{}); } catch(e){}
}
function estadoTrabajo(f, a){
  const loc = (P.trabajos||{})[f.id+'/'+a.id]; const srv = (P.trabajosSrv||{})[f.id+'/'+a.id];
  if (srv && srv.estado==='aprobado') return `<div class="fb ok">${mishi('corazones')}<span><b>Tu profesor aprobó tu texto.</b>${srv.nota?' '+esc(srv.nota):''}</span></div>`;
  if (srv && srv.estado==='corregir') return `<div class="fb no">${mishi('idea')}<span><b>Tu profesor te pide revisar:</b> ${esc(srv.nota||'Revisa tu texto y envíalo otra vez.')}</span></div>`;
  if (loc || srv) return `<div class="fb ok">${mishi('normal')}<span><b>Enviado a tu profesor.</b> Lo verás aquí cuando lo revise.</span></div>`;
  return '';
}
ENGINES.write = (a,c)=>{
  const w=a.c, f=RUN.f; c.total(1); c.begin(); let checks=0, modelo=false; const prev=(P.trabajos||{})[f.id+'/'+a.id];

    st.innerHTML = `<div class="escribe"><p class="preg" style="font-size:18px">${esc(w.prompt)}</p>
      <p class="nota">Usa solo tu nombre de pila. Nada de dirección, teléfono ni datos de tu familia: si quieres, inventa un personaje.</p>
      <textarea class="hueco area" id="tx" placeholder="Escribe aquí en inglés…" spellcheck="false">${esc(text)}</textarea>
      <div><b>Lista para revisar tu texto</b><div class="rules">${w.rules.map((r,j)=>`<div class="${res?(res[j]?'y':'n'):''}"><i>${res?(res[j]?'✓':'·'):j+1}</i><span>${esc(r.label)}</span></div>`).join('')}</div></div>
      ${modelo?`<div class="tip">${mishi('idea')}<div><b>MODELO</b><span style="white-space:pre-line">${esc(w.model)}</span><br><small>Úsalo como guía, pero escribe con tus propios datos.</small></div></div>`:''}
      <div class="acciones"><button class="btn ch" id="chk">Check<small>Revisar</small></button><button class="btn sec ch" id="lis">Listen<small>Escuchar mi texto</small></button></div><div class="fbz">${estadoTrabajo(f,a)}</div></div>`;
    $('#lis').onclick=()=>{ const t=$('#tx').value.trim(); if (t) decir(t,null,.9); };
    $('#chk').onclick=()=>{ const t=$('#tx').value.trim(); if (t.split(/\s+/).length<3){ toast('Escribe un poco más'); return; } checks++; const r=w.rules.map(x=>checkRule(x,t)); const todo=r.every(Boolean);
      draw(t, r);
      if (todo){ fx('ok'); $('.fbz',st).innerHTML = `<div class="fb ok">${mishi('estrellas')}<span><b>¡Tu texto cumple la lista!</b> ${checks===1&&!modelo?'Y a la primera, sin ver el modelo.':'Revisar y corregir es lo que hacen los buenos escritores.'}</span></div>
          <div class="acciones"><button class="btn ch" id="env">Send to my teacher<small>Enviar a mi profesor</small></button><button class="btn sec ch" id="fin">Finish<small>Terminar sin enviar</small></button></div>`;

        $('#fin').onclick=cerrar; }
      else { fx('no'); $('.fbz',st).innerHTML = `<div class="fb no">${mishi('pensando')}<span><b>Next time · La próxima vez</b> Te falta lo que tiene punto (·) en la lista. Corrige y vuelve a revisar.</span></div>`; } };
    c.helps([{label:'Ver un modelo',fn:()=>{ modelo=true; draw($('#tx').value, res); }}]);
  };
  draw(prev?prev.texto:'');
};

/* ---- chats (Kevin, Matilde, abuela Chayo): guion fijo, sin texto libre de datos ---- */
const DAYS_EN=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'], MONTHS_EN=['January','February','March','April','May','June','July','August','September','October','November','December'];
ENGINES.chat = (a,c)=>{ const ch=E2.chats[a.chat]; if (!ch){ c.stage().innerHTML='<p class="muted">Este chat se abre pronto.</p>'; return; } ({'CHAT-K':chatK,'CHAT-M':chatM,'CHAT-C':chatC})[a.chat](ch,c,a); };
function chatShell(aviso, foto){ return `<div class="tip" style="margin-top:0">${mishi('idea')}<div>${esc(aviso)}</div></div><div class="chat" id="chat"></div><div id="ctl" class="ctl"></div>`; }
function addMsg(who, t, cls=''){ const ch=$('#chat'); if (!ch) return; ch.insertAdjacentHTML('beforeend', `<div class="msg ${cls==='me'?'yo':cls==='tip'?'pista':'el'}"><span class="mt">${who?`<b class="who">${esc(who)}</b>`:''}${esc(t)}</span>${cls!=='tip'&&cls!=='me'&&tieneIngles(t)?' '+bAud(t.replace(/[\u{1F300}-\u{1FAFF}☀-➿]/gu,'').trim()):''}</div>`); ch.scrollTop=ch.scrollHeight; }
function chatK(ch, c){
  const now=new Date(), dReal=DAYS_EN[now.getDay()], mReal=MONTHS_EN[now.getMonth()], otro=mezclar(DAYS_EN.filter(x=>x!==dReal))[0]; let nombre='';
  const fill = s=>String(s).replace('{día real}',dReal).replace('{mes real}',mReal).replace('{otro día}',otro).replace('{nombre}',nombre||'friend');
  const nodos = ch.nodos.filter(n=>n.tipo!=='escribir'&&n.tipo!=='fin'); c.total(nodos.length);
  c.stage().innerHTML = chatShell('Kevin es un personaje de la clase. En la vida real no damos dirección, teléfono ni fotos a quien conocemos solo por chat.');
  let k=0;
  const step=()=>{ const n=ch.nodos[k]; if (!n) return c.finish();
    addMsg('Kevin', fill(n.kevin)); const ctl=$('#ctl');
    if (n.tipo==='escribir'){ ctl.innerHTML = `<form class="fila-chat"><input class="hueco" id="nm" maxlength="20" placeholder="I'm ___." autocomplete="off"><button class="btn ch">Send<small>Enviar</small></button></form>`;
      $('form',ctl).onsubmit=e=>{ e.preventDefault(); const v=$('#nm').value.replace(/[^A-Za-zÁÉÍÓÚáéíóúÑñ\s]/g,'').trim().split(/\s+/).pop(); if (!v) return; nombre=v.slice(0,20); addMsg('Yo',"I'm "+nombre+'.','me'); addMsg('Kevin',fill(n.reaccion)); k++; step(); }; c.helps([]); return; }
    if (n.tipo==='fin'){ ctl.innerHTML=''; return setTimeout(()=>c.finish(),900); }
    c.begin(); let errs=0;
    if (n.tipo==='opciones'){ const ops=mezclar(n.opciones);
      const draw=()=>{ ctl.innerHTML = `<div class="ops">${ops.map((o,j)=>`<button class="op ${errs>=2&&o[1]?'luz':''}" data-o="${j}">${esc(fill(o[0]))}</button>`).join('')}</div>`;
        $$('[data-o]',ctl).forEach(b=>b.onclick=()=>{ const o=ops[+b.dataset.o]; addMsg('Yo',fill(o[0]),'me');
          if (o[1]){ fx('ok'); addMsg('Kevin',fill(n.reaccion)); c.done(true); k++; step(); } else { errs++; c.miss(); fx('no'); addMsg('Kevin','Hmm… 🤔'); addMsg('',fill(o[2]),'tip'); if (errs>=2) c.fallo(fill(n.kevin), fill((ops.find(x=>x[1])||[''])[0])); draw(); } }); };
      draw(); c.helps([]); }
    if (n.tipo==='selector'){
      ctl.innerHTML = `<div class="cons"><div class="fichas" style="align-items:center"><b>My birthday is</b><select id="p"><option>in</option><option>on</option></select><select id="m">${MONTHS_EN.map(x=>`<option>${x}</option>`).join('')}</select><select id="n"><option value="">(sin número)</option>${Array.from({length:31},(_,i)=>`<option>${i+1}</option>`).join('')}</select><select id="s"><option></option><option>st</option><option>nd</option><option>rd</option><option>th</option></select><button class="btn ch" id="snd">Send<small>Enviar</small></button></div></div>`;
      $('#snd').onclick=()=>{ const p=$('#p').value, m=$('#m').value, nn=$('#n').value, s=$('#s').value; const txt=`My birthday is ${p} ${m}${nn?' '+nn+s:''}.`; addMsg('Yo',txt,'me');
        let err=null; if (nn&&p==='in') err=n.errores[0][1]; else if (!nn&&p==='on') err=n.errores[1][1];
        else if (nn){ const v=+nn; const t=v%100>=11&&v%100<=13?'th':v%10===1?'st':v%10===2?'nd':v%10===3?'rd':'th'; if (s!==t) err=`${nn} termina en ${nn.slice(-1)}: ${nn}${t}. Recuerda: 11th, 12th y 13th.`; }
        else if (s) err='Sin número no va terminación: in '+m+'.';
        if (err){ c.miss(); fx('no'); addMsg('Kevin','Hmm… 🤔'); addMsg('',err,'tip'); } else { fx('ok'); addMsg('Kevin',n.reaccion); c.done(true); k++; step(); } };
      c.helps([{label:'Pista',fn:()=>addMsg('',n.validacion,'tip')}]); }
  };
  step();
}
function chatM(ch, c, a){

      <form class="fila-chat"><input class="hueco" id="own" maxlength="80" placeholder="Did you…?" autocomplete="off"><button class="btn ch">Ask<small>Preguntar</small></button></form>${quedan.size<=cards.length-3?`<button class="btn sec ch" id="end">Terminar entrevista<small>Finish</small></button>`:''}`;
    $$('[data-c]',ctl).forEach(b=>b.onclick=()=>{ const i=+b.dataset.c, cd=cards[i]; addMsg('Yo',b.textContent,'me'); if (!RUN.cur) c.begin();
      if (b.dataset.ok==='1'){ fx('ok'); addMsg('Matilde',cd.respuesta); c.done(true); quedan.delete(i); resp.push(cd.respuesta); } else { fx('no'); c.miss(); addMsg('Matilde',ch.respuesta_error); addMsg('',cd.pista,'tip'); }

    $('form',ctl).onsubmit=e=>{ e.preventDefault(); const q=$('#own').value.trim(); if (!q) return; addMsg('Yo',q,'me'); $('#own').value=''; REG.anota('pregunta',{s:RUN.f.id, x:q.slice(0,80)});

  const step=()=>{ if (k>=qs.length) return final();

/* =====================================================================

const VBASE = BASE + 'video/';
const VID = E2.videos;   /* id → {archivo, titulo, cierre, pausas, vtt} */
const fmtDur = s => { s=Math.round(s||0); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); };

/* tarjeta «Mira primero · Watch first» (o «Repaso rápido») */
function videoCard(id, modo){

/* grabación horizontal: a lo ancho de la tarjeta, 16:9 */
function videoInline(id){

}
/* después de pintar: revisa si el archivo existe y su orientación */
function montarVideos(root){
  $$('[data-vcard]',root).forEach(card=>{
    const id = card.dataset.vcard, v = VID[id], vid = $('video',card);
    const enCamino = ()=>{ card.classList.add('encamino'); $('.vthumb',card).innerHTML = `${mishi('duerme','')}<span class="vdur">Video en camino</span>`; card.onclick=()=>{ fx('candado'); toast('Video en camino'); }; };
    vid.onerror = enCamino; const src = $('source',card);
    vid.onloadedmetadata = ()=>{
      const dur = vid.duration||v.dur||0; $('.vdur',card).textContent = fmtDur(dur);
      if (vid.videoWidth > vid.videoHeight && card.dataset.modo!=='repaso'){ /* horizontal: va en línea */
        const div=document.createElement('div'); div.innerHTML = videoInline(id); card.replaceWith(div.firstChild); montarInline($(`[data-vinline="${id}"]`,root)); return; }
      card.onclick = ()=>abrirVideo(id, card.dataset.modo);
    };

  });

function montarInline(el){
  if (!el) return; const id = el.dataset.vinline, v = VID[id], vid = $('video',el); if (!vid) return;
  vid.onerror = ()=>{ el.innerHTML = `<div class="eyebrow">${esc(v.titulo)}</div><div class="encamino-h">${mishi('duerme','')}<b>Video en camino</b></div>`; };
  seguirVisto(vid, id);
}
/* «Visto completo»: 90 % de la duración sin contar los últimos 2.5 s del cierre */
function seguirVisto(vid, id, alTerminar){
  const v = VID[id]; const vistos = new Set(); let marcado = false;
  vid.addEventListener('timeupdate', ()=>{
    vistos.add(Math.floor(vid.currentTime));
    const util = Math.max(1, (vid.duration||v.dur||0) - (v.cierre||2.5));
    if (!marcado && [...vistos].filter(s=>s<util).length >= util*.9){
      marcado = true; const r = P.videos[id] = P.videos[id]||{veces:0};
      r.completo = true; r.veces = (r.veces||0)+1; r.f = hoyISO(); guardarP();
      REG.anota('video',{a:id, s:(S.arg||'').split('/')[0], completo:1, veces:r.veces}); REG.enviar();
    }
  });
  vid.addEventListener('ended', ()=>{ if (alTerminar) alTerminar(marcado); });
}

/* ---------- reproductor a pantalla completa (vertical: marco de celular en computadora) ---------- */
let VP = null;
function abrirVideo(id, modo){
  const v = VID[id]; if (!v) return; callar();
  const rep = modo==='repaso';
  const el = document.createElement('div'); el.className = 'vplayer'; el.innerHTML = `
    <div class="vmarco"><video playsinline preload="auto" src="${VBASE}${encodeURIComponent(v.archivo)}">${v.vtt?`<track kind="subtitles" srclang="es" src="${VBASE}${encodeURIComponent(v.vtt)}">`:''}</video>
      <div class="vq" hidden></div><div class="vcap" hidden></div></div>
    <div class="vctl"><button class="vb" id="vPP">${PLAY}<small>Play</small></button><button class="vb" id="vOtra">↺<small>Ver otra vez</small></button>${v.vtt?`<button class="vb" id="vSub">CC<small>Subtítulos</small></button>`:''}<button class="vb" id="vX">✕<small>Cerrar</small></button></div>`;
  document.body.appendChild(el); document.body.classList.add('sinscroll');
  const vid = $('video',el), q = $('.vq',el);
  VP = {el, vid, id, rep, pausas:(v.pausas||[]).map((p,i)=>Object.assign({i},p)), hechas:new Set(), primera:true, cola:null, t0:Date.now()};
  const pp = $('#vPP',el);
  const setPP = ()=>{ pp.innerHTML = vid.paused ? `${PLAY}<small>Play</small>` : `<b style="font-size:20px;line-height:1">❚❚</b><small>Pause</small>`; };
  vid.onplay = setPP; vid.onpause = setPP;
  pp.onclick = ()=>{ if (!q.hidden) return; vid.paused ? vid.play() : vid.pause(); };
  $('#vOtra',el).onclick = ()=>{ if (!q.hidden) return; VP.hechas.clear(); vid.currentTime = 0; vid.play(); };
  const sub = $('#vSub',el); if (sub) sub.onclick = ()=>{ const tr = vid.textTracks[0]; if (tr) tr.mode = tr.mode==='showing'?'hidden':'showing'; };
  $('#vX',el).onclick = cerrarVideo;
  vid.onerror = ()=>{ $('.vmarco',el).innerHTML = `<div class="encamino-h">${mishi('duerme','')}<b>Video en camino</b></div>`; };
  seguirVisto(vid, id, completo=>{
    if (rep) return;
    REG.anota('videofin',{a:id});
    catSay('<b>¡Ya sabes el secreto!</b>Ahora pruébalo en las actividades.','wow');
  });
  vid.onloadedmetadata = ()=>{ el.classList.toggle('horizontal', vid.videoWidth > vid.videoHeight); };
  /* pausas interactivas: cada una es un reactivo de Listening */
  vid.addEventListener('timeupdate', ()=>{
    if (!q.hidden) return;
    const p = VP.pausas.find(p=>!VP.hechas.has(p.i) && vid.currentTime >= Number(p.s) && vid.currentTime < Number(p.s)+1.2);
    if (p){ vid.pause(); preguntar(p); }
    if (rep && VP.fin && vid.currentTime >= VP.fin){ vid.pause(); }
  });
  if (rep) repasoSiguiente(); else vid.play().catch(()=>{});
  REG.anota('videoabre',{a:id, rep:rep?1:0});
}
function repasoSiguiente(){
  const p = VP.pausas.find(p=>!VP.hechas.has(p.i));
  if (!p){ terminarPausas(); return; }
  VP.vid.currentTime = Math.max(0, Number(p.s) - 6); VP.fin = Number(p.s) + .05; VP.vid.play().catch(()=>{});
}
function preguntar(p){
  const q = $('.vq', VP.el); q.hidden = false; let errs = 0, ayudas = 0;
  const orden = p.orden ? mezclar(p.orden) : null; let pick = [];
  const opciones = p.opciones ? mezclar(p.opciones) : null;
  const dibujar = (msg='')=>{
    q.innerHTML = `<div class="vqc vid2"><div class="eyebrow">Pregunta ${p.i+1} de ${VP.pausas.length} · Listening</div><b class="vqt">${esc(p.pregunta)}</b>
      ${opciones?`<div class="ops">${opciones.map((o,j)=>`<button class="op" data-j="${j}">${esc(clean(o))}</button>`).join('')}</div>`
      :`<div class="meta-l">${pick.map((w,j)=>`<button class="chip sel" data-r="${j}">${esc(w)}</button>`).join('')||'<span class="muted" style="font-size:14px;font-weight:700">Toca las piezas en orden…</span>'}</div><div class="pool">${orden.map((w,j)=>pick.includes(w)?'':`<button class="chip" data-p="${j}">${esc(w)}</button>`).join('')}</div>`}
      <div class="fbz">${msg}</div></div>`;
    $$('[data-j]',q).forEach(b=>b.onclick=()=>{ const o=opciones[+b.dataset.j]; if (isOk(o)) acierto(); else fallo(); });
    $$('[data-p]',q).forEach(b=>b.onclick=()=>{ pick.push(orden[+b.dataset.p]); fx('pop'); if (pick.length===p.orden.length){ if (pick.join('|')===p.orden.join('|')) acierto(); else { pick=[]; fallo(); } } else dibujar(); });
    $$('[data-r]',q).forEach(b=>b.onclick=()=>{ pick=pick.slice(0,+b.dataset.r); dibujar(); });
  };
  const acierto = ()=>{
    fx('ok'); VP.hechas.add(p.i);
    const auto = errs===0; if (!auto) VP.primera = false;
    VP.res = VP.res||[]; VP.res.push({ok:true, first:errs===0, auto});
    registrarReactivo('L', auto, true, errs===0, ayudas);
    q.innerHTML = `<div class="vqc vid2"><div class="fb ok">${mishi('feliz')}<span><b>Great job! · ¡Muy bien!</b></span></div></div>`;
    setTimeout(()=>{ q.hidden = true; q.innerHTML=''; if (VP.rep) repasoSiguiente(); else { VP.vid.play().catch(()=>{}); if (VP.hechas.size===VP.pausas.length) terminarPausas(); } }, 900);
  };
  const fallo = ()=>{
    errs++; fx('no');
    /* se repite el tramo anterior (unos 5 s) con la pista y vuelve a preguntar */
    q.innerHTML = `<div class="vqc vid2"><div class="fb no">${mishi('idea')}<span><b>Next time · La próxima vez</b> ${esc(p.pista||'Escucha otra vez.')}</span></div></div>`;
    setTimeout(()=>{ q.hidden = true; q.innerHTML=''; VP.vid.currentTime = Math.max(0, Number(p.s)-5); VP.vid.play().catch(()=>{}); }, 1800);
  };
  dibujar();
}
function terminarPausas(){
  const res = VP.res||[]; if (!res.length) return;
  const auto = res.filter(x=>x.auto).length, n = VP.pausas.length;
  actualizarHab('L', Math.round(auto/n*100));
  const r = P.videos[VP.id] = P.videos[VP.id]||{veces:0}; r.pausas = {ok:res.filter(x=>x.ok).length, auto, n, f:hoyISO()}; guardarP();

  if (VP.rep) setTimeout(()=>{ toast('Repaso terminado'); }, 400);
  VP.res = [];
}

/* El Portal abre la Encarta con #a=<huella del código del alumno> (nunca el código). Si la cuenta guardada
   en este navegador es de otro alumno (hermanos en un mismo celular), se cierra y se pide entrar de nuevo. */
function huellaEnc(c){ c = String(c||'').toUpperCase().replace(/[^A-Z0-9]/g,''); let h = 5381; for (let i=0;i<c.length;i++) h = (h*33 + c.charCodeAt(i)) % 4294967296; return h.toString(36); }
let AVISO_CUENTA = '';
function cargarLocal(){
  const m = /[#&]a=([a-z0-9]+)/.exec(location.hash||''), pide = m && m[1];
  if (pide) try { history.replaceState(null, '', location.pathname + location.search); } catch(e){}
  try { const ses = JSON.parse(localStorage.getItem('encarta_ses')||'null');
    if (ses && ses.grado && pide && huellaEnc(ses.c) !== pide){ localStorage.removeItem('encarta_ses'); AVISO_CUENTA = 'Entra con tu código y tu PIN.'; }
    else if (ses && ses.grado){ S.grado=ses.grado; S.grupo=ses.grupo||''; S.nombre=ses.n||''; S.c=ses.c||''; S.tk=ses.tk||''; S.pant='inicio'; } } catch(e){}
  if (MAESTRO) S.pant = 'inicio';
  if (PANEL) S.pant = 'panel';
  cargarP();
}
function entrarCon(r, codigo){
  S.grado = r.grado; S.grupo = r.grupo||''; S.nombre = r.nombre||''; S.c = codigo||''; S.tk = r.tk||'';
  try { localStorage.setItem('encarta_ses', JSON.stringify({grado:S.grado, grupo:S.grupo, n:S.nombre, c:S.c, tk:S.tk})); } catch(e){}
  cargarP(); REG.anota('ingreso', {}); REG.enviar();
  fx('fin'); inicio(); bajarP();
  setTimeout(()=>{ if (!P.tour) startTour('home'); else saludar(); }, 600);
}
function salir(){ subirP(true); REG.enviar(true); try { localStorage.removeItem('encarta_ses'); } catch(e){} S.c=''; S.tk=''; S.hist=[]; S.pant='login'; pintar(); }
function saludar(){ const n = P.days.length; if (n>1) catSay(`<b>¡Hola otra vez!</b>Llevas ${n} días practicando. Sigue tu camino donde te quedaste.`,'happy'); } /* la primera vez ya saluda la tarjeta de arriba */

function seccionActual(){
  if (S.pant==='tema') return S.arg==='T1' ? (S.grado||'1°') : S.arg;
  if (S.pant==='herr') return 'herr';
  if (S.pant==='zona') return 'zona';
  if (S.pant==='sub' || S.pant==='play'){ const f=POR_ID[String(S.arg).split('/')[0]]; if(!f) return 'inicio'; if (f.id.startsWith('T-')) return 'herr'; if (f.id.startsWith('E0')) return 'E0'; if (f.t1) return f.grado; return f.id.startsWith('E1')?'1°':'2°'; }

function tituloPant(){
  if (S.pant==='inicio') return ['Mi Encarta', S.rol==='maestro'?'Vista del profesor':S.grado+(S.grupo?' · '+S.grupo:'')];

function barraTop(){

function pintar(){
  callar(); aplicarColor();
  const app = $('#app');
  if (S.pant==='login'){ app.innerHTML = pLogin(); conectarLogin(); quitarDock(); return; }
  if (S.pant!=='sub' && S.pant!=='play') TIEMPO.salir();

  const V = {inicio:pInicio, tema:()=>pTema(S.arg), herr:pHerr, sub:()=>pSub(S.arg), play:()=>pPlay(S.arg), buscar:pBuscar, zona:pZona, yo:pYo, panel:pPanel};
  const cuerpo = (V[S.pant]||pInicio)();
  app.innerHTML = barraPrevia() + `<div class="app">${barraTop()}<main>${cuerpo}</main></div>` + barraAbajo();

  const bt=$('#bTour'); if (bt) bt.onclick=()=>startTour(S.pant==='sub'?'unit':'home', true);
  if (S.pant==='sub') montarSub(S.arg);

function startTour(name, manual){
  if ($('.tour')) return;
  const steps = TOURS[name].filter(s=>!s.sel || $(s.sel)); let i = 0;
  const el = document.createElement('div'); el.className = 'tour'; document.body.appendChild(el);
  const fin = ()=>{ el.remove(); window.removeEventListener('resize', show); if (name==='home'){ if (!P.tour){ P.tour=true; guardarP(); } saludar(); } };
  function show(){
    const s = steps[i]; const tgt = s.sel ? $(s.sel) : null; let hole = '', top = '50%', ty = '-50%';
    if (tgt){ tgt.scrollIntoView({block:'center', behavior:'instant'}); const r = tgt.getBoundingClientRect();
      hole = `<div class="hole" style="left:${r.left-6}px;top:${r.top-6}px;width:${r.width+12}px;height:${r.height+12}px"></div>`;
      if (r.bottom+260 < innerHeight){ top=(r.bottom+14)+'px'; ty='0'; } else if (r.top-260 > 0){ top=(r.top-14)+'px'; ty='-100%'; } else { top=(innerHeight-14)+'px'; ty='-100%'; } }
    el.innerHTML = `${tgt?hole:'<div class="shade"></div>'}<div class="ttip vid" style="top:${top};transform:translate(-50%,${ty})"><div class="tc">${mishi(i===0?'feliz':'habla','')}<div><h3>${esc(s.t)}</h3><p>${esc(s.p)}</p></div></div>
      <div class="tn"><span class="nota">${i+1} de ${steps.length}</span><div class="acciones" style="margin:0"><button class="btn sec ch" id="tskip">Saltar<small>Skip</small></button>${i?`<button class="btn sec ch" id="tprev">Atrás<small>Back</small></button>`:''}<button class="btn ch" id="tnext">${i===steps.length-1?'¡Listo!':'Siguiente'}<small>${i===steps.length-1?"Let's go":'Next'}</small></button></div></div></div>`;
    $('#tskip').onclick = fin; $('#tnext').onclick = ()=>{ fx('pop'); i++; i<steps.length ? show() : fin(); };
    const pv = $('#tprev'); if (pv) pv.onclick = ()=>{ i--; show(); };
  }
  window.addEventListener('resize', show); show();
}

   Juegos de la Fase 1 · Lote 1 (aprobado): Hello Door, Me Card, Month line
   Solo usan el inglés de las Partes 1 a 7 y la Parte 2 (vienen en a.c).

Object.assign(KINDNAME, {door:'Hello Door', mecard:'Me Card', monthline:'Month line'});
const NIV = () => P.niveles || (P.niveles = {});
const sonar = (id, texto) => new Promise(r=>{ let listo=false; const fin=()=>{ if(!listo){ listo=true; r(); } }; decir(texto, null, .85, id, fin); setTimeout(fin, 900 + 95*String(texto).length); });
const espera = ms => new Promise(r=>setTimeout(r, ms));
function nivelesHTML(key, actual, nombres){
  const max = Math.min(3, NIV()[key]||1);
  return `<div class="niveles">${nombres.map((n,i)=>`<button class="pill ${i+1===actual?'acc':i+1<=max?'':'bloq'}" data-niv="${i+1}" ${i+1>max?'disabled':''}>${i+1>max?'🔒 ':''}Nivel ${i+1} · ${esc(n)}</button>`).join('')}</div>`;
}
function subirNivel(key, nivel){ if (nivel<3 && (NIV()[key]||1) <= nivel){ NIV()[key] = nivel+1; guardarP(); return true; } return false; }

/* ---------- Hello Door ---------- */
ENGINES.door = (a,c)=>{
  const G = a.c, key = keyAct(RUN.f,a), NOM = ['Con la tabla','Pista: primera letra','Solo audio'];
  let nivel = Math.min(3, NIV()[key]||1);
  const tabla = abierta => `<details class="tabla-uso" ${abierta?'open':''}><summary>¿Cuál uso? · Which one?</summary>${G.tabla_cual_uso.map(r=>`<div><b>${esc(r[0])}</b>${esc(r[1])}</div>`).join('')}</details>`;
  const mascara = t => t.replace(/[A-Za-z']+/g, w=>w[0]+'___');
  const retro = ok => /Pleasure|Nice/.test(ok) ? G.retro.pleasure_o_nice : /Welcome|Take care/.test(ok) ? G.retro.welcome : /Good morning/.test(ok) ? G.retro.good_morning : 'Fíjate si la persona llega o se va.';
  const ronda = ()=>{
    const esc5 = mezclar(G.escenas).slice(0,5); let i=0, primeras=0;
    RUN.items=[]; RUN.fall=[]; c.total(5); RUN.nivelSk = nivel===3 ? 'L' : 'R';
    const sig = ()=>{
      if (i>=esc5.length){
        const pasa = primeras>=4, sube = pasa && subirNivel(key, nivel);
        return c.finish({html:`<div class="fb ${pasa?'ok':'no'}">${mishi(pasa?'estrellas':'idea')}<span><b>${primeras} de 5 a la primera.</b> ${pasa?(sube?`¡Pasaste! Ya se abrió el nivel ${nivel+1}.`:'¡Pasaste este nivel!'):'Para pasar necesitas 4 de 5. Repasa la tabla y vuelve a intentarlo.'}</span></div>`});
      }
      const e = esc5[i], ops = mezclar(e.opciones), okTxt = clean(e.opciones.find(isOk));
      let errs=0, quitada=false, visto=false; c.begin();
      const draw = ()=>{
        const st = c.stage();
        st.innerHTML = nivelesHTML(key, nivel, NOM)
          + `<div class="puerta ${e.puerta==='llega'?'llega':'seva'}"><div class="marco"><div class="hoja"></div>${mishi(e.puerta==='llega'?'feliz':'guino','quien')}</div><span class="pill ${e.puerta==='llega'?'bien':'acc'}">${e.puerta==='llega'?'Llega · arrives':'Se va · leaves'}</span></div>
            <p class="preg">${esc(e.es)}</p>
            <div class="ops">${ops.map((o,j)=>{ if (quitada && !isOk(o) && j===ops.findIndex(x=>!isOk(x))) return '';
              const t = clean(o);
              if (nivel===3 && !visto) return `<div class="opa"><button class="aud" data-p="${j}" aria-label="Escuchar opción ${j+1}"><i>${PLAY}</i></button><span>Opción ${j+1}</span><button class="btn sec ch" data-o="${j}">Elegir<small>Choose</small></button></div>`;
              return `<button class="op" data-o="${j}">${esc(nivel===2&&!visto?mascara(t):t)}</button>`; }).join('')}</div><div class="fbz"></div>${nivel===1?tabla(true):''}`;
        $$('[data-p]',st).forEach(b=>b.onclick=()=>{ fx('tap'); decir(clean(ops[+b.dataset.p]), b); });
        $$('[data-o]',st).forEach(b=>b.onclick=()=>{
          const o = ops[+b.dataset.o];
          if (isOk(o)){ fx('ok'); if (errs===0) primeras++; $$('[data-o]',st).forEach(x=>x.disabled=true); decir(okTxt);
            $('.fbz',st).innerHTML = `<div class="fb ok">${mishi('feliz')}<span><b>Great job! · ¡Muy bien!</b> ${esc(okTxt)}</span></div><div class="acciones"><button class="btn ch" id="nx">Next<small>Siguiente</small></button></div>`;
            $('#nx').onclick=()=>{ c.done(true); i++; sig(); }; }
          else { errs++; fx('no'); c.miss(); b.disabled=true; b.classList.add('no','sacude');
            if (errs>=2) c.fallo(e.es, okTxt);
            $('.fbz',st).innerHTML = `<div class="fb no">${mishi('pensando')}<span><b>Next time · La próxima vez</b> ${esc(retro(okTxt))}</span></div>`; }
        });
        $$('[data-niv]',st).forEach(b=>b.onclick=()=>{ const n=+b.dataset.niv; if (n!==nivel){ nivel=n; fx('nav'); ronda(); } });
        c.helps([
          ...(nivel>1?[{label:'Ver la tabla',fn:()=>{ c.help('Ver la tabla'); const t=$('.tabla-uso',st); if(!t) $('.fbz',st).insertAdjacentHTML('afterend', tabla(true)); }}]:[]),
          ...(nivel>1&&!visto?[{label:'Ver el texto',fn:()=>{ c.help('Ver el texto'); visto=true; draw(); }}]:[]),
          ...(!quitada?[{label:'Quitar una opción',fn:()=>{ c.help('Quitar una opción'); quitada=true; draw(); }}]:[])
        ]);
      };
      draw();
    };
    sig();
  };
  ronda();
};

/* ---------- Month line ---------- */
ENGINES.monthline = (a,c)=>{
  const G = a.c, key = keyAct(RUN.f,a), NOM = ['Con español','Solo inglés','Start in ___'], M = G.meses;
  let nivel = Math.min(3, NIV()[key]||1);
  const inversiones = arr => { let n=0; for (let x=0;x<arr.length;x++) for (let y=x+1;y<arr.length;y++) if (arr[x]>arr[y]) n++; return n; };
  const juego = ()=>{
    RUN.items=[]; RUN.fall=[]; c.total(1); c.begin(); RUN.nivelSk='R';
    const ini = nivel===3 ? Math.floor(Math.random()*12) : 0;
    const meta = Array.from({length:12},(_,k)=>(ini+k)%12);        /* el orden que se busca */
    let pos = Array.from({length:12},(_,k)=>k);                      /* pos[k] = índice en meta */
    for (let s=0; s<12 || inversiones(pos)<8; s++){ const k=Math.floor(Math.random()*11); [pos[k],pos[k+1]]=[pos[k+1],pos[k]]; }
    const minimo = inversiones(pos); let movs=0, selk=-1, conEs=nivel===1; const filas = new Set();
    const draw = ()=>{
      const st = c.stage();
      st.innerHTML = nivelesHTML(key, nivel, NOM)
        + `<p class="ins" style="margin:6px 0 2px">${nivel===3?`<b>Start in ${esc(M[ini])}.</b> `:''}Toca un gatito y luego su vecino para cambiarlos de lugar.</p>
           <div class="mline">${pos.map((p,k)=>{ const m=meta[p], bien = p===k;
             return `<button class="gato ${selk===k?'sel':''} ${conEs&&bien?'ok':''} ${selk>=0&&Math.abs(selk-k)===1?'vecino':''}" data-k="${k}">${mishi(bien&&conEs?'feliz':'normal')}<b>${esc(M[m])}</b>${conEs?`<small>${esc(G.es[m])}</small>`:''}</button>`; }).join('')}</div>
           <div class="nota" style="text-align:center">Movimientos: <b>${movs}</b></div><div class="fbz"></div>`;
      $$('[data-k]',st).forEach(b=>b.onclick=()=>{
        const k=+b.dataset.k;
        if (selk<0 || selk===k){ selk = selk===k?-1:k; fx('tap'); draw(); return; }
        if (Math.abs(selk-k)!==1){ selk=k; fx('tap'); draw(); return; }
        [pos[selk],pos[k]]=[pos[k],pos[selk]]; movs++; selk=-1; fx('pop'); draw(); revisarFilas();
      });
      $$('[data-niv]',st).forEach(b=>b.onclick=()=>{ const n=+b.dataset.niv; if (n!==nivel){ nivel=n; fx('nav'); juego(); } });
      c.helps([
        {label:'Escuchar en orden',fn:async()=>{ c.help('Escuchar en orden'); for (const m of meta){ await sonar('AUD-P-'+M[m], M[m]); } }},
        ...(!conEs?[{label:'Ver en español',fn:()=>{ c.help('Ver en español'); conEs=true; draw(); }}]:[])
      ]);
    };
    const revisarFilas = async ()=>{
      for (let r=0;r<4;r++){
        if (filas.has(r)) continue;
        if ([0,1,2].every(j=>pos[r*3+j]===r*3+j)){ filas.add(r);
          for (let j=0;j<3;j++){ const m=meta[r*3+j]; const el=$(`[data-k="${r*3+j}"]`); if (el) el.classList.add('canta'); fx('palmada'); await sonar('AUD-P-'+M[m], M[m]); }
        }
      }
      if (pos.every((p,k)=>p===k)){
        const pasa = movs <= minimo+3; if (!pasa){ c.miss(); c.fallo('Ordena los meses con menos movimientos', G.retro); }
        c.done(true); const sube = pasa && subirNivel(key, nivel);
        await espera(400);
        c.finish({stars: pasa?(movs===minimo?3:2):1, html:`<div class="fb ${pasa?'ok':'no'}">${mishi(pasa?'estrellas':'idea')}<span><b>${movs} movimientos (lo mínimo eran ${minimo}).</b> ${pasa?(sube?`¡Pasaste! Ya se abrió el nivel ${nivel+1}.`:'¡Pasaste este nivel!'):`Para pasar: a lo más ${minimo+3}. ${esc(G.retro)}`}</span></div>`});
      }
    };
    draw();
  };
  juego();
};

/* ---------- Me Card ---------- */
ENGINES.mecard = (a,c)=>{
  const G = a.c, F = G.fichas, f = RUN.f, sel = {}, hechas = new Set();
  const LETRAS = /^[A-Za-zÁÉÍÓÚÜÑáéíóúüñ' ]{1,20}$/, LUGAR = /^[A-Za-zÁÉÍÓÚÜÑáéíóúüñ'., ]{2,30}$/;
  let favCat = null, msg = {};
  c.total(0);
  const linea = k => { const fi = F.find(x=>x.k===k), v = sel[k];
    if (k==='favorito') return v ? `My favorite ${v[0]} is ${v[1]}.` : '';
    return v ? fi.en.replace('___', v) : ''; };
  const lineas = () => F.map(x=>linea(x.k)).filter(Boolean);
  const marcar = k => { hechas.add(k); };  /* la tarjeta no es un reactivo: no suma a las habilidades */
  const draw = ()=>{
    const st = c.stage();
    const fila = fi => {
      const k = fi.k, v = sel[k];
      let h = `<div class="ficha ${v?'lista':''}"><div class="en">${esc(k==='favorito' ? (v ? linea(k) : `My favorite ${favCat||'___'} is ___.`) : fi.en.replace('___', v||'___'))}</div>`;
      if (fi.opciones && !Array.isArray(fi.opciones)){ /* favorito */
        h += `<div class="chips">${Object.keys(fi.opciones).map(cat=>`<button class="chip ${favCat===cat?'sel':''}" data-fc="${cat}">${cat}</button>`).join('')}</div>`;
        if (favCat) h += `<div class="chips">${fi.opciones[favCat].map(o=>`<button class="chip ${v&&v[1]===o?'sel':''}" data-fv="${esc(o)}">${esc(o)}</button>`).join('')}</div>`;
      } else if (fi.opciones){
        h += `<div class="chips">${fi.opciones.map(o=>`<button class="chip ${v===o?'sel':''}" data-k="${k}" data-v="${esc(o)}">${esc(o)}</button>`).join('')}${fi.otro?`<button class="chip ${v&&!fi.opciones.includes(v)?'sel':''}" data-otro="${k}">Otro lugar…</button>`:''}</div>`;
        if (fi.otro && sel['_otro_'+k]) h += `<form class="fila-chat" data-fo="${k}"><input class="hueco" maxlength="30" placeholder="Solo el nombre del lugar" value="${esc(v&&!fi.opciones.includes(v)?v:'')}"><button class="btn ch">OK</button></form><small class="nota">${esc(fi.otro)}</small>`;
      } else if (fi.ruedita){
        h += `<div class="chips">${fi.ruedita.map(o=>`<button class="chip ${v===String(o)?'sel':''}" data-k="${k}" data-v="${o}">${o}</button>`).join('')}</div>`;
      } else if (fi.entrada){
        h += `<form class="fila-chat" data-fn="${k}"><input class="hueco" maxlength="20" placeholder="Lupita" autocomplete="off" value="${esc(v||'')}"><button class="btn ch">OK</button></form><small class="nota">${esc(fi.entrada)}</small>`;
      }
      if (msg[k]) h += `<div class="fb no">${mishi('pensando')}<span>${esc(msg[k])}</span></div>`;
      if (k==='edad') h += `<div class="tip">${mishi('idea')}<div>${esc(G.avisos.edad)}</div></div>`;
      if (k==='soy_de') h += `<div class="tip">${mishi('idea')}<div>${esc(G.avisos.vivo_soy_de)}</div></div>`;
      return h + `</div>`;
    };
    const L = lineas(), completa = hechas.size===F.length;
    st.innerHTML = `<div class="tip" style="margin-top:0">${mishi('guino')}<div>Usa solo tu nombre de pila o inventa un personaje. Nada de dirección, teléfono ni apellidos.</div></div>
      <div class="mecard-grid"><div>${F.map(fila).join('')}</div>
      <div class="mecard vid2"><div class="eyebrow">Me Card</div>${L.length?L.map(t=>`<div class="ln">${bAud(t)}<span>${esc(t)}</span></div>`).join(''):'<p class="muted">Tu tarjeta aparece aquí.</p>'}
        ${completa?`<div class="acciones"><button class="btn sec ch" id="todo">${PLAY} Escuchar todo<small>Listen</small></button><button class="btn ch" id="env">Send to my teacher<small>Enviar a mi profesor</small></button></div>`:`<small class="nota">${hechas.size} de ${F.length} listas</small>`}
        ${estadoTrabajo(f,a)}</div></div>`;
    $$('[data-k][data-v]',st).forEach(b=>b.onclick=()=>{ const k=b.dataset.k; sel[k]=b.dataset.v; delete msg[k]; if (b.closest('.ficha')&&sel['_otro_'+k]) delete sel['_otro_'+k]; marcar(k); fx('pop'); decir(linea(k)); draw(); });
    $$('[data-otro]',st).forEach(b=>b.onclick=()=>{ sel['_otro_'+b.dataset.otro]=1; fx('tap'); draw(); });
    $$('[data-fc]',st).forEach(b=>b.onclick=()=>{ favCat=b.dataset.fc; fx('tap'); draw(); });
    $$('[data-fv]',st).forEach(b=>b.onclick=()=>{ sel.favorito=[favCat, b.dataset.fv]; marcar('favorito'); fx('pop'); decir(linea('favorito')); draw(); });
    $$('[data-fn]',st).forEach(fm=>fm.onsubmit=e=>{ e.preventDefault(); const k=fm.dataset.fn, t=$('input',fm).value.trim();
      if (!LETRAS.test(t)){ msg[k]='Solo letras: tu nombre de pila o un personaje (máximo 20 letras, sin números).'; fx('no'); draw(); return; }
      sel[k]=t; delete msg[k]; marcar(k); fx('pop'); decir(linea(k)); draw(); });
    $$('[data-fo]',st).forEach(fm=>fm.onsubmit=e=>{ e.preventDefault(); const k=fm.dataset.fo, t=$('input',fm).value.trim();
      if (!LUGAR.test(t)){ msg[k]='Escribe solo el nombre del lugar, sin números ni dirección.'; fx('no'); draw(); return; }
      sel[k]=t; delete msg[k]; marcar(k); fx('pop'); decir(linea(k)); draw(); });
    const td=$('#todo'); if (td) td.onclick=async()=>{ for (const t of lineas()){ await sonar(null, t); } };
    const en=$('#env'); if (en) en.onclick=()=>{ enviarTrabajo(f, a, 'mecard', lineas().join(' '), []); fx('fin'); c.finish({stars:3, sinHab:true, html:`<div class="mecard vid2" style="text-align:left">${lineas().map(t=>`<div class="ln"><span>${esc(t)}</span></div>`).join('')}</div>${estadoTrabajo(f,a)}`}); };
    c.helps([{label:'Ver el ejemplo',fn:()=>{ c.help('Ver el ejemplo'); catSay(`<b>Ejemplo · Model</b>${esc(G.modelo)}`,'idea',{ms:9000}); }}]);
  };
  draw();
};

   Solo inglés ya visto en clase; los audios son de la voz de la Encarta (mp3 por ID).

Object.assign(KINDNAME, {moonlab:'Moon lab', spelling:'Spelling houses', datebuilder:'Date builder'});
/* toca un mp3 y espera a que termine (la voz del navegador solo si el archivo falla) */
const tocar = (id, texto) => new Promise(r=>{ let listo=false; const fin=()=>{ if(!listo){ listo=true; r(); } }; decir(texto, null, .85, id, fin); setTimeout(fin, 7000); });
let PIEZAS_T = 0;   /* una secuencia nueva (o salir de la actividad) corta la anterior */
async function tocarPiezas(lista, pausa=120){ const yo = ++PIEZAS_T, run = RUN; for (const [id, t] of lista){ if (yo!==PIEZAS_T || RUN!==run) return; await tocar(id, t); await espera(pausa); } }
const DIAS_EN = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const MESES_EN = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const DIAS_ES = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const MESES_ES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const sufijo = n => (n%100>=11 && n%100<=13) ? 'th' : ({1:'st',2:'nd',3:'rd'}[n%10]||'th');

/* ---------- Moon lab (no se califica) ---------- */
ENGINES.moonlab = (a,c)=>{
  const G = a.c, F = G.fases, SEM = G.contador;
  const AUDF = ['AUD-P-new-moon','AUD-P-half-moon','AUD-P-full-moon','AUD-P-half-moon'];
  const AUDS = ['AUD-P-one-week','AUD-P-two-weeks','AUD-P-three-weeks','AUD-P-four-weeks'];
  RUN.items=[]; RUN.fall=[]; c.total(0); c.helps([]);
  const TAU = Math.PI*2, EX = 210, EY = 150, R = 100;
  let acc = 0, vueltas = 0, faseAnt = 0, semAnt = 0, vioLlena = false, ultimoSonido = 0;
  const diaDe = v => ((v % TAU) + TAU) % TAU / TAU * 28;
  const faseDe = d => { let k=0; F.forEach((f,i)=>{ if (d >= f.desde_dia) k=i; }); return k; };
  const semDe = d => Math.floor(d/7);             /* 0 … 3; la cuarta semana se cuenta al cerrar la vuelta */
  /* lo que se ve desde la Tierra (hemisferio norte): crece por la derecha */
  const fasePath = (cx, cy, r, d) => {
    const p = d/28, lit = 1 - Math.abs(p - .5)*2, k = Math.cos(lit*Math.PI), rx = Math.abs(k)*r;
    if (lit < .02) return '';
    if (lit > .98) return `M${cx} ${cy-r}A${r} ${r} 0 1 1 ${cx} ${cy+r}A${r} ${r} 0 1 1 ${cx} ${cy-r}Z`;
    const der = p < .5;   /* creciente: luz a la derecha */
    const s1 = der ? 1 : 0, s2 = (k > 0) === der ? 0 : 1;
    return `M${cx} ${cy-r}A${r} ${r} 0 0 ${s1} ${cx} ${cy+r}A${rx} ${r} 0 0 ${s2} ${cx} ${cy-r}Z`;
  };
  const st = c.stage();
  st.innerHTML = `<div class="tip" style="margin-top:0">${mishi('idea')}<div>La lámpara es el sol y la naranja es la luna. <b>Arrastra la luna</b> alrededor de la Tierra y mira cómo cambia.</div></div>
    <div class="ml-wrap">
      <svg class="ml-svg" viewBox="0 0 380 300" role="img" aria-label="La luna gira alrededor de la Tierra; la lámpara es el sol">
        <defs><radialGradient id="mlLuz" cx="0" cy=".5" r="1"><stop offset="0" stop-color="#fff3b0" stop-opacity=".95"/><stop offset=".55" stop-color="#ffe680" stop-opacity=".25"/><stop offset="1" stop-color="#ffe680" stop-opacity="0"/></radialGradient></defs>
        <rect x="0" y="0" width="380" height="300" rx="22" fill="#1d2550"/>
        <rect x="0" y="0" width="380" height="300" rx="22" fill="url(#mlLuz)"/>
        <g class="ml-lampara"><path d="M10 112 L52 128 L52 172 L10 188 Z" fill="#e2453b" stroke="#221c22" stroke-width="3"/><circle cx="56" cy="150" r="17" fill="#fff6c4" stroke="#221c22" stroke-width="3"/><rect x="2" y="146" width="10" height="120" fill="#6b4426"/></g>
        <text x="36" y="214" text-anchor="middle" class="ml-lb">el sol</text>
        <circle cx="${EX}" cy="${EY}" r="${R}" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="2" stroke-dasharray="6 7"/>
        <marker id="mlFl" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#FFD633"/></marker>
        <path d="${(()=>{ const r=R+16, p=a=>[(EX-Math.cos(a)*r).toFixed(1),(EY+Math.sin(a)*r).toFixed(1)]; const [x0,y0]=p(.35),[x1,y1]=p(1.15); return `M${x0} ${y0}A${r} ${r} 0 0 0 ${x1} ${y1}`; })()}" fill="none" stroke="#FFD633" stroke-width="3" stroke-linecap="round" marker-end="url(#mlFl)"/>
        <g><circle cx="${EX}" cy="${EY}" r="28" fill="#3f8de0" stroke="#221c22" stroke-width="3"/><ellipse cx="${EX-8}" cy="${EY-6}" rx="11" ry="8" fill="#5cc067"/><ellipse cx="${EX+9}" cy="${EY+10}" rx="9" ry="6" fill="#5cc067"/><path d="M${EX} ${EY-28}A28 28 0 0 1 ${EX} ${EY+28}Z" fill="rgba(10,15,45,.45)"/></g>
        <text x="${EX}" y="${EY+46}" text-anchor="middle" class="ml-lb">la Tierra</text>
        <g class="ml-luna" tabindex="0" role="slider" aria-label="La luna: arrástrala o usa las flechas" aria-valuemin="0" aria-valuemax="28" aria-valuenow="0">
          <circle class="ml-toque" r="30" fill="transparent"/>
          <circle r="17" fill="#8a5a1a" stroke="#221c22" stroke-width="3"/>
          <path d="M0 -17A17 17 0 0 0 0 17Z" fill="#f7a531"/>
          <circle r="17" fill="none" stroke="#221c22" stroke-width="3"/>
        </g>
        <text class="ml-lb ml-lbluna" text-anchor="middle">la luna</text>
      </svg>
      <div class="ml-panel">
        <div class="ml-ve"><small>Desde la Tierra se ve así:</small><svg viewBox="0 0 100 100" class="ml-fase"><circle cx="50" cy="50" r="40" fill="#3b4677" stroke="#221c22" stroke-width="3"/><path class="ml-lit" fill="#fff3cf"/><circle cx="50" cy="50" r="40" fill="none" stroke="#221c22" stroke-width="3"/></svg></div>
        <div class="ml-lect" aria-live="polite"><span class="ml-chip" id="mlF"></span><span class="ml-sep">·</span><span class="ml-chip" id="mlS"></span></div>
        <small class="ml-es" id="mlEs"></small>
        <div class="ml-sem">${SEM.map((s,i)=>`<i data-s="${i}"><b>${esc(s.split(' = ')[0])}</b></i>`).join('')}</div>
        <div class="ml-dato" hidden>${mishi('estrellas')}<div><b>${esc(G.dato)}</b> ${bAud(G.dato, null, .85, 'AUD-F1-MOON-DATO')}</div></div>
        <div class="acciones"><button class="btn sec ch" id="mlOir">${PLAY} Escuchar<small>Listen</small></button><button class="btn ch" id="mlFin" disabled>Listo<small>Done</small></button></div>
        <small class="nota" id="mlNota">Da una vuelta completa a la Tierra para terminar.</small>
      </div>
    </div>`;
  const svg = $('.ml-svg', st), luna = $('.ml-luna', st), lbl = $('.ml-lbluna', st);
  const flash = el => { el.classList.remove('cambia'); void el.offsetWidth; el.classList.add('cambia'); };
  const sonar1 = lista => { const t = Date.now(); if (t - ultimoSonido < 350) return; ultimoSonido = t; tocarPiezas(lista); };
  const pinta = (primera)=>{
    const d = diaDe(acc), th = (acc % TAU + TAU) % TAU;           /* 0 = entre la Tierra y el sol */
    const x = EX - Math.cos(th)*R, y = EY + Math.sin(th)*R;       /* izquierda → abajo → derecha → arriba */
    luna.setAttribute('transform', `translate(${x.toFixed(1)} ${y.toFixed(1)})`);
    lbl.setAttribute('x', x.toFixed(1)); lbl.setAttribute('y', (y + (y > EY ? 36 : -24)).toFixed(1));
    luna.setAttribute('aria-valuenow', Math.round(d));
    $('.ml-lit', st).setAttribute('d', fasePath(50, 50, 40, d));
    const k = faseDe(d), s = semDe(d);
    $('#mlF').textContent = F[k].en; $('#mlEs').textContent = `${F[k].es} · día ${Math.round(d)} de 28`;
    $('#mlS').textContent = s > 0 ? SEM[s-1].split(' = ')[0] : '—';
    $$('.ml-sem i', st).forEach((el,i)=>el.classList.toggle('on', i < s || (vueltas > 0 && i === 3 && s === 0 && d < 1)));
    if (primera) return;
    const lista = [];
    if (k !== faseAnt){ flash($('#mlF')); lista.push([AUDF[k], F[k].en]); if (k === 2 && !vioLlena){ vioLlena = true; $('.ml-dato', st).hidden = false; flash($('.ml-dato', st)); } }
    if (s !== semAnt && s > 0 && s > semAnt){ flash($('#mlS')); flash($(`.ml-sem i[data-s="${s-1}"]`, st)); lista.push([AUDS[s-1], SEM[s-1]]); }
    if (lista.length) sonar1(lista);
    faseAnt = k; semAnt = s;
  };
  const vuelta = ()=>{  /* cerró la vuelta: four weeks = one month */
    vueltas++; fx('estrella'); $$('.ml-sem i', st).forEach(el=>el.classList.add('on')); flash($('.ml-sem', st));
    $('#mlS').textContent = SEM[3]; flash($('#mlS'));
    setTimeout(()=>tocarPiezas([['AUD-P-four-weeks','four weeks'],['AUD-P-one-month','one month']]), 1300);
    $('#mlFin').disabled = false; $('#mlNota').textContent = '¡Una vuelta = one month! Puedes seguir girando o terminar.';
    catSay('<b>Four weeks = one month.</b> La luna tarda como un mes en dar la vuelta.', 'estrellas', {ms:6000});
  };
  const mover = delta => {
    const antes = acc; acc = Math.max(0, acc + delta);            /* se avanza como la luna de verdad */
    if (Math.floor(acc / TAU) > Math.floor(antes / TAU)) { semAnt = 0; pinta(false); vuelta(); return; }
    pinta(false);
  };
  const angulo = ev => { const p = svg.createSVGPoint(); p.x = ev.clientX; p.y = ev.clientY; const q = p.matrixTransform(svg.getScreenCTM().inverse()); return Math.atan2(q.y - EY, -(q.x - EX)); };
  let arr = false, thPrev = 0;
  const ini = ev => { arr = true; thPrev = angulo(ev); try{ svg.setPointerCapture(ev.pointerId); }catch(e){} luna.classList.add('arr'); ev.preventDefault(); };
  luna.addEventListener('pointerdown', ini);
  svg.addEventListener('pointermove', ev => { if (!arr) return; const th = angulo(ev); let d = th - thPrev; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; thPrev = th; mover(d); });
  const fin = ()=>{ arr = false; luna.classList.remove('arr'); };
  svg.addEventListener('pointerup', fin); svg.addEventListener('pointercancel', fin);
  luna.addEventListener('keydown', ev => { if (/Arrow(Right|Up)/.test(ev.key)){ mover(TAU/28); ev.preventDefault(); } else if (/Arrow(Left|Down)/.test(ev.key)){ mover(-TAU/28); ev.preventDefault(); } });
  $('#mlOir').onclick = ()=>{ fx('tap'); const d = diaDe(acc), k = faseDe(d), s = semDe(d); tocarPiezas([[AUDF[k], F[k].en], ...(s > 0 ? [[AUDS[s-1], SEM[s-1]]] : [])]); };
  $('#mlFin').onclick = ()=>{ fx('fin'); c.finish({stars:3, sinHab:true, html:`<div class="fb ok">${mishi('estrellas')}<span><b>new moon → half moon → full moon → half moon → new moon</b> Four weeks = one month.</span></div>`}); };
  pinta(true);
};

/* ---------- Spelling houses ---------- */
ENGINES.spelling = (a,c)=>{
  const G = a.c, H = G.casas, key = keyAct(RUN.f,a), NOM = ['Ve y escucha','Solo escucha','Día o mes deletreado'];
  let nivel = Math.min(3, NIV()[key]||1);
  const casaDe = L => H.find(h=>h.letras.includes(L));
  const audL = L => tocar('AUD-T01-LS-'+L, L);          /* solo la letra */
  const audEj = L => tocar(L==='Q' ? 'AUD-T01-L-Q2' : 'AUD-T01-L-'+L, L);   /* «A, as in April» al soltarla en su casa (la Q publicada sonaba «U») */
  const retro = (L, k) => L==='E' ? G.retro[0] : (L==='G'||L==='J') ? G.retro[1] : `La ${L} suena como «${casaDe(L).k}»: va en la casa ${casaDe(L).k}.`;
  const ronda = ()=>{
    RUN.items=[]; RUN.fall=[]; c.total(5); RUN.nivelSk = nivel===1 ? 'R' : 'L';
    if (nivel===3) return dictado();
    const todas = mezclar(H.flatMap(h=>h.letras)).slice(0,5);
    let i=0, primeras=0;
    const sig = ()=>{
      if (i>=todas.length){
        const pasa = primeras>=4, sube = pasa && subirNivel(key, nivel);
        return c.finish({html:`<div class="fb ${pasa?'ok':'no'}">${mishi(pasa?'estrellas':'idea')}<span><b>${primeras} de 5 a la primera.</b> ${pasa?(sube?`¡Pasaste! Ya se abrió el nivel ${nivel+1}.`:'¡Pasaste este nivel!'):'Para pasar necesitas 4 de 5. Escucha bien cada letra y vuelve a intentarlo.'}</span></div>`});
      }
      const L = todas[i], ok = casaDe(L); let errs=0, visto = nivel===1, ejemplos = nivel===1, listo=false;
      c.begin();
      const st = c.stage();
      const draw = ()=>{
        st.innerHTML = nivelesHTML(key, nivel, NOM)
          + `<p class="ins" style="margin:6px 0 2px">${nivel===1?'Arrastra la letra a la casa de su sonido.':'Escucha la letra y arrástrala a la casa de su sonido.'}</p>
             <div class="sh-cielo"><button class="sh-letra ${visto?'':'tapada'}" id="shL" aria-label="${visto?'Letra '+L:'Letra tapada: escúchala'}">${visto?L:'?'}</button><button class="aud" id="shOir" aria-label="Escuchar la letra"><i>${PLAY}</i></button></div>
             <div class="sh-casas">${H.map(h=>`<button class="sh-casa" data-k="${h.k}"><span class="techo"></span><b>${esc(h.k)}</b>${ejemplos?`<small>${h.letras[0]}${h.letras[1]?' · '+h.letras[1]:''}</small>`:''}<em class="dentro">${(st._dentro&&st._dentro[h.k]||[]).join(' ')}</em></button>`).join('')}</div>
             <div class="fbz"></div>`;
        const tile = $('#shL', st);
        $('#shOir', st).onclick = ()=>{ fx('tap'); audL(L); };
        const soltar = k => {
          if (listo) return;
          const casa = $(`.sh-casa[data-k="${k}"]`, st);
          if (k === ok.k){
            listo = true; fx('ok'); if (errs===0) primeras++;
            st._dentro = st._dentro || {}; (st._dentro[k] = st._dentro[k] || []).push(L);
            casa.classList.add('bien'); $('.dentro', casa).textContent = st._dentro[k].join(' ');
            tile.textContent = L; tile.classList.remove('tapada'); tile.classList.add('entra');
            audEj(L);
            $('.fbz',st).innerHTML = `<div class="fb ok">${mishi('feliz')}<span><b>Great job! · ¡Muy bien!</b> ${L} va en la casa ${esc(k)}.</span></div><div class="acciones"><button class="btn ch" id="nx">Next<small>Siguiente</small></button></div>`;
            $('#nx').onclick=()=>{ c.done(true); i++; sig(); };
          } else {
            errs++; fx('no'); c.miss(); casa.classList.add('no','sacude'); setTimeout(()=>casa.classList.remove('sacude'), 500);
            if (errs>=2) c.fallo(`Letra ${L}`, `casa ${ok.k}`);
            $('.fbz',st).innerHTML = `<div class="fb no">${mishi('pensando')}<span><b>Next time · La próxima vez</b> ${esc(errs>=2 || nivel===1 ? retro(L) : 'Escúchala otra vez y prueba con otra casa.')}</span></div>`;
          }
        };
        $$('.sh-casa', st).forEach(b=>b.onclick=()=>soltar(b.dataset.k));
        /* arrastrar (dedo o ratón); también se puede tocar la casa */
        let dx=0, dy=0, x0=0, y0=0, mov=false;
        tile.addEventListener('pointerdown', ev=>{ if (listo) return; mov=true; x0=ev.clientX; y0=ev.clientY; try{ tile.setPointerCapture(ev.pointerId); }catch(e){} tile.classList.add('arr'); });
        tile.addEventListener('pointermove', ev=>{ if (!mov) return; dx=ev.clientX-x0; dy=ev.clientY-y0; tile.style.transform=`translate(${dx}px,${dy}px) scale(1.08)`; });
        const suelta = ev=>{ if (!mov) return; mov=false; tile.classList.remove('arr'); tile.style.transform='';
          if (Math.hypot(dx,dy) < 12){ dx=dy=0; if (!visto) audL(L); return; }
          dx=dy=0; tile.style.visibility='hidden'; const el = document.elementFromPoint(ev.clientX, ev.clientY); tile.style.visibility='';
          const casa = el && el.closest && el.closest('.sh-casa'); if (casa) soltar(casa.dataset.k); };
        tile.addEventListener('pointerup', suelta); tile.addEventListener('pointercancel', ()=>{ mov=false; tile.style.transform=''; tile.classList.remove('arr'); });
        $$('[data-niv]',st).forEach(b=>b.onclick=()=>{ const n=+b.dataset.niv; if (n!==nivel){ nivel=n; fx('nav'); st._dentro={}; ronda(); } });
        c.helps([
          ...(!visto?[{label:'Ver la letra',fn:()=>{ visto=true; draw(); }}]:[]),
          ...(!ejemplos?[{label:'Ver letras de ejemplo',fn:()=>{ ejemplos=true; draw(); }}]:[]),
          {label:'Escuchar otra vez',count:false,fn:()=>audL(L)}
        ]);
      };
      draw(); tile0(st); audL(L);
    };
    const tile0 = st => { const t = $('#shL', st); if (t){ t.classList.add('cae'); } };
    c.stage()._dentro = {};
    sig();
  };
  /* nivel 3: un día o un mes deletreado, y el alumno lo escribe */
  const dictado = ()=>{
    const pals = mezclar(G.nivel_3_palabras).slice(0,5); let i=0, primeras=0;
    const sig = ()=>{
      if (i>=pals.length){
        const pasa = primeras>=4; subirNivel(key, nivel);
        return c.finish({html:`<div class="fb ${pasa?'ok':'no'}">${mishi(pasa?'estrellas':'idea')}<span><b>${primeras} de 5 a la primera.</b> ${pasa?'¡Pasaste el nivel 3!':'Para pasar necesitas 4 de 5. Escucha letra por letra y vuelve a intentarlo.'}</span></div>`});
      }
      const w = pals[i]; let errs=0, pista='', letras=false; c.begin();
      const oir = ()=>tocar('AUD-P-SP-'+w, w.toUpperCase().split('').join(', '));
      const st = c.stage();
      const draw = ()=>{
        st.innerHTML = nivelesHTML(key, nivel, NOM)
          + `<p class="ins" style="margin:6px 0 2px">Escucha la palabra deletreada y escríbela. Es un día o un mes.</p>
             <div class="sh-dict"><button class="btn sec ch" id="shOir">${PLAY} Escuchar<small>Listen</small></button>
             ${letras?`<div class="sh-letras">${mezclar(w.toUpperCase().split('')).map(x=>`<span>${x}</span>`).join('')}</div>`:''}
             <form id="shF" class="fila-chat"><input class="hueco" id="shI" maxlength="12" autocomplete="off" autocapitalize="words" spellcheck="false" placeholder="${pista?esc(pista)+'…':'Escribe aquí'}" aria-label="Escribe la palabra"><button class="btn ch">OK</button></form></div>
             <div class="fbz"></div>`;
        $('#shOir',st).onclick=()=>{ fx('tap'); oir(); };
        $('#shF',st).onsubmit=e=>{ e.preventDefault(); const v=$('#shI',st).value.trim();
          if (!v) return;
          if (v.toLowerCase()===w.toLowerCase()){
            fx('ok'); if (errs===0) primeras++;
            $('.fbz',st).innerHTML = `<div class="fb ok">${mishi('feliz')}<span><b>Great job! · ¡Muy bien!</b> ${esc(w)}${v!==w?` (se escribe con mayúscula: ${esc(w)})`:''}.</span></div><div class="acciones"><button class="btn ch" id="nx">Next<small>Siguiente</small></button></div>`;
            $('#shI',st).disabled=true; tocar('AUD-P-'+w, w);
            $('#nx').onclick=()=>{ c.done(true); i++; sig(); };
          } else {
            errs++; fx('no'); c.miss(); if (errs>=2) c.fallo('Deletreo: '+w, w);
            $('.fbz',st).innerHTML = `<div class="fb no">${mishi('pensando')}<span><b>Next time · La próxima vez</b> ${errs>=2?`Era <b>${esc(w)}</b>. Escúchala otra vez y escríbela.`:'Escucha otra vez, letra por letra.'}</span></div>`;
          } };
        $$('[data-niv]',st).forEach(b=>b.onclick=()=>{ const n=+b.dataset.niv; if (n!==nivel){ nivel=n; fx('nav'); ronda(); } });
        c.helps([
          {label:'Escuchar otra vez',count:false,fn:oir},
          ...(!pista?[{label:'Primera letra',fn:()=>{ pista=w[0]; draw(); }}]:[]),
          ...(!letras?[{label:'Ver las letras revueltas',fn:()=>{ letras=true; draw(); }}]:[])
        ]);
      };
      draw(); oir();
    };
    sig();
  };
  ronda();
};

/* ---------- Date builder ---------- */
ENGINES.datebuilder = (a,c)=>{
  const G = a.c, key = keyAct(RUN.f,a), NOM = ['Fichas en orden','Fichas revueltas','Escucha y escribe'];
  let nivel = Math.min(3, NIV()[key]||1);
  const leer = s => { const m = /^(\w+), (\w+) (\d+)(st|nd|rd|th), (\d{4})$/.exec(s.trim()); return m && {wd:m[1], mes:m[2], n:+m[3], suf:m[4], y:m[5]}; };
  const real = d => { const mi = MESES_EN.indexOf(d.mes); const t = new Date(+d.y, mi, d.n); return mi>=0 && t.getDate()===d.n && DIAS_EN[t.getDay()]===d.wd && sufijo(d.n)===d.suf; };
  const FECHAS = G.fechas.map(f=>leer(f.en)).filter(d=>d && real(d));   /* el día de la semana se revisa contra el calendario real */
  const texto = d => `${d.wd}, ${d.mes} ${d.n}${d.suf}, ${d.y}`;
  const piezas = (d, marco='today') => [marco==='today'?['AUD-P-Today-is','Today is']:['AUD-P-My-birthday-is-on','My birthday is on'], ...(d.wd?[['AUD-P-'+d.wd, d.wd]]:[]), ['AUD-P-'+d.mes, d.mes], ['AUD-P-'+d.n+d.suf, d.n+d.suf], ...(d.y?[['AUD-P-'+d.y, d.y]]:[])];
  const hoja = d => `<div class="db-hoja" aria-label="Hoja del calendario"><span class="y">${d.y||''}</span><b>${d.n}</b><span>${d.wd?DIAS_ES[DIAS_EN.indexOf(d.wd)]:''}</span><span class="m">${MESES_ES[MESES_EN.indexOf(d.mes)]}</span></div>`;
  const CAMPOS = ['wd','mes','n','suf','y'], COL = {wd:'c1', mes:'c2', n:'c3', suf:'c3', y:'c4'};
  /* tablero de armado (niveles 1 y 2, y Úsalo) */
  const armar = (st, d, o, alListo)=>{
    const marco = o.marco || 'today', campos = marco==='today' ? CAMPOS : ['mes','n','suf'];
    const fichas = campos.filter(k=>k!=='suf').map(k=>({k, v:String(d[k])}));
    const lista = o.revuelto ? mezclar(fichas) : fichas;
    const ops = o.terminaciones===2 ? mezclar([d.suf, mezclar(['st','nd','rd','th'].filter(x=>x!==d.suf))[0]]) : ['st','nd','rd','th'];
    const pon = {}; let malos = new Set(), cerrado = false;     /* pon[campo] = {v, j} */
    const usada = j => Object.values(pon).some(p=>p.j===j);
    const ranura = k => { const p = pon[k]; return `<button class="db-slot ${o.color?COL[k]:''} ${p?'llena':''} ${malos.has(k)?'mal':''} ${k==='suf'?'suf':''}" data-slot="${k}" aria-label="${k==='suf'?'terminación':'espacio'}">${p?esc(p.v):'&nbsp;'}</button>`; };
    const draw = ()=>{
      const frase = marco==='today'
        ? `Today is ${ranura('wd')}, ${ranura('mes')} ${ranura('n')}${ranura('suf')}, ${ranura('y')}.`
        : `My birthday is on ${ranura('mes')} ${ranura('n')}${ranura('suf')}.`;
      $('.db-tab', st).innerHTML = `<div class="db-frase">${frase}</div>
        <div class="db-fichas">${lista.map((f,j)=>usada(j)?'':`<button class="db-ficha ${o.color?COL[f.k]:''}" data-f="${j}">${esc(f.v)}</button>`).join('')}</div>
        <div class="db-sufs"><span class="nota">Terminación:</span>${ops.map(x=>`<button class="db-ficha suf ${o.color?COL.suf:''} ${pon.suf&&pon.suf.v===x?'usada':''}" data-s="${x}">${x}</button>`).join('')}</div>`;
      if (cerrado) return;
      $$('[data-f]', st).forEach(b=>b.onclick=()=>{ const j = +b.dataset.f, f = lista[j];
        const hueco = o.revuelto ? campos.find(k=>k!=='suf' && !pon[k]) : f.k;   /* en orden: cada ficha a su lugar; revueltas: al primer hueco */
        if (!hueco || pon[hueco]) return; pon[hueco] = {v:f.v, j}; fx('pop'); malos.delete(hueco); draw(); revisar(); });
      $$('[data-s]', st).forEach(b=>b.onclick=()=>{ pon.suf = {v:b.dataset.s, j:-1}; malos.delete('suf'); fx('pop'); draw(); revisar(); });
      $$('[data-slot]', st).forEach(b=>b.onclick=()=>{ const k=b.dataset.slot; if (pon[k]){ delete pon[k]; fx('tap'); draw(); } });
    };
    const revisar = ()=>{
      if (!campos.every(k=>pon[k])) return;
      const mal = campos.filter(k=>pon[k].v!==String(d[k]));
      if (!mal.length){ cerrado = true; draw(); alListo(true, []); return; }
      malos = new Set(mal); draw(); alListo(false, mal);
      setTimeout(()=>{ mal.forEach(k=>delete pon[k]); draw(); }, 700);
    };
    if (!$('.db-tab', st)) st.insertAdjacentHTML('beforeend', '<div class="db-tab"></div>');
    draw();
  };
  const porque = (d, mal, pon) => {
    if (mal.includes('suf')) return d.n%100>=11 && d.n%100<=13 ? G.retro[1] : [1,2,3].includes(d.n%10) ? `${d.n} termina en ${d.n%10}: ${d.n}${d.suf}.` : `${d.n} lleva th: ${d.n}th.`;
    return G.retro[2];
  };
  const ronda = ()=>{
    RUN.items=[]; RUN.fall=[]; c.total(5); RUN.nivelSk = nivel===3 ? 'L' : 'W';
    const fs = mezclar(FECHAS).slice(0,5); let i=0, primeras=0;
    const sig = ()=>{
      if (i>=fs.length){
        const pasa = primeras>=4, sube = pasa && subirNivel(key, nivel);
        c.finish({html:`<div class="fb ${pasa?'ok':'no'}">${mishi(pasa?'estrellas':'idea')}<span><b>${primeras} de 5 a la primera.</b> ${pasa?(sube?`¡Pasaste! Ya se abrió el nivel ${nivel+1}.`:'¡Pasaste este nivel!'):'Para pasar necesitas 4 de 5. Recuerda: día, mes, número con su terminación y año.'}</span></div>${usaloHTML()}`}); usalo(); return;
      }
      const d = fs[i]; let errs=0; c.begin();
      const st = c.stage();
      const bien = ()=>{
        fx('ok'); if (errs===0) primeras++;
        $('.fbz',st).innerHTML = `<div class="fb ok">${mishi('feliz')}<span><b>Great job! · ¡Muy bien!</b> Today is ${esc(texto(d))}.</span></div><div class="acciones"><button class="btn sec ch" id="dbOir">${PLAY} Escuchar<small>Listen</small></button><button class="btn ch" id="nx">Next<small>Siguiente</small></button></div>`;
        tocarPiezas(piezas(d)); $('#dbOir').onclick=()=>tocarPiezas(piezas(d));
        $('#nx').onclick=()=>{ c.done(true); i++; sig(); };
      };
      const mal = (txt)=>{ errs++; fx('no'); c.miss(); if (errs>=2) c.fallo('Fecha: '+texto(d), texto(d));
        $('.fbz',st).innerHTML = `<div class="fb no">${mishi('pensando')}<span><b>Next time · La próxima vez</b> ${esc(txt)}</span></div>`; };
      st.innerHTML = nivelesHTML(key, nivel, NOM)
        + `<div class="db-top">${nivel<3?hoja(d):`<button class="btn sec ch" id="dbEsc">${PLAY} Escuchar la fecha<small>Listen</small></button>`}<p class="ins">${nivel<3?'Arma la fecha en inglés con las fichas.':'Escucha la fecha y escríbela en inglés.'}</p></div><div class="fbz"></div>`;
      $$('[data-niv]',st).forEach(b=>b.onclick=()=>{ const n=+b.dataset.niv; if (n!==nivel){ nivel=n; fx('nav'); ronda(); } });
      if (nivel<3){
        armar(st, d, {color: nivel===1, revuelto: nivel===2, terminaciones: nivel===1?2:4}, (ok, malk)=>{ if (ok) bien(); else mal(porque(d, malk)); });
        $('.fbz',st).before($('.db-tab',st));
        c.helps([
          {label:'Escuchar la fecha',fn:()=>tocarPiezas(piezas(d))},
          {label:'¿En qué orden va?',fn:()=>catSay(`<b>Today is</b> día, mes número+terminación, año.<br>${esc(G.retro[2])}`,'idea',{ms:7000})}
        ]);
      } else {
        const oir = ()=>tocarPiezas(piezas(d));
        $('.fbz',st).insertAdjacentHTML('beforebegin', `<form id="dbF" class="db-escribe"><span>Today is</span><input class="hueco" id="dbI" maxlength="40" autocomplete="off" spellcheck="false" placeholder="Friday, October 30th, 2026" aria-label="Escribe la fecha"><button class="btn ch">OK</button></form>`);
        $('#dbEsc',st).onclick=()=>{ fx('tap'); oir(); };
        const norma = s => s.toLowerCase().replace(/^today is\s*/,'').replace(/[.,]/g,' ').replace(/\s+/g,' ').trim();
        $('#dbF',st).onsubmit=e=>{ e.preventDefault(); const v=$('#dbI',st).value; if (!v.trim()) return;
          if (norma(v)===norma(texto(d))){ $('#dbI',st).disabled=true; bien(); if (!/,/.test(v)) $('.fbz .fb.ok span',st).insertAdjacentHTML('beforeend',' Lleva comas: después del día y antes del año.'); }
          else { const p = leer(v.trim().replace(/^today is\s*/i,'').replace(/\.$/,''));
            mal(p && p.n===d.n && p.suf!==d.suf ? porque(d,['suf']) : errs>=1 ? `Era: ${texto(d)}.` : 'Escucha otra vez: día, mes, número con su terminación y año.'); } };
        c.helps([
          {label:'Escuchar otra vez',count:false,fn:oir},
          {label:'Ver la hoja del calendario',fn:()=>{ $('.db-top',st).insertAdjacentHTML('afterbegin', hoja(d)); }}
        ]);
        oir();
      }
    };
    sig();
  };
  /* Úsalo: la fecha de hoy (calendario del dispositivo) y tu cumpleaños; no se califica */
  const usaloHTML = ()=>`<div class="db-usalo"><b>Úsalo · Use it</b><div class="acciones"><button class="btn sec ch" data-us="hoy">Arma la fecha de hoy<small>Today</small></button><button class="btn sec ch" data-us="cumple">Arma tu cumpleaños<small>My birthday</small></button></div><div class="db-us"></div></div>`;
  const usalo = ()=>$$('[data-us]').forEach(b=>b.onclick=()=>{
    const box = $('.db-us'); if (!box) return; box.innerHTML = '<div class="db-tab"></div><div class="fbz2"></div>'; fx('tap');
    const fin = (d, marco)=>(ok)=>{ if (!ok){ fx('no'); $('.fbz2', box).innerHTML = `<div class="fb no">${mishi('pensando')}<span>${esc(G.retro[2])}</span></div>`; return; }
      fx('ok'); const t = marco==='today' ? `Today is ${texto(d)}.` : `My birthday is on ${d.mes} ${d.n}${d.suf}.`;
      $('.fbz2', box).innerHTML = `<div class="fb ok">${mishi('feliz')}<span><b>${esc(t)}</b></span></div>`; tocarPiezas(piezas(d, marco)); };
    if (b.dataset.us==='hoy'){
      const t = new Date(), d = {wd:DIAS_EN[t.getDay()], mes:MESES_EN[t.getMonth()], n:t.getDate(), suf:sufijo(t.getDate()), y:String(t.getFullYear())};
      box.insertAdjacentHTML('afterbegin', hoja(d)); armar(box, d, {revuelto:true, terminaciones:4}, fin(d,'today'));
    } else {
      box.innerHTML = `<p class="ins">¿En qué mes es tu cumpleaños?</p><div class="db-fichas">${MESES_EN.map((m,j)=>`<button class="db-ficha" data-m="${j}">${m}</button>`).join('')}</div><div class="db-dias"></div><div class="db-tab"></div><div class="fbz2"></div>`;
      $$('[data-m]', box).forEach(x=>x.onclick=()=>{ const mi=+x.dataset.m, nd=new Date(2028, mi+1, 0).getDate(); fx('tap');
        $$('[data-m]', box).forEach(y=>y.classList.toggle('usada', y===x));
        $('.db-dias', box).innerHTML = `<p class="ins">¿Qué día?</p><div class="db-num">${Array.from({length:nd},(_,k)=>`<button class="db-ficha" data-n="${k+1}">${k+1}</button>`).join('')}</div>`;
        $$('[data-n]', box).forEach(y=>y.onclick=()=>{ const n=+y.dataset.n, d={mes:MESES_EN[mi], n, suf:sufijo(n)}; fx('tap');
          $$('[data-n]', box).forEach(z=>z.classList.toggle('usada', z===y)); $('.db-tab', box).innerHTML=''; $('.fbz2', box).innerHTML='';
          armar(box, d, {marco:'cumple', revuelto:true, terminaciones:4}, fin(d,'cumple')); }); });
    }
  });
  ronda();
};

  let h = `<div class="semanas">${tabs.map(([k,t])=>`<button class="${PN.vista===k?'on':''}" data-pv="${k}">${esc(t)}</button>`).join('')}</div>`;
  if (PN.vista!=='aprobar') h += `<div class="semanas" style="margin-top:6px">${grupos.map(g=>`<button class="${PN.grupo===g?'on':''}" data-pg="${esc(g)}">${esc(g)}</button>`).join('')}</div>`;
  if (PN.vista==='aprobar'){
    h += d.trabajos.length ? `<div class="acciones"><button class="btn ch" id="apTodo">Aprobar todo lo que tiene ✓ completo</button></div>` + d.trabajos.map(t=>{ const todo = (t.rev||[]).length && t.rev.every(Boolean);
      return `<div class="card vid trab"><div class="eyebrow">${esc(t.g)} · ${esc(t.s)} · ${esc(t.a)} · ${esc(t.tipo)} · ${esc(String(t.f).slice(0,16))}</div><b>${esc(t.n)}</b>
        <p class="txt">${esc(t.texto)}</p>${(t.rev||[]).length?`<div class="rev">${t.rev.map((x,i)=>`<span class="pill ${x?'bien':''}">${x?'✓':'✗'} ${i+1}</span>`).join('')}${todo?' <span class="pill oro">✓ completo</span>':''}</div>`:''}
        <div class="acciones"><button class="btn ch" data-ap="${esc(t.id)}" data-e="aprobado">Aprobar</button><select class="chip" data-nota="${esc(t.id)}"><option value="">Pedir corrección…</option><option>Revisa la oración 2</option><option>Revisa la terminación del verbo</option><option>Revisa el día</option><option>Revisa las mayúsculas</option><option>Revisa la terminación del número (st, nd, rd, th)</option></select><button class="btn sec ch" data-ap="${esc(t.id)}" data-e="no">No publicar</button></div></div>`; }).join('')
      : `<div class="card vid repaso-cand">${mishi('corazones')}<h3>No hay trabajos por aprobar</h3></div>`;
  }
  const al = d.alumnos.filter(a=>a.g===PN.grupo);
  if (PN.vista==='grupo'){
    const prom = k => { const v = al.filter(a=>a.sk&&a.sk[k]&&a.sk[k].n).map(a=>a.sk[k].a); return v.length ? Math.round(v.reduce((s,x)=>s+x,0)/v.length) : null; };
    const sinIng = al.filter(a=>!a.ing7);
    const ay = {}; al.forEach(a=>Object.keys(a.ay||{}).forEach(k=>ay[k]=(ay[k]||0)+a.ay[k]));
    h += `<div class="skills">${['R','L','W','S'].map(k=>{ const p=prom(k); return `<div class="sk vid2"><div class="h"><i style="--c:${SK[k].c}">${k}</i><b>${SK[k].en}</b><span>promedio</span></div><div class="bar"><b style="width:${p||0}%;background:${SK[k].c}"></b></div><div class="lvl">${p==null?'Sin datos':p+'% · '+escalon(p)}</div></div>`; }).join('')}</div>
      <div class="card vid"><h3>Escalón de cada alumno</h3><div class="scroll"><table class="tabla"><thead><tr><th>Alumno</th>${['R','L','W','S'].map(k=>`<th>${k}</th>`).join('')}<th>Sin ayuda</th><th>Ayudas</th><th>Ingresos (7 días)</th></tr></thead><tbody>
      ${al.map(a=>`<tr><td>${esc(a.n)}</td>${['R','L','W','S'].map(k=>{ const s=a.sk&&a.sk[k]; return `<td>${s&&s.n?`${s.a}%<br><small>${escalon(s.a)}</small>`:'—'}</td>`; }).join('')}<td>${(a.sa||[]).join(' ')||'—'}</td><td>${Object.values(a.ay||{}).reduce((s,x)=>s+x,0)}</td><td>${a.ing7||0}</td></tr>`).join('')}</tbody></table></div></div>
      <div class="card vid"><h3>Ayudas que más usa el grupo</h3><div class="dl">${Object.keys(ay).sort((x,y)=>ay[y]-ay[x]).slice(0,8).map(k=>`<div><b>${esc(k)}</b>${ay[k]} veces</div>`).join('')||'<div>Todavía no hay datos.</div>'}</div></div>
      <div class="card vid"><h3>Sin actividad esta semana</h3><p>${sinIng.map(a=>esc(a.n)).join(' · ')||'Todos entraron.'}</p></div>`;
  }
  if (PN.vista==='alumno'){
    h += `<div class="card vid"><div class="scroll"><table class="tabla"><thead><tr><th>Alumno</th><th>Último ingreso</th><th>Ingresos</th><th>Minutos</th><th>Subtemas</th><th>Actividades</th><th>★</th><th>Medallas</th><th>Videos vistos</th></tr></thead><tbody>
      ${al.map(a=>`<tr><td>${esc(a.n)}</td><td>${esc(a.ult||'—')}</td><td>${a.ing}</td><td>${a.min}</td><td>${a.subs}</td><td>${a.ac}</td><td>${a.es}</td><td>${a.md}</td><td>${a.vid}</td></tr>`).join('')}</tbody></table></div>
      <p class="nota">La Encarta no pone calificaciones en MyClass: tú decides qué registrar.</p></div>`;
  }
  if (PN.vista==='fallados'){
    const f = d.fallados.filter(x=>x.g===PN.grupo).slice(0,5);
    h += `<div class="card vid"><h3>Top 5 de reactivos fallados (últimos 7 días)</h3><div class="dl">${f.map(x=>`<div><b>${esc(x.s)} · ${x.n} veces</b>${esc(x.q)}</div>`).join('')||'<div>Todavía no hay datos.</div>'}</div></div>`;
  }
  h += `<div class="acciones"><button class="btn sec ch" id="pRec">Actualizar</button><button class="btn sec ch" id="pSal">Salir del panel</button></div>`;
  return h;
}
async function cargarPanel(){
  PN.cargando = true; const r = await jsonp({encarta:'m', a:'datos', m:PN.m}); PN.cargando = false;
  if (!r || !r.ok){ if (r && r.e==='SESION'){ PN.m=''; try{ localStorage.removeItem('encarta_mtk'); }catch(e){} PN.msg='Tu sesión del panel terminó. Entra otra vez.'; } else toast('No se pudo cargar. Revisa la conexión.'); pintar(); return; }
  PN.datos = r; pintar();
}
function montarPanel(){
  const f = $('#fPanel');
  if (f){ f.onsubmit = async e=>{ e.preventDefault(); const k = $('#pClave').value; if (!k) return; $('#pMsg').textContent='Revisando…';
    const r = await jsonp({encarta:'m', a:'login', k});
    if (r && r.ok){ PN.m = r.m; PN.msg=''; try{ localStorage.setItem('encarta_mtk', JSON.stringify({m:r.m})); }catch(e){} fx('fin'); pintar(); cargarPanel(); }
    else { fx('no'); $('#pMsg').textContent = r && r.e==='SIN_CLAVE' ? 'Falta poner la clave en las Propiedades del script (ENCARTA_CLAVE).' : r && r.e==='BLOQUEADO' ? 'Demasiados intentos. Espera 15 minutos.' : r && r.e==='RED' ? 'No hay conexión.' : 'Clave incorrecta.'; } };
    return; }
  if (!PN.datos && !PN.cargando){ cargarPanel(); return; }
  $$('[data-pv]').forEach(b=>b.onclick=()=>{ PN.vista=b.dataset.pv; fx('pop'); pintar(); });
  $$('[data-pg]').forEach(b=>b.onclick=()=>{ PN.grupo=b.dataset.pg; fx('pop'); pintar(); });
  const aprobar = async (ids, estado, nota)=>{ const r = await jsonp({encarta:'m', a:'aprobar', m:PN.m, ids:ids.join(','), estado, nota:nota||''}); if (r && r.ok){ fx('ok'); PN.datos.trabajos = PN.datos.trabajos.filter(t=>!ids.includes(t.id)); pintar(); } else toast('No se pudo guardar'); };
  $$('[data-ap]').forEach(b=>b.onclick=()=>aprobar([b.dataset.ap], b.dataset.e));
  $$('[data-nota]').forEach(s=>s.onchange=()=>{ if (s.value) aprobar([s.dataset.nota], 'corregir', s.value); });
  const at = $('#apTodo'); if (at) at.onclick=()=>{ const ids = PN.datos.trabajos.filter(t=>(t.rev||[]).length && t.rev.every(Boolean)).map(t=>t.id); if (!ids.length){ toast('No hay trabajos con ✓ completo'); return; } aprobar(ids,'aprobado'); };
  $('#pRec').onclick=()=>{ PN.datos=null; pintar(); };
  $('#pSal').onclick=()=>{ PN.m=''; PN.datos=null; try{ localStorage.removeItem('encarta_mtk'); }catch(e){} pintar(); };
}

/* arranque */
cargarLocal(); history.pushState(null,''); pintar();
if (S.pant==='inicio' && S.c){ bajarP(); setTimeout(()=>{ if (!P.tour) startTour('home'); else saludar(); }, 700); }
</script>
